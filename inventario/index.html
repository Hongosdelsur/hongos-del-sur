    if(cb) cb();
  }

  /* --- Archivos (Storage). El bucket es privado: todo va con la sesión. --- */

  function subirArchivo(ruta, blob, cb){
    conToken(function(err, tok){
      if(err){ cb(err); return; }
      fetch(URL + "/storage/v1/object/" + ruta, {
        method:"POST",
        headers:{
          apikey:KEY, Authorization:"Bearer " + tok,
          "Content-Type": blob.type || "image/jpeg",
          "x-upsert":"true"
        },
        body: blob
      }).then(function(r){
        if(r.ok){ cb(null); return; }
        r.text().then(function(t){ cb(traducir(t) || ("Error " + r.status)); });
      }, function(){ cb("Sin conexión"); });
    });
  }

  function bajarArchivo(ruta, cb){
    conToken(function(err, tok){
      if(err){ cb(err, null); return; }
      fetch(URL + "/storage/v1/object/" + ruta, {
        headers:{apikey:KEY, Authorization:"Bearer " + tok}
      }).then(function(r){
        if(!r.ok){ cb("Error " + r.status, null); return; }
        r.blob().then(function(b){ cb(null, b); });
      }, function(){ cb("Sin conexión", null); });
    });
  }

  function borrarArchivo(ruta, cb){
    conToken(function(err, tok){
      if(err){ cb && cb(err); return; }
      fetch(URL + "/storage/v1/object/" + ruta, {
        method:"DELETE",
        headers:{apikey:KEY, Authorization:"Bearer " + tok}
      }).then(function(r){ cb && cb(r.ok ? null : "Error " + r.status); },
              function(){ cb && cb("Sin conexión"); });
    });
  }

  // Llamada a la base con la sesión ya renovada si hacía falta.
  function rest(ruta, opciones, cb){
    conToken(function(err, tok){
      if(err){ cb({estado:401, msg:err}, null); return; }
      var o = opciones || {};
      o.token = tok;
      llamar("/rest/v1" + ruta, o, cb);
    });
  }

  // El perfil trae el rol, que es lo que decide qué se puede ver y hacer.
  function traerPerfil(cb){
    conToken(function(err, tok){
      if(err){ cb(err, null); return; }
      llamar("/rest/v1/perfiles?select=id,nombre,rol&id=eq." + encodeURIComponent(ses.uid), {token:tok}, function(e2, d){
        if(e2){ cb(e2.msg, null); return; }
        perfil = (d && d[0]) || null;
        cb(null, perfil);
      });
    });
  }

  // Al volver del enlace del correo, Supabase deja la sesión en el hash de la URL.
  function desdeHash(p, cb){
    guardarSes({
      access_token: p.access_token,
      refresh_token: p.refresh_token || "",
      expira: Date.now() + ((Number(p.expires_in) || 3600) * 1000),
      correo: "", uid: ""
    });
    llamar("/auth/v1/user", {token:p.access_token}, function(err, u){
      // Si el token no sirve, no puede quedar una sesión a medias guardada.
      if(err){ guardarSes(null); cb(err.msg); return; }
      ses.correo = (u && u.email) || "";
      ses.uid = (u && u.id) || "";
      guardarSes(ses);
      cb(null);
    });
  }

  return {
    cargar: cargar,
    traducir: traducir,
    desdeHash: desdeHash,
    sesion: function(){ return ses; },
    perfil: function(){ return perfil; },
    rol: function(){ return perfil ? perfil.rol : null; },
    registrar: registrar,
    entrar: entrar,
    salir: salir,
    traerPerfil: traerPerfil,
    conToken: conToken,
    rest: rest,
    subirArchivo: subirArchivo,
    bajarArchivo: bajarArchivo,
    borrarArchivo: borrarArchivo,
    llamar: llamar
  };
})();

/* ============================================================
   14. Sincronización de lotes
   ============================================================

   Lo local manda: se guarda primero en el teléfono y la nube es la copia que se
   pone al día cuando hay señal. En el galpón sin cobertura se anota igual.

   Cómo sabe qué cambió: guarda una huella (un número corto) de cada lote y cada
   evento tal como quedaron la última vez que se sincronizaron. Lo que hoy tiene
   otra huella, cambió; lo que está en las huellas pero ya no en la app, se borró.
   Así no hubo que tocar ni una de las funciones que ya guardaban datos.

   Primero sube y después baja, a propósito: al bajar, lo recién subido vuelve
   igual y no hay ida y vuelta infinita. Si dos personas editaron lo mismo sin
   señal, queda lo del último que subió.
   ============================================================ */

var SYNC = (function(){
  var CLAVE = "hds_sync_v1";
  var est = {ultima:"1970-01-01T00:00:00Z", huellas:{}};
  var enCurso = false, pendT = null, ultimoError = "";

  function cargarEstado(){
    try{
      var c = localStorage.getItem(CLAVE);
      if(c){
        var d = JSON.parse(c);
        if(d && d.huellas){ est = d; }
      }
    }catch(e){}
    return est;
  }
  function guardarEstado(){
    try{ localStorage.setItem(CLAVE, JSON.stringify(est)); }catch(e){}
  }
  function olvidar(){
    est = {ultima:"1970-01-01T00:00:00Z", huellas:{}, fotos:{}};
    guardarEstado();
  }
  function olvidarFoto(id){
    if(est.fotos) delete est.fotos[id];
    guardarEstado();
  }

  // Huella corta y estable de un objeto: alcanza para saber si cambió.
  function huella(o){
    var s = JSON.stringify(o), h = 5381;
    for(var i=0; i<s.length; i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* --- Traducción entre lo que guarda la app y lo que espera la base --- */

  function aFilaLote(l){
    return {
      id:l.id, cod:l.cod, esp:l.esp || "OTR", otro:l.otro || "", cepa:l.cepa || "",
      finoc:l.finoc || null, bolsas:Number(l.bolsas) || 0, peso:Number(l.peso) || 0,
      est:l.est || "inoc", obs:l.obs || "", por_bolsa:!!l.porBolsa, borrado:false
    };
  }
  function deFilaLote(r, dest){
    var l = dest || {ev:[]};
    l.id = r.id; l.cod = r.cod; l.esp = r.esp; l.otro = r.otro || "";
    l.cepa = r.cepa || ""; l.finoc = r.finoc || ""; l.bolsas = Number(r.bolsas) || 0;
    l.peso = Number(r.peso) || 0; l.est = r.est; l.obs = r.obs || "";
    l.porBolsa = !!r.por_bolsa;
    if(!Array.isArray(l.ev)) l.ev = [];
    return l;
  }
  function aFilaEv(loteId, e){
    return {
      id:e.id, lote_id:loteId, t:e.t, f:e.f, txt:e.txt || "",
      kg:Number(e.kg) || 0, n:Number(e.n) || 0, a:e.a || "",
      b:e.b == null ? null : Number(e.b), o:e.o == null ? null : Number(e.o),
      fotos:e.fotos || [], borrado:false
    };
  }
  function deFilaEv(r, dest){
    var e = dest || {};
    e.id = r.id; e.t = r.t; e.f = r.f; e.txt = r.txt || "";
    e.kg = Number(r.kg) || 0; e.n = Number(r.n) || 0; e.a = r.a || "";
    if(r.b != null) e.b = Number(r.b); else delete e.b;
    if(r.o != null) e.o = Number(r.o); else delete e.o;
    e.fotos = r.fotos || [];
    return e;
  }

  /* --- Qué cambió desde la última vez --- */

  function cambios(){
    var subirL = [], subirE = [], bajaL = [], bajaE = [], vistos = {};

    DB.lotes.forEach(function(l){
      var fl = aFilaLote(l), kl = "L" + l.id;
      vistos[kl] = 1;
      if(est.huellas[kl] !== huella(fl)) subirL.push(fl);
      l.ev.forEach(function(e){
        var fe = aFilaEv(l.id, e), ke = "E" + e.id;
        vistos[ke] = 1;
        if(est.huellas[ke] !== huella(fe)) subirE.push(fe);
      });
    });

    // Lo que estaba sincronizado y ya no está en la app: se borró en este teléfono.
    for(var k in est.huellas){
      if(vistos[k]) continue;
      if(k.charAt(0) === "L") bajaL.push(k.slice(1));
      else bajaE.push(k.slice(1));
    }
    return {lotes:subirL, evs:subirE, bajaLotes:bajaL, bajaEvs:bajaE};
  }

  function hayPendientes(){
    var c = cambios();
    return c.lotes.length + c.evs.length + c.bajaLotes.length + c.bajaEvs.length;
  }

  /* --- Subida --- */

  // PostgREST exige que todos los objetos de un lote traigan las mismas claves,
  // por eso las altas y las bajas viajan en llamadas distintas.
  function subirTanda(tabla, filas, cb){
    if(!filas.length){ cb(null); return; }
    NUBE.rest("/" + tabla, {
      metodo:"POST",
      cabeceras:{Prefer:"resolution=merge-duplicates,return=minimal"},
      cuerpo:filas
    }, function(err){ cb(err ? err.msg : null); });
  }

  // Las bajas van como actualización, no como «inserta o actualiza»: al insertar,
  // PostgreSQL arma la fila y exige las columnas obligatorias antes de darse
  // cuenta de que ya existía, y una baja solo lleva el id.
  function marcarBorradas(tabla, ids, cb){
    if(!ids.length){ cb(null); return; }
    var tanda = ids.slice(0, 60), resto = ids.slice(60);   // la URL tiene largo máximo
    var lista = tanda.map(function(i){ return '"' + i + '"'; }).join(",");
    NUBE.rest("/" + tabla + "?id=in.(" + encodeURIComponent(lista) + ")", {
      metodo:"PATCH",
      cabeceras:{Prefer:"return=minimal"},
      cuerpo:{borrado:true}
    }, function(err){
      if(err){ cb(err.msg); return; }
      marcarBorradas(tabla, resto, cb);
    });
  }

  function subir(c, cb){
    subirTanda("lotes", c.lotes, function(e1){
      if(e1){ cb(e1); return; }
      subirTanda("eventos", c.evs, function(e2){
        if(e2){ cb(e2); return; }
        marcarBorradas("eventos", c.bajaEvs, function(e3){
          if(e3){ cb(e3); return; }
          marcarBorradas("lotes", c.bajaLotes, cb);
        });
      });
    });
  }

  /* --- Bajada --- */

  function bajar(cb){
    var desde = encodeURIComponent(est.ultima);
    NUBE.rest("/lotes?select=*&actualizado=gt." + desde + "&order=actualizado.asc", {}, function(e1, lotes){
      if(e1){ cb(e1.msg); return; }
      NUBE.rest("/eventos?select=*&actualizado=gt." + desde + "&order=actualizado.asc", {}, function(e2, evs){
        if(e2){ cb(e2.msg); return; }
        cb(null, aplicar(lotes || [], evs || []));
      });
    });
  }

  function aplicar(lotes, evs){
    var n = 0, tope = est.ultima, huerfano = null;

    lotes.forEach(function(r){
      if(r.actualizado > tope) tope = r.actualizado;
      var local = lotePorId(r.id);
      if(r.borrado){
        if(local){
          DB.lotes = DB.lotes.filter(function(x){ return x.id !== r.id; });
          n++;
        }
        delete est.huellas["L" + r.id];
        return;
      }
      if(local){ deFilaLote(r, local); }
      else { DB.lotes.push(deFilaLote(r)); }
      est.huellas["L" + r.id] = huella(aFilaLote(lotePorId(r.id)));
      n++;
    });

    evs.forEach(function(r){
      if(r.actualizado > tope) tope = r.actualizado;
      var l = lotePorId(r.lote_id);
      // Un evento sin su lote se deja para después: se anota desde cuándo hay
      // que volver a pedir, para que no se pierda al avanzar la marca de tiempo.
      if(!l){
        if(huerfano == null || r.actualizado < huerfano) huerfano = r.actualizado;
        return;
      }
      var idx = -1;
      for(var i=0; i<l.ev.length; i++) if(l.ev[i].id === r.id){ idx = i; break; }
      if(r.borrado){
        if(idx >= 0){ l.ev.splice(idx, 1); n++; }
        delete est.huellas["E" + r.id];
        return;
      }
      if(idx >= 0) deFilaEv(r, l.ev[idx]);
      else l.ev.push(deFilaEv(r));
      est.huellas["E" + r.id] = huella(aFilaEv(l.id, deFilaEv(r)));
      n++;
    });

    // Si quedó algo huérfano, la marca no se pasa de ahí: la próxima
    // sincronización lo vuelve a traer, ya con su lote presente.
    est.ultima = (huerfano != null && tope >= huerfano) ? est.ultima : tope;
    return n;
  }

  // Después de subir sin problemas, lo local pasa a ser lo conocido.
  function sellar(){
    var nuevas = {};
    DB.lotes.forEach(function(l){
      nuevas["L" + l.id] = huella(aFilaLote(l));
      l.ev.forEach(function(e){ nuevas["E" + e.id] = huella(aFilaEv(l.id, e)); });
    });
    est.huellas = nuevas;
  }

  /* --- Fotografías: los bytes van aparte de las filas --- */

  function idsFotos(){
    var out = [];
    DB.lotes.forEach(function(l){
      l.ev.forEach(function(e){ (e.fotos || []).forEach(function(f){ out.push(f); }); });
    });
    return out;
  }

  // Se suben de a una, y la que falla se reintenta en la próxima sincronización.
  function subirFotos(cb){
    if(!est.fotos) est.fotos = {};
    var faltan = idsFotos().filter(function(id){ return !est.fotos[id]; });
    if(!faltan.length){ cb(0); return; }
    var i = 0, hechas = 0;
    (function paso(){
      if(i >= faltan.length){ cb(hechas); return; }
      var id = faltan[i++];
      FOTOS.leer(id, function(dato){
        // Si la foto no está en este teléfono es de otro: nada que subir.
        if(!dato){ est.fotos[id] = 1; paso(); return; }
        NUBE.subirArchivo(rutaFoto(id), aBlob(dato), function(err){
          if(!err){ est.fotos[id] = 1; hechas++; }
          paso();
        });
      });
    })();
  }

  /* --- La operación completa --- */

  function sincronizar(cb){
    cb = cb || function(){};
    if(enCurso){ cb("ya en curso"); return; }
    if(!NUBE.sesion()){ cb("Sin sesión"); return; }
    var rol = NUBE.rol();
    if(rol !== "dueno" && rol !== "produccion"){ cb("Tu cuenta todavía no tiene acceso"); return; }

    enCurso = true;
    var c = cambios(), subidos = c.lotes.length + c.evs.length + c.bajaLotes.length + c.bajaEvs.length;

    subir(c, function(errSubida){
      if(errSubida){
        enCurso = false; ultimoError = errSubida;
        guardarEstado();
        cb(errSubida);
        return;
      }
      bajar(function(errBajada, bajados){
        enCurso = false;
        if(errBajada){
          ultimoError = errBajada;
          // La subida sí funcionó: se sella igual para no repetirla.
          sellar(); guardarEstado(); guardar();
          cb(errBajada);
          return;
        }
        ultimoError = "";
        sellar();
        est.cuando = new Date().toISOString();
        guardarEstado();
        guardar();
        render();
        // Las fotos van al final: pesan y no deben demorar lo que sí es urgente.
        subirFotos(function(fotos){
          if(fotos) guardarEstado();
          cb(null, {subidos:subidos, bajados:bajados, fotos:fotos});
        });
      });
    });
  }

  // Sincronización sola: se junta el trabajo unos segundos y se manda una vez.
  function pronto(){
    if(!NUBE.sesion()) return;
    clearTimeout(pendT);
    pendT = setTimeout(function(){ sincronizar(function(){}); }, 6000);
  }

  return {
    cargarEstado: cargarEstado,
    sincronizar: sincronizar,
    pronto: pronto,
    hayPendientes: hayPendientes,
    fotosPorSubir: function(){
      if(!est.fotos) return idsFotos().length;
      return idsFotos().filter(function(id){ return !est.fotos[id]; }).length;
    },
    olvidar: olvidar,
    olvidarFoto: olvidarFoto,
    cuando: function(){ return est.cuando; },
    error: function(){ return ultimoError; },
    ocupado: function(){ return enCurso; }
  };
})();

  h += '<input id="f_peso" type="text" inputmode="decimal" value="' + (l.peso ? kg(l.peso) : "") + '" placeholder="opcional"></div></div>';

  h += '<div class="field"><label for="f_seg">Cómo registras la cosecha</label><select id="f_seg">';
  h += '<option value="0"' + (!l.porBolsa ? " selected" : "") + ">Por lote · un peso para toda la tanda</option>";
  h += '<option value="1"' + (l.porBolsa ? " selected" : "") + ">Bolsa por bolsa · para saber el promedio real</option>";
  h += "</select>";
  h += '<span class="hint">Bolsa por bolsa suma a la estadística de rendimiento por cepa. Se puede cambiar cuando quieras: lo ya anotado no se pierde.</span></div>';

  h += '<div class="field"><label for="f_est">Estado del cultivo</label><select id="f_est">';
  ESTADOS.forEach(function(e){
    h += '<option value="' + e.k + '"' + (e.k === l.est ? " selected" : "") + ">" + esc(e.n) + " · " + esc(e.d) + "</option>";
  });
  h += "</select></div>";

  h += '<div class="field"><label for="f_cod">Código del lote</label>';
  h += '<input id="f_cod" data-auto="' + (nuevo ? "1" : "0") + '" value="' + esc(cod) + '" style="font-family:var(--f-mono);font-weight:600;letter-spacing:.04em">';
  h += '<span class="hint">Es el que va impreso en la etiqueta y el que viaja en el código QR.</span></div>';

  h += '<div class="field"><label for="f_obs">Observaciones</label>';
  h += '<textarea id="f_obs" placeholder="Sustrato, proporciones, dónde está…">' + esc(l.obs || "") + "</textarea></div>";

  h += '<div style="margin-top:6px"><button class="btn btn--primary" data-lsave="' + esc(l.id) + '">' + (nuevo ? "Crear lote" : "Guardar") + "</button></div>";
  abrirHoja(h);
}

function guardarLote(id){
  var nuevo = !id;
  var esp  = document.getElementById("f_esp").value;
  var otro = document.getElementById("f_otro").value.trim();
  var cod  = limpiarCod(document.getElementById("f_cod").value);
  var finoc = document.getElementById("f_finoc").value;
  var est  = document.getElementById("f_est").value;

  if(esp === "OTR" && !otro){ avisar("Escribe el nombre del hongo."); return; }
  if(!finoc){ avisar("Falta la fecha de inoculación."); return; }
  if(!cod){ avisar("El lote necesita un código."); return; }
  if(!codLibre(cod, id)){ avisar("Ya existe un lote con el código " + cod + "."); return; }

  var datos = {
    cod: cod, esp: esp, otro: otro,
    cepa: document.getElementById("f_cepa").value.trim(),
    finoc: finoc,
    bolsas: Math.max(0, Math.round(leerNum(document.getElementById("f_bolsas").value))),
    peso: Math.max(0, leerNum(document.getElementById("f_peso").value)),
    porBolsa: document.getElementById("f_seg").value === "1",
    obs: document.getElementById("f_obs").value.trim()
  };

  var l;
  if(nuevo){
    l = {id:nuevoId(), est:est, ev:[]};
    for(var k in datos) l[k] = datos[k];
    // El estado inicial también es un evento: el historial arranca completo.
    agregarEvento(l, {t:"est", a:est, f:(est === "prep" ? hoyISO() : finoc), txt:""});
    DB.lotes.push(l);
  } else {
    l = lotePorId(id);
    for(var k2 in datos) l[k2] = datos[k2];
    if(l.est !== est) ponerEstado(l, est, hoyISO(), "");
  }

  guardar(); cerrarHoja();
  if(nuevo){ abrirLote(l.id); avisar("Lote " + l.cod + " creado"); }
  else { render(); avisar("Lote actualizado"); }
}

/* --- Eventos del lote: cosecha, estado, descarte, observación, foto --- */

var fotosPend = [];

function hojaEvento(loteId, tipo, evId){
  var l = lotePorId(loteId);
  if(!l) return;
  var ev = evId ? l.ev.filter(function(x){ return x.id === evId; })[0] : null;
  if(evId && !ev) return;
  tipo = ev ? ev.t : tipo;
  fotosPend = [];

  var titulos = {
    cos:"Registrar cosecha", est:"Cambiar estado", cont:"Contaminación o descarte",
    nota:"Observación", foto:"Agregar fotografías"
  };
  var titulo = (ev && ev.b) ? "Bolsa " + ev.b + " · " + (Number(ev.o)||1) + "ª oleada" : titulos[tipo];
  var h = '<h2 class="sheet__t">' + (ev ? "Editar · " : "") + titulo + "</h2>";
  h += '<p class="sheet__d">' + esc(l.cod) + " · " + esc(nomLote(l)) + "</p>";

  h += '<div class="field"><label for="e_f">Fecha</label>';
  h += '<input id="e_f" type="date" value="' + esc(ev ? ev.f : hoyISO()) + '"></div>';

  if(tipo === "cos"){
    h += '<div class="f2"><div class="field"><label for="e_kg">Peso cosechado (kg)</label>';
    h += '<input id="e_kg" type="text" inputmode="decimal" value="' + (ev ? kg(ev.kg) : "") + '" placeholder="Ej: 2,4"></div>';
    h += '<div class="field"><label>Oleada</label><input value="' + (ev ? "" : (numOleadas(l) + 1) + "ª") + '" disabled style="opacity:.6"></div></div>';
  }
  if(tipo === "est"){
    h += '<div class="field"><label for="e_a">Nuevo estado</label><select id="e_a">';
    ESTADOS.forEach(function(x){
      var sel = ev ? ev.a === x.k : x.k === siguienteEstado(l.est);
      h += '<option value="' + x.k + '"' + (sel ? " selected" : "") + ">" + esc(x.n) + " · " + esc(x.d) + "</option>";
    });
    h += "</select></div>";
  }
  if(tipo === "cont"){
    h += '<div class="field"><label for="e_n">Bolsas afectadas</label>';
    h += '<input id="e_n" type="number" inputmode="numeric" step="1" min="0" value="' + (ev ? ev.n : 1) + '">';
    h += '<span class="hint">Quedan ' + bolsasVivas(l) + " bolsas sanas en este lote.</span></div>";
  }

  h += '<div class="field"><label for="e_txt">' + (tipo === "cont" ? "Qué pasó" : "Observación") + "</label>";
  h += '<textarea id="e_txt" placeholder="' + (tipo === "cont" ? "Trichoderma en la base, bolsas retiradas…" : "opcional") + '">' + esc(ev ? ev.txt : "") + "</textarea></div>";

  h += '<div class="field"><label>Fotografías</label>';
  h += '<button class="btn btn--ghost" data-lact="addfoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.2l1.8-2h6l1.8 2H20v11H4Z"/><circle cx="12" cy="13" r="3.2"/></svg>Agregar fotos</button>';
  h += '<div class="evgal" id="pendGal"></div></div>';

  h += '<div style="margin-top:6px"><button class="btn btn--primary" data-esave="' + esc(loteId) + '" data-etipo="' + tipo + '" data-eid="' + esc(evId || "") + '">Guardar</button></div>';
  if(ev) h += '<div style="margin-top:9px"><button class="btn btn--danger" data-eborrar="' + esc(evId) + '" data-elote="' + esc(loteId) + '">Eliminar este evento</button></div>';
  abrirHoja(h);
  if(ev && (ev.fotos || []).length) pintarPendientes(ev.fotos);
}

// Al cambiar de estado, la app propone el siguiente paso del ciclo.
function siguienteEstado(k){
  var orden = ["prep","inoc","incu","fruc","cose","fin"];
  var i = orden.indexOf(k);
  return i < 0 || i === orden.length-1 ? "fin" : orden[i+1];
}

function pintarPendientes(idsGuardadas){
  var caja = document.getElementById("pendGal");
  if(!caja) return;
  var h = "";
  (idsGuardadas || []).forEach(function(id){ h += '<button data-ver="' + esc(id) + '"><img data-foto="' + esc(id) + '" alt=""></button>'; });
  fotosPend.forEach(function(d, i){ h += '<img src="' + d + '" alt="Foto por guardar ' + (i+1) + '">'; });
  caja.innerHTML = h;
  cargarFotos(caja);
}

function guardarEvento(loteId, tipo, evId){
  var l = lotePorId(loteId);
  if(!l) return;
  var ev = evId ? l.ev.filter(function(x){ return x.id === evId; })[0] : null;
  var f = document.getElementById("e_f").value || hoyISO();
  var txt = document.getElementById("e_txt").value.trim();

  var kgv = 0, nv = 0, av = "";
  if(tipo === "cos"){
    kgv = Math.max(0, leerNum(document.getElementById("e_kg").value));
    if(!kgv){ avisar("¿Cuántos kilos cosechaste?"); return; }
  }
  if(tipo === "cont"){
    nv = Math.max(0, Math.round(parseFloat(document.getElementById("e_n").value) || 0));
    if(!nv && !txt){ avisar("Anota cuántas bolsas o qué pasó."); return; }
  }
  if(tipo === "est") av = document.getElementById("e_a").value;
  if(tipo === "foto" && !fotosPend.length && !(ev && (ev.fotos || []).length) && !txt){ avisar("Agrega al menos una foto."); return; }

  guardarFotosPendientes(function(nuevas){
    var aviso = "Guardado";
    if(ev){
      ev.f = f; ev.txt = txt;
      if(tipo === "cos") ev.kg = kgv;
      if(tipo === "cont") ev.n = nv;
      if(tipo === "est"){ ev.a = av; l.est = ultimoEstado(l); }
      ev.fotos = (ev.fotos || []).concat(nuevas);
    } else if(tipo === "est"){
      var ue = ponerEstado(l, av, f, txt);
      if(ue){ ue.fotos = nuevas; aviso = "Ahora está en " + estDe(av).n; }
      else aviso = "El lote ya estaba en " + estDe(av).n;
    } else {
      // Cosechar sobre un lote que aún figura en incubación lo pasa a cosecha solo.
      if(tipo === "cos" && !CERRADOS[l.est] && l.est !== "cose"){
        ponerEstado(l, "cose", f, "");
        aviso = "Cosecha anotada · el lote pasó a Cosecha";
      } else if(tipo === "cos"){
        aviso = kg(kgv) + " kg anotados";
      }
      agregarEvento(l, {t:tipo, f:f, txt:txt, kg:kgv, n:nv, fotos:nuevas});
    }

    // Si se descartaron todas las bolsas, el lote se cierra.
    if(tipo === "cont" && bolsasVivas(l) === 0 && !CERRADOS[l.est]){
      ponerEstado(l, "desc", f, "Sin bolsas sanas");
      aviso = "Lote descartado: no quedan bolsas sanas";
    }

    guardar(); cerrarHoja(); render();
    avisar(aviso);
  });
}

function ultimoEstado(l){
  var es = evsOrden(l).filter(function(x){ return x.t === "est"; });
  return es.length ? es[es.length-1].a : l.est;
}

function guardarFotosPendientes(cb){
  if(!fotosPend.length){ cb([]); return; }
  var ids = [], i = 0, total = fotosPend.length;
  (function paso(){
    if(i >= total){ fotosPend = []; cb(ids); return; }
    var id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    var dato = fotosPend[i++];
    FOTOS.guardar(id, dato, function(ok){
      if(ok) ids.push(id);
      else avisar("No se pudo guardar una foto (falta espacio)");
      paso();
    });
  })();
}

function borrarEvento(loteId, evId){
  var l = lotePorId(loteId);
  if(!l) return;
  var ev = l.ev.filter(function(x){ return x.id === evId; })[0];
  if(!ev) return;
  if(!confirm("¿Eliminar «" + tituloEvento(l, ev) + "» del historial?")) return;
  (ev.fotos || []).forEach(function(f){ FOTOS.borrar(f); });
  l.ev = l.ev.filter(function(x){ return x.id !== evId; });
  if(ev.t === "est") l.est = ultimoEstado(l);
  guardar(); cerrarHoja(); render();
  avisar("Evento eliminado");
}

/* --- Cosecha bolsa por bolsa --- */

// Pesaje de una oleada completa: una fila por bolsa, se guarda a medida que se escribe.
function hojaBolsas(loteId, fecha, oleada){
  var l = lotePorId(loteId);
  if(!l) return;
  if(!totalBolsas(l)){ avisar("Primero carga cuántas bolsas tiene el lote."); return; }
  var ol = Number(oleada) || siguienteOleada(l);

  var h = '<h2 class="sheet__t">Cosecha por bolsa</h2>';
  h += '<p class="sheet__d">' + esc(l.cod) + " · " + esc(nomLote(l)) + ". Pesa y anota: se guarda solo. La bolsa que no cosechaste se deja vacía.</p>";
  h += '<div class="f2"><div class="field"><label for="bb_f">Fecha</label>';
  h += '<input id="bb_f" type="date" value="' + esc(fecha || hoyISO()) + '"></div>';
  h += '<div class="field"><label for="bb_o">Oleada</label><select id="bb_o">';
  for(var i=1; i<=Math.max(6, ol+1); i++) h += '<option value="' + i + '"' + (i === ol ? " selected" : "") + ">" + i + "ª oleada</option>";
  h += "</select></div></div>";
  h += '<div id="bbLista" data-lote="' + esc(l.id) + '"></div>';
  h += '<div style="margin-top:14px"><button class="btn btn--primary" data-bfin="1">Listo</button></div>';
  abrirHoja(h);
  pintarFilasBolsas(l.id);
}

function pintarFilasBolsas(loteId){
  var l = lotePorId(loteId), caja = document.getElementById("bbLista");
  if(!l || !caja) return;
  var ol = Number(document.getElementById("bb_o").value) || 1;
  var tot = totalBolsas(l), h = "";
  for(var i=1; i<=tot; i++){
    var ev = cosechaDe(l, i, ol), fuera = bolsaDescartada(l, i);
    h += '<div class="brow' + (ev ? " tiene" : "") + (fuera ? " fuera" : "") + '" data-brow="' + i + '">';
    h += '<span class="brow__n">' + i + "</span>";
    h += '<span class="brow__c"><input type="text" inputmode="decimal" data-bin="' + i + '" value="' + (ev ? kg(ev.kg) : "") + '"';
    h += ' placeholder="' + (fuera ? "descartada" : "—") + '" aria-label="Kilos de la bolsa ' + i + '">';
    h += '<span class="brow__u">kg</span></span></div>';
  }
  h += '<div class="btot"><span id="bbCuenta">—</span><span><b id="bbTot">0</b> kg</span></div>';
  caja.innerHTML = h;
  actualizarTotalOleada(loteId);
}

function actualizarTotalOleada(loteId){
  var l = lotePorId(loteId);
  if(!l || !document.getElementById("bb_o")) return;
  var ol = Number(document.getElementById("bb_o").value) || 1, suma = 0, n = 0;
  l.ev.forEach(function(e){
    if(e.t === "cos" && e.b && (Number(e.o)||1) === ol){ suma += Number(e.kg) || 0; n++; }
  });
  var t = document.getElementById("bbTot"), c = document.getElementById("bbCuenta");
  if(t) t.textContent = kg(suma);
  if(c) c.textContent = n ? n + (n === 1 ? " bolsa · promedio " : " bolsas · promedio ") + Math.round((suma/n)*1000) + " g" : "sin pesar todavía";
}

// Escribir en una fila crea, corrige o borra el registro de esa bolsa.
function anotarBolsa(loteId, n, texto){
  var l = lotePorId(loteId);
  if(!l) return;
  var f = (document.getElementById("bb_f") || {}).value || hoyISO();
  var ol = Number(document.getElementById("bb_o").value) || 1;
  var ev = cosechaDe(l, n, ol), vacio = String(texto).trim() === "";

  if(vacio){
    if(ev) l.ev = l.ev.filter(function(x){ return x.id !== ev.id; });
  } else {
    var v = Math.max(0, leerNum(texto));
    if(ev){ ev.kg = v; ev.f = f; }
    else agregarEvento(l, {t:"cos", f:f, kg:v, b:n, o:ol, txt:""});
    if(!CERRADOS[l.est] && l.est !== "cose") ponerEstado(l, "cose", f, "");
  }
  guardar();

  var fila = document.querySelector('.brow[data-brow="' + n + '"]');
  if(fila) fila.classList.toggle("tiene", !vacio);
  actualizarTotalOleada(loteId);
}

// Una bolsa suelta: es lo que se abre al escanear el QR de esa bolsa.
function hojaBolsa(loteId, n){
  var l = lotePorId(loteId);
  if(!l) return;
  n = Number(n);
  var regs = l.ev.filter(function(e){ return e.t === "cos" && Number(e.b) === n; })
    .sort(function(a,b){ return (Number(a.o)||1) - (Number(b.o)||1); });
  var suma = 0;
  regs.forEach(function(e){ suma += Number(e.kg) || 0; });
  var fuera = bolsaDescartada(l, n);
  var usadas = {};
  regs.forEach(function(e){ usadas[Number(e.o)||1] = true; });
  var prop = 1;
  while(usadas[prop]) prop++;

  var h = '<h2 class="sheet__t">Bolsa ' + n + " de " + totalBolsas(l) + "</h2>";
  h += '<p class="sheet__d">' + esc(l.cod) + " · " + esc(nomLote(l)) + (l.cepa ? " · cepa " + esc(l.cepa) : "") + "</p>";

  if(regs.length){
    h += '<div class="tiles" style="margin-top:0;grid-template-columns:repeat(2,1fr)">';
    h += '<div class="tile"><div class="tile__k">Lleva cosechado</div><div class="tile__v">' + Math.round(suma*1000) + '</div><div class="tile__s">gramos en ' + regs.length + (regs.length === 1 ? " oleada" : " oleadas") + "</div></div>";
    h += '<div class="tile"><div class="tile__k">Promedio del lote</div><div class="tile__v">' + (statsBolsas(l).prom ? Math.round(statsBolsas(l).prom*1000) : "—") + '</div><div class="tile__s">g por bolsa</div></div>';
    h += "</div>";
    h += '<div class="card" style="margin-top:12px"><div class="card__body" style="padding-top:12px">';
    regs.forEach(function(e){
      h += '<button class="ev" data-lev="' + esc(e.id) + '"><span class="ev__i">' + ICO_EV.cos + "</span>";
      h += '<span class="ev__b"><span class="ev__t">' + (Number(e.o)||1) + "ª oleada · " + kg(e.kg) + " kg</span>";
      h += '<span class="ev__d">' + esc(fechaAnio(e.f)) + "</span></span></button>";
    });
    h += "</div></div>";
  }

  if(fuera){
    h += '<p class="note" style="color:var(--crit)">Esta bolsa está marcada como descartada.</p>';
    h += '<div style="margin-top:6px"><button class="btn btn--ghost" data-bundesc="' + n + '">Quitar el descarte</button></div>';
  } else {
    h += '<h3 class="sheet__t" style="font-size:1rem;margin:18px 0 10px">Anotar cosecha</h3>';
    h += '<div class="f2"><div class="field"><label for="b_kg">Peso (kg)</label>';
    h += '<input id="b_kg" type="text" inputmode="decimal" placeholder="Ej: 0,42"></div>';
    h += '<div class="field"><label for="b_o">Oleada</label><select id="b_o">';
    for(var i=1; i<=Math.max(6, prop); i++) h += '<option value="' + i + '"' + (i === prop ? " selected" : "") + ">" + i + "ª oleada</option>";
    h += "</select></div></div>";
    h += '<div class="field"><label for="b_f">Fecha</label><input id="b_f" type="date" value="' + hoyISO() + '"></div>';
    h += '<div style="margin-top:6px"><button class="btn btn--primary" data-bsave="' + n + '">Guardar</button></div>';
    h += '<div style="margin-top:9px"><button class="btn btn--danger" data-bdesc="' + n + '">Descartar esta bolsa</button></div>';
  }
  abrirHoja(h);
  setTimeout(function(){
    var c = document.getElementById("b_kg");
    if(c) c.focus();
  }, 150);
}

function guardarBolsa(loteId, n){
  var l = lotePorId(loteId);
  if(!l) return;
  var v = Math.max(0, leerNum(document.getElementById("b_kg").value));
  if(!v){ avisar("¿Cuánto pesó esta bolsa?"); return; }
  var ol = Number(document.getElementById("b_o").value) || 1;
  var f = document.getElementById("b_f").value || hoyISO();
  var ev = cosechaDe(l, n, ol);
  if(ev){ ev.kg = v; ev.f = f; }
  else agregarEvento(l, {t:"cos", f:f, kg:v, b:Number(n), o:ol, txt:""});
  if(!CERRADOS[l.est] && l.est !== "cose") ponerEstado(l, "cose", f, "");
  guardar(); cerrarHoja(); render();
  var s = statsBolsas(l);
  avisar("Bolsa " + n + ": " + kg(v) + " kg · promedio del lote " + Math.round(s.prom*1000) + " g");
}

function descartarBolsa(loteId, n, quitar){
  var l = lotePorId(loteId);
  if(!l) return;
  if(quitar){
    l.ev = l.ev.filter(function(e){ return !(e.t === "cont" && Number(e.b) === Number(n)); });
    avisar("Bolsa " + n + " vuelve a contar");
  } else {
    agregarEvento(l, {t:"cont", f:hoyISO(), n:1, b:Number(n), txt:"Bolsa " + n + " descartada"});
    avisar("Bolsa " + n + " descartada");
  }
  guardar(); cerrarHoja(); render();
}

/* --- Etiqueta con QR --- */

var etiqChica = false, etiqNumerar = null;

function hojaEtiqueta(loteId, cant){
  var l = lotePorId(loteId);
  if(!l) return;
  if(etiqNumerar == null) etiqNumerar = !!l.porBolsa;
  if(cant == null) cant = Math.max(1, Number(l.bolsas) || bolsasVivas(l) || 1);
  var url = urlLote(l, etiqNumerar ? 1 : 0);
  var svgQR = QR.svg(url, "", 2);

  var h = '<h2 class="sheet__t">Etiqueta del lote</h2>';
  h += '<p class="sheet__d">Se imprime en hoja A4 con guías de corte. Al escanear el QR desde el teléfono se abre ' +
       (etiqNumerar ? "el pesaje de esa bolsa" : "la ficha de este lote") + ".</p>";
  h += '<div class="etprev" id="etPrev">' + etiquetaHTML(l, etiqChica, svgQR, etiqNumerar ? 1 : 0, cant) + "</div>";

  h += '<div class="field"><label for="t_num">Tipo de etiqueta</label><select id="t_num">';
  h += '<option value="0"' + (etiqNumerar ? "" : " selected") + ">Todas iguales · el QR abre el lote</option>";
  h += '<option value="1"' + (etiqNumerar ? " selected" : "") + ">Numeradas 1, 2, 3… · el QR abre esa bolsa</option>";
  h += "</select></div>";

  h += '<div class="f2"><div class="field"><label for="t_tam">Tamaño</label><select id="t_tam">';
  h += '<option value="0"' + (etiqChica ? "" : " selected") + ">Mediana · 64×46 mm (18 por hoja)</option>";

function hojaEquipo(){
  abrirHoja('<h2 class="sheet__t">Equipo</h2><p class="sheet__d">Buscando…</p>');
  NUBE.rest("/perfiles?select=id,nombre,rol,creado&order=creado.asc", {}, function(err, gente){
    if(err){ abrirHoja('<h2 class="sheet__t">Equipo</h2><p class="sheet__d" style="color:var(--crit)">' + esc(err.msg) + "</p>"); return; }
    var yo = NUBE.sesion();

    (gente || []).forEach(function(p){
      var soyYo = yo && p.id === yo.uid;
      var r = ROLES_TXT[p.rol] || {n:p.rol};
      h += '<div class="buy" style="border-top:1px solid var(--line-soft)">';
      h += '<div class="buy__t"><div class="buy__n">' + esc(p.nombre || "sin nombre") + (soyYo ? " · tú" : "") + "</div>";
      h += '<div class="buy__m">' + esc(r.n) + "</div></div></div>";
      if(!soyYo){
        h += '<div class="btnrow" style="margin:0 0 12px;padding:0 14px">';

function cambiarRol(id, rol){
  NUBE.rest("/perfiles?id=eq." + encodeURIComponent(id), {
    metodo:"PATCH",
    cabeceras:{Prefer:"return=minimal"},
    cuerpo:{rol:rol}
  }, function(err){
    if(err){ avisar(err.msg); return; }
    avisar(rol === "bloqueado" ? "Acceso bloqueado" : rol === "produccion" ? "Ahora puede registrar producción" : "Queda en espera");
    hojaEquipo();
  });
}

function tocarNube(accion){
  if(accion === "modo") return;

  if(accion === "salir"){
    NUBE.salir(function(){
      // Se olvida lo sincronizado: si después entra otra persona en este
      // teléfono, se vuelve a comparar todo desde cero.
      SYNC.olvidar();
      aplicarRol();
      hojaNube();
      avisar("Sesión cerrada");
    });
    return;
  }
  if(accion === "refrescar"){
    avisar("Comprobando…");
    NUBE.traerPerfil(function(err){
      if(err){ avisar(err); return; }
      aplicarRol();
      hojaNube();
    });
    return;
  }
  if(accion === "equipo"){ hojaEquipo(); return; }
  if(accion === "sincronizar"){
    if(SYNC.ocupado()){ avisar("Ya está sincronizando…"); return; }
    avisar("Sincronizando…");
    SYNC.sincronizar(function(err, r){
      if(err){ avisar(err); hojaNube(); return; }
      avisar(!r.subidos && !r.bajados && !r.fotos ? "Todo estaba al día"
           : "Listo · " + r.subidos + " subidos, " + r.bajados + " recibidos" + (r.fotos ? ", " + r.fotos + " fotos" : ""));
      hojaNube();
    });
    return;
  }

  var correo = (document.getElementById("n_correo").value || "").trim();
  var clave  = document.getElementById("n_clave").value || "";
  if(!correo || correo.indexOf("@") < 0){ avisar("Escribe un correo válido."); return; }
  if(clave.length < 6){ avisar("La clave necesita al menos 6 caracteres."); return; }

  if(accion === "crear"){
    var nom = (document.getElementById("n_nom").value || "").trim();
    if(!nom){ avisar("Escribe tu nombre."); return; }
    avisar("Creando la cuenta…");
    NUBE.registrar(correo, clave, nom, function(err, como){
      if(err){ avisar(err); return; }
      if(como === "confirmar"){
        cerrarHoja();
        avisar("Revisa tu correo y confirma la cuenta para poder entrar");
        return;
      }
      NUBE.traerPerfil(function(){ aplicarRol(); hojaNube(); avisar("Cuenta creada"); });
    });
    return;
  }

  avisar("Entrando…");
  NUBE.entrar(correo, clave, function(err){
    if(err){ avisar(err); return; }
    NUBE.traerPerfil(function(){
      aplicarRol();
      hojaNube();
      avisar("Sesión iniciada");
      SYNC.sincronizar(function(e2, r){
        if(!e2 && r && (r.subidos || r.bajados)) avisar("Sincronizado · " + r.subidos + " subidos, " + r.bajados + " recibidos");
      });
    });
  });
}

// Dos caminos: en claude.ai se usa el diálogo del visor; abierto como archivo
// local, una descarga normal del navegador.
function descargar(nombre, texto, mime){
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    viaVisor(nombre, texto, false);
    return;
  }
  try{
    var blob = new Blob([texto], {type:(mime || "text/plain") + ";charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    avisar("Archivo descargado");
  }catch(e){
    avisar("Este navegador no permitió descargar el archivo");
  }
}

function viaVisor(nombre, texto, reintento){
  window.claude.downloads.save({filename:nombre, data:texto}).then(function(){
    avisar(reintento ? "Guardado como .txt — renómbralo a .csv para Excel" : "Archivo guardado");
  }, function(err){
    var code = err && err.code;
    // .csv no siempre está habilitado; .txt con el mismo contenido sí sirve.
    if(code === "extension_not_enabled" && !reintento){
      viaVisor(nombre.replace(/\.[^.]+$/, "") + ".txt", texto, true);
      return;
    }
    if(code === "declined") return;
    avisar("No se pudo guardar el archivo");
  });
}

function csvInventario(){
  var f = [["Etapa","Insumo","Unidad","Stock","Minimo","Consumo semanal","Cobertura (sem)","Costo unitario","Valor","Proveedor","Estado"]];
  activos().forEach(function(i){
    var cp = consumoProm(i.id), cob = cobertura(i.id);
    var est = estado(i);
    f.push([
      etapaDe(i.et).n, i.nom, i.uni,
      num(stock(i.id)), num(i.min),
      cp == null ? "" : num(cp),
      cob == null ? "" : num(cob),
      i.costo || "", Math.round(stock(i.id) * (i.costo || 0)) || "",
      i.prov,
      est === "vivo" ? "stock vivo" : est === "crit" ? "comprar" : est === "warn" ? "se acaba" : "ok"
    ]);
  });
  // Punto y coma: es el separador que espera Excel en configuración chilena.
  // El BOM inicial hace que Excel respete los acentos.
  return "﻿" + f.map(function(fila){
    return fila.map(function(c){
      c = String(c == null ? "" : c);
      return /[";\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
    }).join(";");
  }).join("\r\n");
}

function csvLotes(){
  var f = [["Codigo","Hongo","Nombre cientifico","Cepa","Inoculacion","Dias","Estado","Bolsas","Descartadas","Peso por bolsa (kg)","Cosechado (kg)","Oleadas","Rendimiento (g/bolsa)","Sobre sustrato (%)","Bolsas pesadas","Promedio medido (g)","Minimo (g)","Maximo (g)","Estimado cosecha","Observaciones"]];
  var hoy = hoyISO();
  ordenarLotes("todos").forEach(function(l){
    var rb = rendBolsa(l), rp = rendPct(l), e = estimado(l), s = statsBolsas(l);
    f.push([
      l.cod, nomLote(l), sciLote(l), l.cepa || "",
      l.finoc || "", l.finoc ? diasEntre(l.finoc, hoy) : "",
      estDe(l.est).n, Number(l.bolsas) || 0, descartadas(l), l.peso ? kg(l.peso) : "",
      kg(kgLote(l)), numOleadas(l),
      rb == null ? "" : Math.round(rb),
      rp == null ? "" : num(rp),
      s.n || "", s.n ? Math.round(s.prom*1000) : "", s.n ? Math.round(s.min*1000) : "", s.n ? Math.round(s.max*1000) : "",
      e ? e.f : "", (l.obs || "").replace(/\s+/g," ")
    ]);
  });
  return "﻿" + f.map(function(fila){
    return fila.map(function(c){
      c = String(c == null ? "" : c);
      return /[";\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
    }).join(";");
  }).join("\r\n");
}

// El respaldo se lleva también las fotografías, que viven fuera de localStorage.
function respaldar(){
  var ids = [];
  DB.lotes.forEach(function(l){
    l.ev.forEach(function(e){ (e.fotos || []).forEach(function(f){ ids.push(f); }); });
  });
  if(!ids.length){
    descargar("inventario-hongos-" + hoyISO() + ".json", JSON.stringify(DB), "application/json");
    return;
  }
  avisar("Preparando el respaldo con " + ids.length + " fotos…");
  FOTOS.varias(ids, function(fotos){
    var copia = JSON.parse(JSON.stringify(DB));
    copia._fotos = fotos;
    descargar("inventario-hongos-" + hoyISO() + ".json", JSON.stringify(copia), "application/json");
  });
}

function textoCompra(){
  var l = porComprar();
  if(!l.length) return "No falta nada por ahora.";
  var t = "Lista de compra · Hongos del Sur · " + fechaLarga(hoyISO()) + "\n";
  var etAct = "";
  l.forEach(function(x){
    var en = etapaDe(x.it.et).n;
    if(en !== etAct){ t += "\n" + en.toUpperCase() + "\n"; etAct = en; }
    t += "• " + x.it.nom + " — " + num(x.sug) + " " + x.it.uni;
    if(x.est === "crit") t += "  (urgente)";
    t += "\n";
  });
  return t;
}

function restaurar(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var lector = new FileReader();
    lector.onload = function(){
      try{
        var d = JSON.parse(String(lector.result).replace(/^﻿/,""));
        if(!d || !Array.isArray(d.items) || !Array.isArray(d.semanas)) throw new Error("formato");
        var fotos = d._fotos;
        delete d._fotos;
        DB = normalizar(d);
        var fin = function(){
          guardar(); cerrarHoja(); loteAbierto = null; limpiarHash(); irA("conteo");
          avisar("Respaldo restaurado: " + d.items.length + " insumos y " + DB.lotes.length + " lotes");
        };
        if(fotos) FOTOS.poner(fotos, fin); else fin();
      }catch(e){
        avisar("Ese archivo no es un respaldo válido");
      }
    };
    lector.readAsText(f);
  };
  inp.click();
}

// Actualiza en sitio, sin re-pintar la lista: así no salta el scroll ni se pierde
// el resto de la pantalla mientras se recorre la bodega.
function todoIgual(etk){
  var b = borrador();
  activos().filter(function(i){ return i.et === etk; }).forEach(function(i){
    if(b.v[i.id] == null) b.v[i.id] = ultimoCerrado(i.id);
    b.r[i.id] = true;
    var inp = document.querySelector('[data-in="' + i.id + '"]');
    if(inp) inp.value = b.v[i.id];
    var fila = document.querySelector('.row[data-id="' + i.id + '"]');
    if(fila){ fila.classList.add("done"); fila.classList.remove("pend"); }
    refrescarFila(i.id);
  });
  guardar();
  actualizarContadorEtapa(etk);
  actualizarProgreso();
  avisar("Etapa confirmada sin cambios");
}

function cerrarSemana(){
  var b = borrador(), tot = activos().length;
  var listos = activos().filter(function(i){ return b.r[i.id]; }).length;
  if(listos === 0){ avisar("Todavía no has contado nada."); return; }
  if(listos < tot){
    if(!confirm("Te faltan " + (tot - listos) + " insumos por revisar.\n\nLos que no revisaste quedarán con el valor de la semana pasada. ¿Cerrar igual?")) return;
  }
  activos().forEach(function(i){
    if(b.v[i.id] == null) b.v[i.id] = ultimoCerrado(i.id);
  });
  b.cerrada = true;
  b.f = hoyISO();
  guardar();
  abiertas = {"1":true};
  render();
  avisar("Conteo del " + fechaCorta(b.f) + " guardado");
}

var VISTAS = ["conteo","lotes","ficha","resumen","insumos"];

function render(){
  if(vista === "conteo")  pintarConteo();
  if(vista === "lotes")   pintarLotes();
  if(vista === "ficha")   pintarFicha();
  if(vista === "resumen") pintarResumen();
  if(vista === "insumos") pintarInsumos();
  document.getElementById("progWrap").hidden = vista !== "conteo";
  actualizarProgreso();
}

function irA(t){
  vista = t;
  VISTAS.forEach(function(k){
    document.getElementById("tab-" + k).hidden = k !== t;
  });
  // La ficha vive dentro de Lotes: la pestaña sigue encendida mientras se navega.
  var pest = t === "ficha" ? "lotes" : t;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.classList.toggle("on", b.dataset.tab === pest);
  });

  var l = t === "ficha" ? lotePorId(loteAbierto) : null;
  var titulos = {conteo:"Inventario", lotes:"Lotes", resumen:"Resumen", insumos:"Insumos"};
  document.getElementById("hTitle").textContent = l ? l.cod : (titulos[t] || "Inventario");
  document.getElementById("hSub").textContent   = l ? nomLote(l) : "Hongos del Sur";
  document.getElementById("hMark").hidden   = t === "ficha";
  document.getElementById("btnAtras").hidden = t !== "ficha";

  if(t !== "ficha" && location.hash) limpiarHash();
  window.scrollTo(0,0);
  render();
}

// Con rol de producción, las pestañas de inventario no se muestran.
function aplicarRol(){
  var soloProd = NUBE.rol() === "produccion";
  ["conteo","insumos"].forEach(function(k){
    var b = document.querySelector('.tab[data-tab="' + k + '"]');
    if(b) b.hidden = soloProd;
  });
  document.getElementById("progWrap").hidden = soloProd || vista !== "conteo";
  if(soloProd && (vista === "conteo" || vista === "insumos")) irA("lotes");
  else render();
}

function limpiarHash(){
  if(history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  else location.hash = "";
}

// El enlace de confirmación del correo vuelve con la sesión (o con un error)
// escrita en el hash: se recoge, se limpia la barra de direcciones y se sigue.
function tomarSesionDelHash(){
  var h = location.hash || "";
  if(h.indexOf("access_token=") < 0 && h.indexOf("error_description=") < 0 && h.indexOf("error=") < 0) return false;

  var p = {};
  h.replace(/^#\/?/, "").split("&").forEach(function(par){
    var i = par.indexOf("=");
    if(i > 0) p[decodeURIComponent(par.slice(0,i))] = decodeURIComponent(par.slice(i+1).replace(/\+/g," "));
  });
  limpiarHash();

  if(!p.access_token){
    avisar(NUBE.traducir(p.error_description || p.error || "El enlace del correo ya no sirve: pide uno nuevo"));
    return true;
  }
  NUBE.desdeHash(p, function(err){
    if(err){ avisar(err); return; }
    NUBE.traerPerfil(function(){
      avisar("Correo confirmado · sesión iniciada");
      hojaNube();
    });
  });
  return true;
}

// Un QR escaneado llega como  …/#/l/CODIGO  y abre esa ficha.
// Si la etiqueta era de una bolsa, llega  …/#/l/CODIGO/b/7  y abre su pesaje.
function aplicarHash(){
  var m = /^#\/l\/([^\/]+)(?:\/b\/(\d+))?\/?$/.exec(location.hash || "");
  if(!m){
    if(vista === "ficha") irA("lotes");
    return;
  }
  var cod = decodeURIComponent(m[1]);
  var l = lotePorCod(cod);
  if(!l){
    limpiarHash();
    irA("lotes");
    avisar("No hay ningún lote « " + cod + " » guardado en esta copia de la app");
    return;
  }
  loteAbierto = l.id;
  irA("ficha");
  if(m[2]) hojaBolsa(l.id, Number(m[2]));
}

function volverDeFicha(){
  if(location.hash) history.back();
  else irA("lotes");
}

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-tab],[data-toggle],[data-same],[data-open],[data-d],[data-edit],[data-save],[data-del],[data-act],[data-close],#btnMenu,#btnCerrar,#btnCopiar,#btnCsvCompra") : null;
  if(!t) return;

  if(t.dataset.tab){ irA(t.dataset.tab); return; }

  if(t.dataset.toggle){
    var k = t.dataset.toggle;
    abiertas[k] = !abiertas[k];
    t.closest(".stage").classList.toggle("open", abiertas[k]);
    t.setAttribute("aria-expanded", String(!!abiertas[k]));
    return;
  }

  if(t.dataset.same){ todoIgual(t.dataset.same); return; }

  if(t.dataset.open){
    var fila = t.closest(".row"), yaAbierta = fila.classList.contains("open");
    Array.prototype.forEach.call(document.querySelectorAll(".row.open"), function(r){ r.classList.remove("open"); });
    if(!yaAbierta){ fila.classList.add("open"); pintarDetalle(t.dataset.open); }
    return;
  }

  if(t.dataset.d){
    var id = t.dataset.id, it = porId(id);
    var inp = document.querySelector('[data-in="' + id + '"]');
    var v = (parseFloat(inp.value) || 0) + Number(t.dataset.d) * paso(it.uni);
    if(v < 0) v = 0;
    v = Math.round(v * 100) / 100;
    inp.value = v;
    marcar(id, v);
    return;
  }

  if(t.dataset.edit){ hojaInsumo(t.dataset.edit); return; }
  if(t.dataset.save !== undefined && t.hasAttribute("data-save")){ guardarInsumo(t.dataset.save); return; }

  if(t.dataset.del){
    var d = porId(t.dataset.del);
    if(confirm("¿Eliminar «" + d.nom + "» y todo su historial?\n\nSi solo dejaste de usarlo, es mejor marcarlo como pausado.")){
      DB.items = DB.items.filter(function(i){ return i.id !== d.id; });
      guardar(); cerrarHoja(); render();
      avisar("Insumo eliminado");
    }
    return;
  }

  if(t.id === "btnMenu"){ hojaMenu(); return; }
  if(t.id === "btnCerrar"){ cerrarSemana(); return; }

  if(t.id === "btnCopiar"){
    var txt = textoCompra();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ avisar("Lista copiada — pégala en WhatsApp"); },
                                              function(){ avisar("No se pudo copiar"); });
    } else { avisar("Este navegador no permite copiar"); }
    return;
  }
  if(t.id === "btnCsvCompra"){ descargar("lista-compra-" + hoyISO() + ".txt", textoCompra(), "text/plain"); return; }

  if(t.dataset.close){ cerrarHoja(); return; }

  var a = t.dataset.act;
  if(a === "respaldo"){ respaldar(); return; }
  if(a === "restaurar"){ restaurar(); return; }
  if(a === "csv"){ descargar("inventario-" + hoyISO() + ".csv", csvInventario(), "text/csv"); return; }
  if(a === "csvlotes"){
    if(!DB.lotes.length){ avisar("Todavía no hay lotes que exportar"); return; }
    descargar("lotes-" + hoyISO() + ".csv", csvLotes(), "text/csv");
    return;
  }
  if(a === "base"){ hojaBase(); return; }
  if(a === "nube"){ hojaNube(); return; }
  if(a === "tema"){
    var actual = document.documentElement.getAttribute("data-theme");
    var oscuro = actual ? actual === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var nuevo = oscuro ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nuevo);
    try{ localStorage.setItem("hds_tema", nuevo); }catch(e){}
    cerrarHoja();
    return;
  }
  if(a === "ayuda"){ hojaAyuda(); return; }
  if(a === "reset"){
    if(confirm("Esto borra todos los insumos, el historial de conteos y también los lotes con sus fotos.\n\n¿Seguro? Descarga un respaldo antes si tienes dudas.")){
      DB.lotes.forEach(function(l){
        l.ev.forEach(function(e){ (e.fotos || []).forEach(function(f){ FOTOS.borrar(f); }); });
      });
      DB = semilla(); loteAbierto = null;
      guardar(); cerrarHoja(); limpiarHash(); irA("conteo");
      avisar("Todo restablecido");
    }
    return;
  }
});

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-flote],[data-lote],[data-led],[data-lsave],[data-lborrar],[data-lact],[data-lev],[data-esave],[data-eborrar],[data-ver],[data-timp],[data-tqr],[data-lbolsa],[data-lgrupo],[data-bfin],[data-bsave],[data-bdesc],[data-bundesc],[data-nact],[data-prol],#btnAtras,#lupaCerrar,#lupaBorrar") : null;
  if(!t) return;

  if(t.dataset.nact){
    if(t.dataset.nact === "modo"){ modoNube = t.dataset.v; hojaNube(); return; }
    tocarNube(t.dataset.nact);
    return;
  }
  if(t.dataset.prol){ cambiarRol(t.dataset.pid, t.dataset.prol); return; }
  if(t.dataset.lbolsa){ hojaBolsa(loteAbierto, t.dataset.lbolsa); return; }
  if(t.dataset.lgrupo){ hojaBolsas(loteAbierto, t.dataset.lgrupo, t.dataset.lol); return; }
  if(t.hasAttribute("data-bfin")){ cerrarHoja(); render(); return; }
  if(t.dataset.bsave){ guardarBolsa(loteAbierto, t.dataset.bsave); return; }
  if(t.dataset.bdesc){ descartarBolsa(loteAbierto, t.dataset.bdesc, false); return; }
  if(t.dataset.bundesc){ descartarBolsa(loteAbierto, t.dataset.bundesc, true); return; }

  if(t.id === "btnAtras"){ volverDeFicha(); return; }
  if(t.id === "lupaCerrar"){ document.getElementById("lupa").classList.remove("open"); return; }
  if(t.id === "lupaBorrar"){ borrarFotoActual(); return; }

  if(t.dataset.flote){ filtroLotes = t.dataset.flote; pintarLotes(); return; }
  if(t.dataset.lote){ abrirLote(t.dataset.lote); return; }
  if(t.dataset.led){ hojaLote(t.dataset.led); return; }
  if(t.hasAttribute("data-lsave")){ guardarLote(t.dataset.lsave); return; }
  if(t.dataset.ver){ verFoto(t.dataset.ver); return; }
  if(t.dataset.lev){ hojaEvento(loteAbierto, null, t.dataset.lev); return; }
  if(t.hasAttribute("data-esave")){ guardarEvento(t.dataset.esave, t.dataset.etipo, t.dataset.eid || null); return; }
  if(t.dataset.eborrar){ borrarEvento(t.dataset.elote, t.dataset.eborrar); return; }

  if(t.dataset.lborrar){
    var l = lotePorId(t.dataset.lborrar);
    if(!l) return;
    if(confirm("¿Eliminar el lote " + l.cod + " con todo su historial y sus fotos?\n\nSi el lote terminó, es mejor marcarlo como Finalizado.")){
      l.ev.forEach(function(e){ (e.fotos || []).forEach(function(f){ FOTOS.borrar(f); }); });
      DB.lotes = DB.lotes.filter(function(x){ return x.id !== l.id; });
      loteAbierto = null;
      guardar(); cerrarHoja(); limpiarHash(); irA("lotes");
      avisar("Lote eliminado");
    }
    return;
  }

  if(t.dataset.timp){
    var cant = Math.max(1, Math.min(500, Math.round(parseFloat(document.getElementById("t_cant").value) || 1)));
    if(etiqNumerar && cant > 120 && !confirm("Vas a generar " + cant + " etiquetas numeradas, cada una con su propio código QR.\n\nPuede demorar unos segundos. ¿Seguir?")) return;
    imprimirEtiquetas(lotePorId(t.dataset.timp), etiqChica, cant, etiqNumerar);
    return;
  }
  if(t.dataset.tqr){
    var lq = lotePorId(t.dataset.tqr);
    descargar("qr-" + lq.cod + ".svg", QR.svg(urlLote(lq)), "image/svg+xml");
    return;
  }

  var a = t.dataset.lact;
  if(a === "addfoto"){
    pedirFotos(function(ds){
      if(!ds.length){ avisar("No se pudo leer la imagen"); return; }
      fotosPend = fotosPend.concat(ds);
      pintarPendientes(fotosGuardadasEnHoja());
      avisar(ds.length + (ds.length === 1 ? " foto lista" : " fotos listas") + " — falta guardar");
    });
    return;
  }
  if(a === "savebase"){
    DB.cfg.base = document.getElementById("b_url").value.trim();
    guardar(); cerrarHoja();
    avisar(DB.cfg.base ? "Dirección guardada" : "Se usará la dirección desde donde se abra la app");
    return;
  }
  if(a === "etiq"){ hojaEtiqueta(loteAbierto); return; }
  if(a === "bolsas"){ hojaBolsas(loteAbierto); return; }
  if(a){ hojaEvento(loteAbierto, a, null); return; }
});

// Las fotos ya guardadas del evento que se está editando, para volver a pintarlas.
function fotosGuardadasEnHoja(){
  var b = document.querySelector("[data-esave]");
  if(!b || !b.dataset.eid) return [];
  var l = lotePorId(b.dataset.esave);
  if(!l) return [];
  var e = l.ev.filter(function(x){ return x.id === b.dataset.eid; })[0];
  return e ? (e.fotos || []) : [];
}

document.addEventListener("change", function(ev){
  var el = ev.target;
  if(!el.id) return;

  // Formulario de lote: la especie muestra u oculta el nombre libre y refresca el código.
  if(el.id === "f_esp" || el.id === "f_finoc" || el.id === "f_otro"){
    var esp = document.getElementById("f_esp"), wrap = document.getElementById("wrapOtro");
    if(esp && wrap) wrap.hidden = esp.value !== "OTR";
    var cod = document.getElementById("f_cod");
    if(cod && cod.dataset.auto === "1"){
      var otro = document.getElementById("f_otro");
      var f = document.getElementById("f_finoc");
      cod.value = nuevoCodigo(esp.value, f ? f.value : hoyISO(), otro ? otro.value : "");
    }
    return;
  }
  if(el.id === "t_tam" || el.id === "t_num"){
    if(el.id === "t_tam") etiqChica = el.value === "1";
    else etiqNumerar = el.value === "1";
    var cantAct = Math.max(1, Math.round(parseFloat(document.getElementById("t_cant").value) || 1));
    hojaEtiqueta(loteAbierto, cantAct);
    return;
  }
  // Pesaje por bolsa: cambiar de oleada o de fecha vuelve a pintar las filas.
  if(el.id === "bb_o" || el.id === "bb_f"){
    var caja = document.getElementById("bbLista");
    if(caja) pintarFilasBolsas(caja.dataset.lote);
    return;
  }
});

document.addEventListener("input", function(ev){
  var el = ev.target;
  if(el.id === "f_cod"){ el.dataset.auto = "0"; return; }
  if(el.dataset && el.dataset.bin){
    var caja = document.getElementById("bbLista");
    if(caja) anotarBolsa(caja.dataset.lote, Number(el.dataset.bin), el.value);
    return;
  }
  if(el.dataset && el.dataset.in){
    var v = parseFloat(el.value);
    if(el.value === "" || isNaN(v)) return;
    marcar(el.dataset.in, Math.max(0, v));
    return;
  }
  if(el.dataset && el.dataset.compra){
    var b = borrador();
    var c = parseFloat(el.value);
    b.c[el.dataset.compra] = isNaN(c) ? 0 : Math.max(0, c);
    guardar();
    refrescarFila(el.dataset.compra);
    return;
  }
  if(el.id === "buscar"){
    filtro = el.value;
    var pos = el.selectionStart;
    pintarInsumos();
    var nuevoInp = document.getElementById("buscar");
    nuevoInp.focus();
    try{ nuevoInp.setSelectionRange(pos, pos); }catch(e){}
    return;
  }
});

document.addEventListener("change", function(ev){
  if(ev.target.dataset && ev.target.dataset.in && ev.target.value === ""){

});

document.addEventListener("keydown", function(ev){
  if(ev.key !== "Escape") return;
  var lupa = document.getElementById("lupa");
  if(lupa.classList.contains("open")){ lupa.classList.remove("open"); return; }

});
