    {k:"etapas",  n:"Etapas"},
    {k:"insumos", n:"Insumos"},
    {k:"costo",   n:"Costo"},
    {k:"precios", n:"Precios"},
    {k:"ajustes", n:"Ajustes"}
  ];

  /* ---------- Estado y persistencia ---------- */

  function nuevoId(){ return "k" + Math.random().toString(36).slice(2,9); }

  function semilla(){
    var ins = INSUMOS.map(function(s){
      return {id:nuevoId(), nom:s[0], tipo:s[1], fCant:s[2], fUni:s[3], precio:s[4], usos:s[5]||0, prov:""};
    });
    function idDe(nom){
      for(var i=0;i<ins.length;i++) if(ins[i].nom === nom) return ins[i].id;
      return "";
    }
    var eta = ETAPAS_DEF.map(function(e){
      return {
        k:e.k, n:e.n, d:e.d, uni:e.uni, rinde:e.rinde, horas:e.horas, perdida:0,
        lin:e.lin.map(function(l){
          if(l[0] === "i") return {t:"i", id:idDe(l[1]), cant:l[2], uni:l[3], pu:!!l[4]};
          if(l[0] === "e") return {t:"e", ek:l[1], cant:l[2], pu:!!l[3], alc:!!l[4]};
          if(l[0] === "l") return {t:"l", n:l[1], w:l[2], hDia:l[3], dias:l[4], duty:l[5]};
          return {t:"o", n:l[1], m:l[2], pu:!!l[3]};
        })
      };
    });
    return {
      v:1, ins:ins, eta:eta,
      // Sin cifras del negocio: el archivo es público, los montos se escriben
      // en Ajustes y se quedan en el dispositivo. El kWh es el único que viene
      // con un valor, porque es una tarifa de la calle y no dice nada de nadie.
      cfg:{
        kwh:160,
        fijos:[{n:"Internet", m:0},{n:"Agua", m:0}],
        sueldo:0,
        modoHora:"sueldo",
        valorHora:3000,
        bolsasMes:120,
        etapaPlan:"5",
        iva:19,
        finFresco:"7",
        finSeco:"8",
        mMin:45,
        mMay:30,
        netear:false
      }
    };
  }

  function cargar(){
    try{
      var raw = localStorage.getItem(CLAVE);
      if(raw){
        var d = JSON.parse(raw);
        if(d && d.ins && d.eta && d.cfg) return normalizar(d);
      }
    }catch(e){}
    return semilla();
  }

  // Los respaldos viejos pueden venir sin campos nuevos: se completan al cargar.
  function normalizar(d){
    var base = semilla().cfg;
    for(var k in base) if(d.cfg[k] === undefined) d.cfg[k] = base[k];
    if(!Array.isArray(d.cfg.fijos)) d.cfg.fijos = [];
    d.eta.forEach(function(e){ if(!Array.isArray(e.lin)) e.lin = []; });
    return d;
  }

  function guardar(){
    try{ localStorage.setItem(CLAVE, JSON.stringify(DB)); }
    catch(e){ avisar("No se pudo guardar en este navegador"); }
  }

  /* ---------- Números ---------- */

  function miles(n){
    var s = String(Math.abs(Math.round(n)));
    return (n < 0 ? "-" : "") + s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }
  function clp(n){ return "$" + miles(n || 0); }
  // Bajo mil peso el redondeo esconde la diferencia: ahí se muestran decimales.
  function clpFino(n){
    n = Number(n) || 0;
    if(Math.abs(n) >= 100 || n === 0) return clp(n);
    var d = Math.abs(n) >= 10 ? 1 : 2;
    return "$" + (Math.round(n * Math.pow(10,d)) / Math.pow(10,d)).toString().replace(".", ",");
  }
  function cifra(n, dec){
    n = Number(n) || 0;
    var p = Math.pow(10, dec == null ? 2 : dec);
    var r = Math.round(n * p) / p;
    var s = String(Math.abs(r)).split(".");
    return (r < 0 ? "-" : "") + miles(Number(s[0])) + (s[1] ? "," + s[1] : "");
  }
  function pct(n){ return cifra(n, 1) + "%"; }
  // Acepta lo que se escribe de verdad: 24000, 24.000, $24.000, 2,5 y 2.5.
  function aNum(s){
    s = String(s == null ? "" : s).replace(/[\s$%]/g,"");
    if(s.indexOf(",") >= 0) s = s.replace(/\./g,"").replace(",",".");
    else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  function val(id){ var e = document.getElementById(id); return e ? e.value : ""; }
  function nval(id){ return aNum(val(id)); }

  /* ---------- Búsquedas ---------- */

  function insPorId(id){
    for(var i=0;i<DB.ins.length;i++) if(DB.ins[i].id === id) return DB.ins[i];
    return null;
  }
  function etaPorK(k){
    for(var i=0;i<DB.eta.length;i++) if(DB.eta[i].k === k) return DB.eta[i];
    return null;
  }
  function nomIns(id){ var it = insPorId(id); return it ? it.nom : "insumo borrado"; }
  function nomEta(k){ var e = etaPorK(k); return e ? e.n : "etapa borrada"; }

  /* ---------- Costo de un insumo ----------
     costoBase = precio del formato ÷ cantidad del formato, en la unidad chica
     de su familia (gramo, mililitro, unidad). Los reutilizables además se
     dividen por los usos que aguantan. Con `netear`, el IVA de la compra se
     descuenta porque vuelve como crédito fiscal. */

  function costoBase(it){
    var q = (Number(it.fCant)||0) * uni(it.fUni).f;
    if(!q) return 0;
    var p = Number(it.precio)||0;
    if(DB.cfg.netear) p = p / (1 + (Number(DB.cfg.iva)||0)/100);
    return p / q;
  }
  function costoUso(it){
    var c = costoBase(it);
    if(it.tipo !== "reu") return c;
    var u = Number(it.usos)||0;
    return u > 0 ? c / u : 0;
  }
  function costoLinea(it, cant, u){
    if(!it) return 0;
    var f = familia(u) === familia(it.fUni) ? uni(u).f : uni(it.fUni).f;
    return (Number(cant)||0) * f * costoUso(it);
  }
  function kwhLinea(l){
    return ((Number(l.w)||0)/1000) * (Number(l.hDia)||0) * (Number(l.dias)||0) * ((Number(l.duty)||0)/100);
  }
  // Cantidad por tanda: las líneas «por unidad» se multiplican por el rinde.
  function cantTanda(l, e){
    var c = Number(l.cant)||0;
    return l.pu ? c * (Number(e.rinde)||0) : c;
  }
  function rindeEf(e){
    return (Number(e.rinde)||0) * (1 - (Number(e.perdida)||0)/100);
  }

  /* ---------- La cadena ----------
     Cada etapa devuelve su costo por unidad separado en insumos, electricidad
     y otros, más las horas y cuántas unidades de cada etapa anterior hicieron
     falta. Al consumir una etapa se arrastra todo eso multiplicado por la
     cantidad, así el desglose final sigue sumando el total. La mano de obra
     no entra aquí: se valoriza al final, cuando ya se sabe cuántas horas
     lleva un kilo y cuánto tiene que valer la hora. */

  function cadena(){
    var memo = {}, pila = {}, tarifa = Number(DB.cfg.kwh)||0;

    function etapa(k){
      if(memo[k]) return memo[k];
      var e = etaPorK(k);
      var r = {ins:0, luz:0, otr:0, hor:0, req:{}, ok:!!e, ciclo:false, sinRinde:false};
      if(!e){ memo[k] = r; return r; }
      if(pila[k]){ r.ciclo = true; return r; }          // sin memo: el ciclo es del camino
      pila[k] = 1;

      e.lin.forEach(function(l){
        var c = cantTanda(l, e);
        if(l.t === "i"){
          var it = insPorId(l.id);
          r.ins += costoLinea(it, c, l.uni || (it ? it.fUni : "unidad"));
        }else if(l.t === "l"){
          r.luz += kwhLinea(l) * tarifa;
        }else if(l.t === "o"){
          r.otr += (Number(l.m)||0) * (l.pu ? (Number(e.rinde)||0) : 1);
        }else if(l.t === "e"){
          var s = etapa(l.ek);
          if(s.ciclo){ r.ciclo = true; return; }
          r.ins += c * s.ins;
          r.luz += c * s.luz;
          r.otr += c * s.otr;
          r.hor += c * s.hor;
          r.req[l.ek] = (r.req[l.ek]||0) + c;
          for(var kk in s.req) r.req[kk] = (r.req[kk]||0) + c * s.req[kk];
        }
      });
      r.hor += Number(e.horas)||0;

      var ef = rindeEf(e);
      if(ef > 0){
        r.ins /= ef; r.luz /= ef; r.otr /= ef; r.hor /= ef;
        for(var k2 in r.req) r.req[k2] = r.req[k2] / ef;
      }else{
        r.sinRinde = true;
        r.ins = r.luz = r.otr = r.hor = 0; r.req = {};
      }

      delete pila[k];
      memo[k] = r;
      return r;
    }

    DB.eta.forEach(function(e){ etapa(e.k); });
    return memo;
  }

  /* Todo lo que se muestra sale de acá: un solo cálculo por pintada. */
  function calcular(){
    var C = cadena(), cfg = DB.cfg;
    var F = C[cfg.finFresco] || {ins:0,luz:0,otr:0,hor:0,req:{}};
    var S = C[cfg.finSeco]   || {ins:0,luz:0,otr:0,hor:0,req:{}};

    // Plan del mes: se anota en bolsas inoculadas, que es lo que se controla.
    var porKg = F.req[cfg.etapaPlan] || 0;            // bolsas necesarias para un kilo
    var kgMes = porKg > 0 ? (Number(cfg.bolsasMes)||0) / porKg : 0;

    var horasKg  = F.hor;
    var horasMes = horasKg * kgMes;
    var sueldo   = Number(cfg.sueldo)||0;
    var valorHora = cfg.modoHora === "fijo"
      ? (Number(cfg.valorHora)||0)
      : (horasMes > 0 ? sueldo / horasMes : 0);

    var fijosMes = 0;
    (cfg.fijos||[]).forEach(function(g){ fijosMes += Number(g.m)||0; });
    var fijoKg = kgMes > 0 ? fijosMes / kgMes : 0;

    function producto(R, factorFresco){
      var directo = R.ins + R.luz + R.otr;
      var mano = R.hor * valorHora;
      var fijo = fijoKg * factorFresco;
      return {
        ins:R.ins, luz:R.luz, otr:R.otr, hor:R.hor,
        directo:directo, mano:mano, fijo:fijo,
        total:directo + mano + fijo
      };
    }

    var fresco = producto(F, 1);
    var seco   = producto(S, S.req[cfg.finFresco] || 0);

    // Cuántas tandas de cada etapa exige el plan, y de ahí el gasto mensual
    // en cada insumo: la misma cadena sirve como lista de compras.
    var tandas = {}, gastoIns = {}, usoIns = {};
    DB.eta.forEach(function(e){
      var u = (e.k === cfg.finFresco ? 1 : (F.req[e.k] || 0)) * kgMes;
      var ef = rindeEf(e);
      tandas[e.k] = ef > 0 ? u / ef : 0;
    });
    DB.eta.forEach(function(e){
      var t = tandas[e.k] || 0;
      if(!t) return;
      e.lin.forEach(function(l){
        if(l.t !== "i") return;
        var it = insPorId(l.id);
        if(!it) return;
        var c = cantTanda(l, e) * t;
        usoIns[l.id]   = (usoIns[l.id]||0) + c * (familia(l.uni) === familia(it.fUni) ? uni(l.uni).f : uni(it.fUni).f);
        gastoIns[l.id] = (gastoIns[l.id]||0) + costoLinea(it, c, l.uni || it.fUni);
      });
    });

    return {
      C:C, F:F, S:S, fresco:fresco, seco:seco,
      kgMes:kgMes, bolsasPorKg:porKg,
      horasKg:horasKg, horasMes:horasMes, valorHora:valorHora,
      fijosMes:fijosMes, fijoKg:fijoKg, sueldo:sueldo,
      tandas:tandas, gastoIns:gastoIns, usoIns:usoIns,
      // Los que sí mueven el costo y todavía valen cero. Un reutilizable con 0 usos
      // no se reparte, así que su precio no cambia nada: no se avisa por él.
      faltanPrecios: DB.ins.filter(function(it){
        if(Number(it.precio) || !(usoIns[it.id] > 0)) return false;
        return !(it.tipo === "reu" && !Number(it.usos));
      })
    };
  }

  /* ---------- Datos reales del inventario y de los lotes ----------
     La app ya sabe cuánto rinde una bolsa y cuántas se pierden: no tiene
     sentido pedirle que lo adivine. */

  function rendimientoReal(){
    var kg = 0, bolsas = 0, n = 0;
    invLotes().forEach(function(l){
      var k = kgLote(l), b = bolsasVivas(l);
      if(k > 0 && b > 0){ kg += k; bolsas += b; n++; }
    });
    if(!bolsas) return null;
    return {g:(kg/bolsas)*1000, lotes:n, bolsas:bolsas};
  }
  function contaminacionReal(){
    var puestas = 0, perdidas = 0, n = 0;
    invLotes().forEach(function(l){
      var b = Number(l.bolsas)||0;
      if(!b) return;
      puestas += b; perdidas += descartadas(l); n++;
    });
    if(!puestas) return null;
    return {pct:(perdidas/puestas)*100, lotes:n, bolsas:puestas, perdidas:perdidas};
  }

  // Precios que hoy están en el cotizador, para comparar sin tocarlos.
  function precioLista(){
    try{
      var raw = localStorage.getItem("hds_cot_v1");
      if(!raw) return null;
      var d = JSON.parse(raw);
      if(!d || !d.cat) return null;
      var min = 0, may = 0, n = 0;
      d.cat.forEach(function(p){
        if(p.off || p.uni !== "kg" || !Number(p.pMin)) return;
        min += Number(p.pMin); may += Number(p.pMay)||0; n++;
      });
      return n ? {min:min/n, may:may/n, n:n} : null;
    }catch(e){ return null; }
  }

  /* ---------- Íconos ---------- */

  var ICONOS = {
    mas:'<path d="M12 5v14M5 12h14"/>',
    chev:'<path d="m6 9 6 6 6-6"/>',
    rayo:'<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>',
    reloj:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    caja:'<path d="M20 7 12 3 4 7l8 4 8-4Z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/>',
    casa:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
    bajar:'<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>',
    subir:'<path d="M12 21V9M7 13l5-5 5 5M4 4h16"/>',
    ayuda:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.1-2.5 3.6M12 17.5h.01"/>',
    basura:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'
  };
  function ico(k){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONOS[k]||"") + "</svg>";
  }

  /* ---------- Render ---------- */

  function pintarNav(){
    document.getElementById("cosNav").innerHTML = SUBS.map(function(s){
      return '<button class="chip' + (sub === s.k ? " on" : "") + '" data-ktab="' + s.k + '">' + esc(s.n) + "</button>";
    }).join("");
  }

  function pintar(){
    if(!DB) return;
    pintarNav();
    var r = calcular();
    if(sub === "etapas")       pintarEtapas(r);
    else if(sub === "insumos") pintarInsumos(r);
    else if(sub === "costo")   pintarCosto(r);
    else if(sub === "precios") pintarPrecios(r);
    else                       pintarAjustes(r);
    cabecera(r);
  }

  function cabecera(r){
    if(vista !== "costos") return;
    document.getElementById("hTitle").textContent = "Costos";
    document.getElementById("hSub").textContent = r.fresco.total > 0
      ? clp(r.fresco.total) + " el kilo"
      : "Hongos del Sur";
  }

  function irSub(t){
    sub = t;
    SUBS.forEach(function(s){ document.getElementById("cos-" + s.k).hidden = s.k !== t; });
    pintar();
    window.scrollTo(0,0);
  }

  function heroHTML(r){
    var h = '<div class="khero">';
    h += '<div class="khero__k">Cuesta producir un kilo</div>';
    h += '<div class="khero__v">' + clp(r.fresco.total) + "</div>";
    h += '<div class="khero__s">' + (r.fresco.total > 0
      ? "Insumos " + clp(r.fresco.ins + r.fresco.otr) + " · luz " + clp(r.fresco.luz) +
        " · trabajo " + clp(r.fresco.mano) + " · fijos " + clp(r.fresco.fijo)
      : "Carga los precios de tus insumos y el número aparece solo.") + "</div>";
    h += "</div>";
    return h;
  }

  function avisosHTML(r){
    var h = "";
    if(r.faltanPrecios.length){
      h += '<div class="kaviso">Faltan precios en <b>' + r.faltanPrecios.length + " insumo" +
           (r.faltanPrecios.length === 1 ? "" : "s") + "</b> que sí estás usando. Mientras tanto el costo está incompleto. " +
           '<button data-kact="irInsumos">Cargarlos ahora</button></div>';
    }
    if(!r.kgMes){
      h += '<div class="kaviso">Todavía no se puede repartir el sueldo ni los gastos fijos: revisa el plan del mes en Ajustes.</div>';
    }
    // Sin sueldo ni gastos fijos el kilo sale barato y falso: mejor decirlo.
    if(DB.cfg.modoHora === "sueldo" && !Number(DB.cfg.sueldo)){
      h += '<div class="kaviso">El costo <b>no incluye tu trabajo</b>. Escribe en Ajustes cuánto quieres retirar al mes y aparece repartido en cada kilo.</div>';
    }
    if(!r.fijosMes){
      h += '<div class="kaviso">Faltan tus <b>gastos fijos</b> (internet, agua, arriendo): sin ellos el kilo sale más barato de lo que es.</div>';
    }
    return h;
  }

  /* --- Etapas --- */

  // «unidad» en plural es «unidades»: son cuatro casos y se leen todo el rato.
  function nomUni(u, n){
    if(Math.abs(Number(n)||0) === 1) return u;
    return ({unidad:"unidades", par:"pares", rollo:"rollos", caja:"cajas", sobre:"sobres"})[u] || u;
  }
  // 24.750 g se entienden mejor como 24,75 kg.
  function medida(n, u){
    n = Number(n)||0;
    var i = uni(u), grande = {m:"kg", v:"L", l:"m"}[i.fam];
    if(!grande) return cifra(n, n < 1 ? 3 : 2) + " " + nomUni(u, n);
    var base = n * i.f, g = uni(grande);
    if(base >= g.f) return cifra(base/g.f, 2) + " " + grande;
    return cifra(base, base < 1 ? 3 : 2) + " " + ({m:"g", v:"ml", l:"cm"})[i.fam];
  }

  function textoLinea(l, e){
    if(l.t === "i"){
      var it = insPorId(l.id);
      var c = Number(l.cant)||0;
      var u = l.uni || (it ? it.fUni : "");
      var t = cifra(c, 3) + " " + nomUni(u, c) + (it && it.tipo === "reu" && Number(it.usos) ? " de uso" : "");
      t += l.pu ? " por " + unidadSingular(e) : " por tanda";
      if(l.pu) t += " · " + medida(cantTanda(l, e), u) + " en total";
      return t;
    }
    if(l.t === "e"){
      var s2 = etaPorK(l.ek);
      var un = s2 ? unidadSingular(s2) : "unidad", unp = s2 ? s2.uni : "unidades";
      if(l.alc && Number(l.cant)){
        return "1 " + un + " cada " + cifra(1/(Number(l.cant)||1), 2) + " " + (l.pu ? e.uni : "tandas");
      }
      var t2 = cifra(l.cant, 3) + " " + (Math.abs(Number(l.cant)||0) === 1 ? un : unp);
      t2 += l.pu ? " por " + unidadSingular(e) : " por tanda";
      if(l.pu) t2 += " · " + cifra(cantTanda(l, e), 2) + " en total";
      return t2;
    }
    if(l.t === "l"){
      return (Number(l.w)||0) + " W · " + cifra(l.hDia,1) + " h al día · " + cifra(l.dias,0) + " días" +
             (Number(l.duty) < 100 ? " · encendido " + cifra(l.duty,0) + "%" : "") +
             "  (" + cifra(kwhLinea(l), 1) + " kWh)";
    }
    return l.pu ? clp(l.m) + " por " + unidadSingular(e) : clp(l.m) + " por tanda";
  }

  // «bolsas inoculadas» → «bolsa inoculada»: para que las frases se lean.
  function unidadSingular(e){
    var u = String(e.uni || "unidades").split(" ");
    if(/s$/.test(u[0]) && u[0].length > 3) u[0] = u[0].replace(/es$/, "").replace(/s$/, "");
    if(u[1] && /as$/.test(u[1])) u[1] = u[1].replace(/s$/, "");
    return u.join(" ");
  }

  // Una línea que trae otra etapa se muestra con todo lo suyo dentro, horas
  // incluidas: si no, las líneas no suman el total de la tanda.
  function costoDeLinea(l, e, C, vh){
    var c = cantTanda(l, e);
    if(l.t === "i"){
      var it = insPorId(l.id);
      return costoLinea(it, c, l.uni || (it ? it.fUni : "unidad"));
    }
    if(l.t === "l") return kwhLinea(l) * (Number(DB.cfg.kwh)||0);
    if(l.t === "o") return (Number(l.m)||0) * (l.pu ? (Number(e.rinde)||0) : 1);
    var s = C[l.ek];
    return s ? c * (s.ins + s.luz + s.otr + s.hor * (vh||0)) : 0;
  }

  function pintarEtapas(r){
    var h = heroHTML(r) + avisosHTML(r);

    DB.eta.forEach(function(e){
      var s = r.C[e.k] || {ins:0,luz:0,otr:0,hor:0};
      var unitario = s.ins + s.luz + s.otr;           // sin la mano de obra
      var unitTot  = unitario + s.hor * r.valorHora;  // con todo, hasta acá
      var ab = !!abierta[e.k];
      var tandaTot = unitTot * rindeEf(e);

      h += '<section class="stage' + (ab ? " open" : "") + '">';
      h += '<button class="stage__head" data-kact="abrir" data-ke="' + esc(e.k) + '" aria-expanded="' + ab + '">';
      h += '<span class="stage__n">' + esc(e.k) + "</span>";
      h += '<span class="stage__txt"><span class="stage__t">' + esc(e.n) + "</span>";
      h += '<span class="stage__d">' + cifra(e.rinde, 2) + " " + esc(e.uni) + " por tanda · " + cifra(e.horas,1) + " h" +
           (Number(e.perdida) ? " · merma " + cifra(e.perdida,0) + "%" : "") + "</span></span>";
      h += '<span class="stage__c">' + clpFino(unitTot) + ico("chev") + "</span>";
      h += "</button>";

      h += '<div class="stage__body">';
      if(s.ciclo) h += '<div class="kaviso" style="margin:12px 14px">Esta etapa se consume a sí misma en algún paso: revisa las líneas que apuntan a otra etapa.</div>';
      if(!e.lin.length) h += '<p class="note" style="padding:12px 14px 0">Sin líneas todavía. Agrega lo que se consume en esta etapa.</p>';

      e.lin.forEach(function(l, i){
        var c = costoDeLinea(l, e, r.C, r.valorHora);
        var falta = l.t === "i" && insPorId(l.id) && !Number(insPorId(l.id).precio);
        var nom = l.t === "i" ? nomIns(l.id) : l.t === "e" ? nomEta(l.ek) : (l.n || "");
        h += '<button class="krow' + (l.t === "e" ? " krow--eta" : "") + (falta ? " krow--falta" : "") +
             '" data-kact="linea" data-ke="' + esc(e.k) + '" data-ki="' + i + '">';
        h += '<span class="krow__t"><span class="krow__n">' + (l.t === "e" ? "↳ " : "") + esc(nom) + "</span>";
        h += '<span class="krow__m">' + esc(textoLinea(l, e)) + "</span></span>";
        h += '<span class="krow__c">' + (falta ? "sin precio" : clpFino(c)) + "</span>";
        h += "</button>";
      });

      if(Number(e.horas)){
        h += '<div class="krow" style="cursor:default"><span class="krow__t"><span class="krow__n">Mano de obra</span>';
        h += '<span class="krow__m">' + cifra(e.horas,1) + " h por tanda · " + clp(r.valorHora) + " la hora</span></span>";
        h += '<span class="krow__c">' + clpFino((Number(e.horas)||0) * r.valorHora) + "</span></div>";
      }

      h += '<div class="ktot"><span>Tanda completa<br>' + cifra(rindeEf(e),2) + " " + esc(e.uni) +
           (Number(e.perdida) ? " sanas" : "") + "</span>";
      h += "<span>" + clp(tandaTot) + "<br><b>" + clpFino(unitTot) + "</b> cada " + esc(unidadSingular(e)) + "</span></div>";

      h += '<div class="ktot"><span>Al ritmo del plan</span><span>' + cifra(r.tandas[e.k]||0, 1) + " tandas al mes</span></div>";

      h += '<div class="kadd">';
      h += '<button data-kact="nueva" data-ke="' + esc(e.k) + '" data-kv="i">+ insumo</button>';
      h += '<button data-kact="nueva" data-ke="' + esc(e.k) + '" data-kv="e">+ etapa anterior</button>';
      h += '<button data-kact="nueva" data-ke="' + esc(e.k) + '" data-kv="l">+ electricidad</button>';
      h += '<button data-kact="nueva" data-ke="' + esc(e.k) + '" data-kv="o">+ otro gasto</button>';
      h += '<button data-kact="etapa" data-ke="' + esc(e.k) + '">ajustar etapa</button>';
      h += "</div></div></section>";
    });

    h += '<div style="margin-top:14px"><button class="btn btn--ghost" data-kact="etapaNueva">' + ico("mas") + "Agregar una etapa</button></div>";
    h += '<p class="note">Cada etapa arrastra el costo de la anterior. Cambia el rinde, las cantidades o las horas y todo lo demás se recalcula, incluido el precio sugerido.</p>';

    document.getElementById("cos-etapas").innerHTML = h;
  }

  /* --- Insumos --- */

  function pintarInsumos(r){
    var q = filtroIns.toLowerCase();
    var h = "";

    if(r.faltanPrecios.length){
      h += '<div class="card"><div class="card__head"><div class="card__t">Faltan precios</div><div class="card__n">' +
           r.faltanPrecios.length + "</div></div><div class=\"card__body\">";
      h += '<p class="tile__s" style="margin:-4px 0 8px">Estos los estás usando y todavía valen cero. Escribe lo que pagaste por el formato completo.</p>';
      r.faltanPrecios.forEach(function(it){
        h += filaPrecio(it, r);
      });
      h += "</div></div>";
    }

    h += '<input class="search" id="kBuscar" placeholder="Buscar insumo" value="' + esc(filtroIns) + '">';

    [["con","Se consumen"],["reu","Se reutilizan"]].forEach(function(g){
      var lista = DB.ins.filter(function(it){
        return it.tipo === g[0] && (!q || it.nom.toLowerCase().indexOf(q) >= 0);
      });
      if(!lista.length) return;
      h += '<div class="igroup__t">' + g[1] + " · " + lista.length + "</div>";
      lista.forEach(function(it){
        var gasto = r.gastoIns[it.id] || 0;
        h += '<button class="irow" data-kact="ins" data-kid="' + esc(it.id) + '">';
        h += '<span class="irow__t"><span class="irow__n">' + esc(it.nom) + "</span>";
        h += '<span class="irow__m">' + cifra(it.fCant,2) + " " + esc(nomUni(it.fUni, it.fCant)) + " · " + clp(it.precio) +
             (Number(it.precio) ? " · " + clpFino(costoUso(it)) + " por " + esc(unidadChica(it)) + (it.tipo === "reu" ? " de uso" : "") : " · sin precio") +
             (it.tipo === "reu" ? (Number(it.usos) ? " · " + cifra(it.usos,0) + " usos" : " · no se reparte") : "") +
             "</span></span>";
        h += '<span class="krow__c">' + (gasto >= 1 ? clp(gasto) + "<small>al mes</small>" : "") + "</span>";
        h += "</button>";
      });
    });

    h += '<div style="margin-top:14px"><button class="btn btn--ghost" data-kact="insNuevo">' + ico("mas") + "Nuevo insumo</button></div>";
    h += '<p class="note">El costo sale de dividir lo que pagaste por el formato completo. Si compras un saco de 25 kg y usas 7,3 kg, se cobran los 7,3 kg. Los reutilizables se reparten entre los usos que aguantan; con «no se reparte» quedan como inversión y no encarecen el kilo.</p>';

    document.getElementById("cos-insumos").innerHTML = h;
  }

  function filaPrecio(it, r){
    var h = '<div class="kpre"><div class="kpre__t"><div class="kpre__n">' + esc(it.nom) + "</div>";
    h += '<div class="kpre__m">' + cifra(it.fCant,2) + " " + esc(nomUni(it.fUni, it.fCant)) + " · lo que pagas por el formato</div></div>";
    h += '<input inputmode="numeric" data-kpre="' + esc(it.id) + '" value="' + (Number(it.precio)||"") + '" placeholder="$"></div>';
    return h;
  }
  function unidadChica(it){
    var f = familia(it.fUni);
    return f === "m" ? "g" : f === "v" ? "ml" : f === "l" ? "cm" : it.fUni;
  }

  /* --- Costo --- */

  function pintarCosto(r){
    var h = heroHTML(r) + avisosHTML(r);
    var f = r.fresco;

    h += '<div class="tiles">';
    h += tile("Insumos y envases", clp(f.ins + f.otr), pctDe(f.ins + f.otr, f.total) + " del costo");
    h += tile("Electricidad", clp(f.luz), pctDe(f.luz, f.total) + " · " + clp(DB.cfg.kwh) + " el kWh");
    h += tile("Mano de obra", clp(f.mano), cifra(r.horasKg,2) + " h por kilo");
    h += tile("Gastos fijos", clp(f.fijo), clp(r.fijosMes) + " al mes ÷ " + cifra(r.kgMes,1) + " kg");
    h += "</div>";

    /* En qué etapa se agrega el costo: lo propio de cada una, sin arrastrar. */
    h += '<div class="card"><div class="card__head"><div class="card__t">Dónde se va el costo</div><div class="card__n">por kilo</div></div><div class="card__body">';
    var propio = [];
    DB.eta.forEach(function(e){
      if(e.k === DB.cfg.finSeco) return;
      var s = r.C[e.k] || {};
      var enKg = (e.k === DB.cfg.finFresco ? 1 : (r.F.req[e.k] || 0));
      if(!enKg) return;
      var directoUnit = 0;
      e.lin.forEach(function(l){ if(l.t !== "e") directoUnit += costoDeLinea(l, e, r.C); });
      var ef = rindeEf(e);
      var propioKg = ef > 0 ? (directoUnit / ef) * enKg : 0;
      var manoKg = ef > 0 ? ((Number(e.horas)||0) / ef) * enKg * r.valorHora : 0;
      propio.push({n:e.n, k:e.k, v:propioKg + manoKg});
    });
    propio.push({n:"Gastos fijos del mes", k:"", v:f.fijo});
    var maxV = 0;
    propio.forEach(function(p){ if(p.v > maxV) maxV = p.v; });
    h += '<div class="bars">';
    propio.forEach(function(p){
      h += '<div><div class="bar__l"><span>' + esc(p.n) + "</span><span>" + clpFino(p.v) + "</span></div>";
      h += '<div class="bar__t"><div class="bar__f" style="width:' + (maxV > 0 ? Math.round(p.v/maxV*100) : 0) + '%"></div></div></div>';
    });
    h += "</div></div></div>";

    /* La cadena, paso a paso: es donde se ve que un kilo son 2 bolsas. */
    h += '<div class="card"><div class="card__head"><div class="card__t">La cadena</div><div class="card__n">para 1 kg fresco</div></div><div class="card__body"><div class="tablescroll"><table class="kt">';
    h += "<thead><tr><th>Etapa</th><th>Hace falta</th><th>c/u</th><th>Vale en el kilo</th></tr></thead><tbody>";
    DB.eta.forEach(function(e){
      if(e.k === DB.cfg.finSeco) return;
      var s = r.C[e.k] || {ins:0,luz:0,otr:0,hor:0};
      var u = e.k === DB.cfg.finFresco ? 1 : (r.F.req[e.k] || 0);
      if(!u) return;
      var cu = s.ins + s.luz + s.otr + s.hor * r.valorHora;
      var fuerte = e.k === DB.cfg.finFresco;
      h += "<tr" + (fuerte ? ' class="fuerte"' : "") + "><td>" + esc(e.n) + "<small>" + esc(e.uni) + "</small></td>";
      h += "<td>" + (u < 0.05 ? "1 cada " + cifra(1/u, 0) : cifra(u, u < 1 ? 3 : 2)) + "</td>";
      h += "<td>" + clpFino(cu) + "</td><td>" + clpFino(cu * u) + "</td></tr>";
    });
    h += '<tr class="fuerte"><td>Gastos fijos</td><td>—</td><td>—</td><td>' + clpFino(f.fijo) + "</td></tr>";
    h += '<tr class="fuerte"><td>Costo del kilo</td><td></td><td></td><td>' + clp(f.total) + "</td></tr>";
    h += "</tbody></table></div>";
    h += '<p class="note" style="padding:11px 0 0">Cada fila ya trae dentro a las anteriores: la bolsa inoculada incluye el sustrato y el spawn. Esta columna no se suma hacia abajo; para ver cuánto agrega cada etapa está el gráfico de arriba.</p>';
    h += "</div></div>";

    /* Horas y sueldo */
    h += '<div class="card"><div class="card__head"><div class="card__t">Tu trabajo</div><div class="card__n">' + cifra(r.horasMes,0) + " h al mes</div></div><div class=\"card__body\">";
    if(r.horasMes > 0){
      h += '<p class="tile__s" style="margin:-4px 0 10px">Sumando las horas que anotaste en cada etapa, el plan del mes te toma <b>' +
           cifra(r.horasMes,0) + " horas</b> (unas " + cifra(r.horasMes/4.3,1) + " por semana). " +
           (DB.cfg.modoHora === "sueldo"
             ? "Para sacar " + clp(r.sueldo) + " al mes, tu hora tiene que valer <b>" + clp(r.valorHora) + "</b>."
             : "A " + clp(r.valorHora) + " la hora, el mes te deja " + clp(r.valorHora * r.horasMes) + ".") + "</p>";
      h += '<div class="tiles">';
      h += tile("Vale tu hora", clp(r.valorHora), DB.cfg.modoHora === "sueldo" ? "para llegar al sueldo" : "valor que fijaste");
      h += tile("Horas por kilo", cifra(r.horasKg,2) + " h", "de la placa al despacho");
      h += "</div>";
    }else{
      h += '<p class="tile__s">Anota en cada etapa cuánto te demoras (botón «ajustar etapa») y acá aparece cuánto vale tu hora.</p>';
    }
    h += "</div></div>";

    /* Rendimiento: lo que más mueve el costo */
    var rr = rendimientoReal(), cr = contaminacionReal();
    h += '<div class="card"><div class="card__head"><div class="card__t">Rendimiento</div><div class="card__n">lo que más mueve el costo</div></div><div class="card__body">';
    if(r.bolsasPorKg > 0){
      h += '<p class="tile__s" style="margin:-4px 0 10px">Hoy el cálculo supone <b>' + cifra(1000/r.bolsasPorKg, 0) +
           " g por bolsa</b>. Cada bolsa te cuesta " + clpFino(f.total / r.bolsasPorKg) + " puesta en la cámara.</p>";
    }
    if(rr){
      h += '<button class="btn btn--ghost" data-kact="usarRend" data-kv="' + rr.g + '">Usar mi promedio real: ' +
           cifra(rr.g,0) + " g por bolsa (" + rr.bolsas + " bolsas)</button>";
    }else{
      h += '<p class="tile__s">Cuando registres cosechas en la pestaña Lotes, vas a poder traer tu rendimiento real de un toque.</p>';
    }
    if(cr && cr.pct > 0){
      h += '<div style="margin-top:9px"><button class="btn btn--ghost" data-kact="usarCont" data-kv="' + cr.pct + '">Usar mi contaminación real: ' +
           pct(cr.pct) + " (" + cr.perdidas + " de " + cr.bolsas + " bolsas)</button></div>";
    }
    h += "</div></div>";

    /* Deshidratado */
    var s8 = etaPorK(DB.cfg.finSeco);
    if(s8){
      h += '<div class="card"><div class="card__head"><div class="card__t">Deshidratado</div><div class="card__n">' + esc(s8.uni) + '</div></div><div class="card__body">';
      h += '<p class="tile__s" style="margin:-4px 0 10px">Un kilo seco se lleva ' + cifra(r.S.req[DB.cfg.finFresco]||0, 1) +
           " kg de fresco más las horas de máquina.</p>";
      h += '<div class="tiles">';
      h += tile("Cuesta el kilo seco", clp(r.seco.total), "todo incluido");
      h += tile("Equivale a", clpFino(r.seco.total / Math.max(1, r.S.req[DB.cfg.finFresco]||1)), "por kilo fresco usado");
      h += "</div></div></div>";
    }

    document.getElementById("cos-costo").innerHTML = h;
  }

  function tile(k, v, s){
    return '<div class="tile"><div class="tile__k">' + esc(k) + '</div><div class="tile__v">' + v +
           '</div><div class="tile__s">' + s + "</div></div>";
  }
  function pctDe(a, b){ return b > 0 ? pct(a/b*100) : "—"; }

  /* --- Precios --- */

  function pintarPrecios(r){
    var cfg = DB.cfg, iva = Number(cfg.iva)||0;
    var costo = r.fresco.total;
    var variable = r.fresco.directo;                 // lo que cuesta un kilo más de verdad
    var lista = precioLista();

    // Margen sobre el precio de venta: precio = costo / (1 - margen)
    function precioDe(m){
      m = Math.min(95, Math.max(0, Number(m)||0));
      return costo > 0 ? costo / (1 - m/100) : 0;
    }
    function conIva(p){ return p * (1 + iva/100); }
    function redondear(p){ return Math.round(p/100)*100; }

    var pMin = redondear(precioDe(cfg.mMin));
    var pMay = redondear(precioDe(cfg.mMay));

    var h = '<div class="khero">';
    h += '<div class="khero__k">Precio mínimo · no pierdes ni ganas</div>';
    h += '<div class="khero__v">' + clp(costo) + '</div>';
    h += '<div class="khero__s">Por debajo de esto cada kilo que vendes te saca plata del bolsillo, sueldo incluido. ' +
         "Sin contar tu sueldo el piso baja a " + clp(costo - r.fresco.mano) + ".</div></div>";

    h += avisosHTML(r);

    h += '<div class="card"><div class="card__head"><div class="card__t">Tus precios</div><div class="card__n">margen sobre la venta</div></div><div class="card__body">';
    h += '<div class="f2"><div class="field"><label>Margen minorista (%)</label><input inputmode="decimal" data-kg="mMin" value="' + cifra(cfg.mMin,1) + '"></div>';
    h += '<div class="field"><label>Margen mayorista (%)</label><input inputmode="decimal" data-kg="mMay" value="' + cifra(cfg.mMay,1) + '"></div></div>';

    h += '<div class="tablescroll"><table class="kt"><thead><tr><th>Canal</th><th>Neto</th><th>Con IVA</th><th>Te queda</th></tr></thead><tbody>';
    h += filaPrecio2("Minorista", pMin, conIva(pMin), pMin - costo);
    h += filaPrecio2("Mayorista", pMay, conIva(pMay), pMay - costo);
    if(lista){
      h += '<tr class="fuerte"><td colspan="4" style="border-top:1px solid var(--line);padding-top:11px;font-weight:600">Lo que cobras hoy</td></tr>';
      h += filaPrecio2("Minorista actual", lista.min/(1+iva/100), lista.min, lista.min/(1+iva/100) - costo);
      h += filaPrecio2("Mayorista actual", lista.may/(1+iva/100), lista.may, lista.may/(1+iva/100) - costo);
    }
    h += "</tbody></table></div>";
    if(lista){
      var mHoy = lista.may/(1+iva/100);
      h += '<p class="note" style="padding:0">Tu lista del cotizador tiene los precios con IVA incluido: ' + clp(lista.min) +
           " minorista y " + clp(lista.may) + " mayorista. Descontado el IVA, al mayorista te queda " +
           (mHoy > costo ? "<b>" + clp(mHoy - costo) + " por kilo</b> (" + pct((mHoy-costo)/mHoy*100) + " de margen)."
                         : "<b style=\"color:var(--crit)\">" + clp(mHoy - costo) + " por kilo</b>: estás vendiendo bajo el costo.") + "</p>";
    }
    h += "</div></div>";

    /* Punto de equilibrio: la pregunta de verdad. */
    h += '<div class="card"><div class="card__head"><div class="card__t">Cuánto tienes que vender</div><div class="card__n">para pagarte el sueldo</div></div><div class="card__body">';
    h += '<p class="tile__s" style="margin:-4px 0 11px">Cada kilo deja, después de pagar insumos y luz, lo que sobra del precio. Con eso hay que cubrir los gastos fijos (' +
         clp(r.fijosMes) + ") y tu sueldo (" + clp(r.sueldo) + ").</p>";
    h += '<div class="tablescroll"><table class="kt"><thead><tr><th>Si vendes a</th><th>Deja por kilo</th><th>Kilos al mes</th><th>Bolsas</th></tr></thead><tbody>';
    [pMay, pMin, lista ? lista.may/(1+iva/100) : 0, lista ? lista.min/(1+iva/100) : 0].forEach(function(p, i){
      if(!p) return;
      var contrib = p - variable;
      var necesita = contrib > 0 ? (r.fijosMes + r.sueldo) / contrib : 0;
      h += "<tr><td>" + clp(p) + "<small>" + ["margen mayorista","margen minorista","mayorista de hoy","minorista de hoy"][i] + "</small></td>";
      h += "<td>" + clpFino(contrib) + "</td>";
      h += "<td>" + (contrib > 0 ? "<b>" + cifra(necesita,1) + " kg</b>" : "nunca") + "</td>";
      h += "<td>" + (contrib > 0 && r.bolsasPorKg ? cifra(necesita * r.bolsasPorKg, 0) : "—") + "</td></tr>";
    });
    h += "</tbody></table></div>";
    if(r.kgMes > 0){
      // Con el precio que cobra hoy, no con el sugerido: es la pregunta real.
      var pHoy = lista ? lista.may/(1+iva/100) : pMay;
      var resultado = (pHoy - variable) * r.kgMes - r.fijosMes;
      h += '<p class="note" style="padding:11px 0 0">Con tu plan actual de ' + cifra(DB.cfg.bolsasMes,0) + " bolsas al mes produces " +
           cifra(r.kgMes,1) + " kg. Vendiéndolos todos a " + clp(pHoy) + " el kilo (" + (lista ? "tu precio mayorista de hoy" : "el margen que fijaste") +
           ") te quedan <b>" + clp(resultado) + "</b> al mes para sueldo y para crecer" + (resultado > 0 && resultado < r.sueldo
             ? ": " + clp(r.sueldo - resultado) + " menos de lo que necesitas."
             : resultado <= 0 ? ". No alcanza: hay que subir el precio o el volumen." : ". Alcanza.") + "</p>";
    }
    h += "</div></div>";

    /* Deshidratado */
    if(etaPorK(cfg.finSeco) && r.seco.total > 0){
      var pSeco = redondear(r.seco.total / (1 - Math.min(95, cfg.mMin)/100));
      h += '<div class="card"><div class="card__head"><div class="card__t">Deshidratado</div><div class="card__n">bolsa de 100 g</div></div><div class="card__body">';
      h += '<div class="tablescroll"><table class="kt"><thead><tr><th>Formato</th><th>Costo</th><th>Precio con IVA</th></tr></thead><tbody>';
      h += "<tr><td>Kilo deshidratado</td><td>" + clp(r.seco.total) + "</td><td>" + clp(conIva(pSeco)) + "</td></tr>";
      h += "<tr><td>Bolsa de 100 g</td><td>" + clp(r.seco.total/10) + "</td><td>" + clp(Math.round(conIva(pSeco)/10/100)*100) + "</td></tr>";
      h += "</tbody></table></div></div></div>";
    }

    h += '<p class="note">El margen está calculado sobre el precio de venta, que es como se mira en el comercio: 30% de margen sobre $10.000 son $3.000. Los precios con IVA son los que le muestras al cliente; el cotizador trabaja con esos mismos.</p>';

    document.getElementById("cos-precios").innerHTML = h;
  }

  function filaPrecio2(nom, neto, iva, deja){

           (l.alc ? cifra(1/(Number(l.cant)||1), 2) : cifra(l.cant,3)) + '">';

  function lineaNueva(t){
    if(t === "i") return {t:"i", id:DB.ins.length ? DB.ins[0].id : "", cant:1, uni:DB.ins.length ? DB.ins[0].fUni : "unidad", pu:false};
    if(t === "e") return {t:"e", ek:"", cant:1, pu:false, alc:false};
    if(t === "l") return {t:"l", n:"", w:100, hDia:24, dias:14, duty:100};
    return {t:"o", n:"", m:0, pu:false};
  }

  function hojaAyuda(){
    var h = '<h2 class="sheet__t">Cómo se calcula</h2>';
    h += '<p class="sheet__d">Para que el número no sea magia.</p>';
    h += '<div style="font-size:.88rem;line-height:1.65;color:var(--ink-soft)">';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">Sólo se cobra lo que se usa.</strong> El agar se compra en 500 g y se ocupan 10 g para doce placas: se cobran 10 g. El pellet viene en sacos de 15 kg y van 825 g por bolsa: se cobran 825 g.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">Lo reutilizable se reparte.</strong> Un frasco Duran que aguanta 200 tandas pone su precio dividido en 200 cada vez. Con 0 usos no se reparte: es inversión, como la Wenbox, y no encarece el kilo.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">Cada etapa hereda a la anterior.</strong> La placa entra al frasco de cultivo líquido, el frasco al spawn, el spawn a la bolsa, la bolsa al kilo. Por eso cambiar el precio del trigo mueve el precio del kilo.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">La merma encarece lo que queda.</strong> Si de 30 bolsas se pierden 3, la tanda entera se paga con 27: cada bolsa buena cuesta 11% más. Es el costo más fácil de olvidar.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">La luz se calcula, no se adivina.</strong> Watts ÷ 1000 × horas × días × porcentaje encendido = kWh, por el precio del kWh. El humidificador que va 3 minutos sí y 6 no está encendido un 33% del tiempo.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">Tus horas son un costo.</strong> Se suman las de cada etapa según cuántas tandas exige el plan del mes. Si quieres retirar un sueldo, ese sueldo dividido por esas horas es lo que tiene que valer tu hora, y esa hora entra al costo del kilo.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">Los gastos fijos se reparten por kilo.</strong> Internet y agua se pagan igual produzcas 20 o 100 kilos: por eso producir más baja el costo, y por eso el número cambia cuando cambias el plan del mes.</p>';
    h += '<p style="margin-bottom:12px"><strong style="color:var(--ink)">El margen es sobre la venta.</strong> 30% de margen en un kilo de $10.000 son $3.000 para ti. Es la forma en que se habla de márgenes en el comercio, y evita el error de sumarle 30% al costo y creer que ganaste 30%.</p>';
    h += '<p><strong style="color:var(--ink)">Nada de esto sale de la app.</strong> Los costos viven sólo en este dispositivo y no se sincronizan: son tuyos, y nadie con cuenta de producción los ve.</p>';
    h += "</div>";
    abrirHoja(h);
  }

  /* ---------- Exportar ---------- */

  function csv(){
    var r = calcular(), L = [];
    L.push("HONGOS DEL SUR - COSTOS;" + hoyISO());
    L.push("");
    L.push("INSUMOS");
    L.push("Nombre;Tipo;Formato;Unidad;Precio;Usos;Costo por unidad chica;Gasto al mes");
    DB.ins.forEach(function(it){
      L.push([it.nom, it.tipo === "reu" ? "reutilizable" : "consumible", cifra(it.fCant,3), it.fUni,
              Math.round(it.precio||0), it.usos||0, cifra(costoUso(it),4),
              Math.round(r.gastoIns[it.id]||0)].join(";"));
    });
    L.push("");
    L.push("ETAPAS");
    L.push("N;Etapa;Rinde;Unidad;Horas;Merma %;Costo por unidad;Tandas al mes");
    DB.eta.forEach(function(e){
      var s = r.C[e.k] || {ins:0,luz:0,otr:0,hor:0};
      L.push([e.k, e.n, cifra(e.rinde,2), e.uni, cifra(e.horas,2), cifra(e.perdida,1),
              Math.round((s.ins+s.luz+s.otr) + s.hor*r.valorHora), cifra(r.tandas[e.k]||0,2)].join(";"));
    });
    L.push("");
    L.push("COSTO DEL KILO FRESCO");
    L.push("Insumos y envases;" + Math.round(r.fresco.ins + r.fresco.otr));
    L.push("Electricidad;" + Math.round(r.fresco.luz));
    L.push("Mano de obra;" + Math.round(r.fresco.mano));
    L.push("Gastos fijos;" + Math.round(r.fresco.fijo));
    L.push("TOTAL;" + Math.round(r.fresco.total));
    L.push("");
    L.push("Horas al mes;" + cifra(r.horasMes,1));
    L.push("Valor de la hora;" + Math.round(r.valorHora));
    L.push("Kilos al mes;" + cifra(r.kgMes,2));
    descargar("costos-" + hoyISO() + ".csv", "﻿" + L.join("\r\n"), "text/csv");
  }

  function restaurar(){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(!f) return;
      var lector = new FileReader();
      lector.onload = function(){
        try{
          var d = JSON.parse(String(lector.result));
          if(!d || !d.ins || !d.eta || !d.cfg) throw 0;
          if(!confirm("Esto reemplaza los costos que tienes ahora. ¿Seguir?")) return;
          DB = normalizar(d);
          guardar(); cerrarHoja(); pintar();
          avisar("Costos restaurados");
        }catch(e){ avisar("Ese archivo no es un respaldo de costos"); }
      };
      lector.readAsText(f);
    };
    inp.click();
  }

  /* ---------- Eventos ----------
     Los prefijos data-k* son propios: el inventario escucha data-d y data-act,
     el cotizador data-c*, y sin separarlos se pisan entre sí. */

  document.addEventListener("click", function(ev){
    if(!DB) return;
    var el = ev.target.closest ? ev.target.closest("[data-kact],[data-ktab]") : null;
    if(!el) return;

    if(el.hasAttribute("data-ktab")){ irSub(el.getAttribute("data-ktab")); return; }

    var act = el.getAttribute("data-kact");
    var ek  = el.getAttribute("data-ke");
    var ki  = Number(el.getAttribute("data-ki"));
    var kid = el.getAttribute("data-kid");

    switch(act){
      case "abrir":
        abierta[ek] = !abierta[ek];
        pintar();
        break;

      case "irInsumos": irSub("insumos"); break;

      /* Líneas */
      case "linea": hojaLinea(ek, ki); break;
      case "nueva": hojaLinea(ek, -1, el.getAttribute("data-kv")); break;
      case "lineaGuardar": {
        var e = etaPorK(ek);
        if(!e) break;
        var t = el.getAttribute("data-kv");
        var l = ki >= 0 ? e.lin[ki] : lineaNueva(t);
        var modo = val("kl_modo");
        if(t === "i"){
          l.id = val("kl_id");
          l.cant = nval("kl_cant");
          l.uni = val("kl_uni");
          l.pu = modo === "unidad";
        }else if(t === "e"){
          var destino = val("kl_ek");
          if(!destino){ avisar("Elige la etapa que se consume"); break; }
          if(creaCiclo(ek, destino)){ avisar("Esa etapa ya depende de ésta: se armaría un círculo"); break; }
          l.ek = destino;
          l.alc = modo === "alcT" || modo === "alcU";
          l.pu  = modo === "unidad" || modo === "alcU";
          var c = nval("kl_cant");
          l.cant = l.alc ? (c > 0 ? 1/c : 0) : c;
        }else if(t === "l"){
          l.n = val("kl_n").trim() || "Equipo";
          l.w = nval("kl_w"); l.hDia = nval("kl_hDia"); l.dias = nval("kl_dias"); l.duty = nval("kl_duty");
        }else{
          l.n = val("kl_n").trim() || "Otro gasto";
          l.m = nval("kl_m");
          l.pu = modo === "unidad";
        }
        if(ki < 0) e.lin.push(l);
        abierta[ek] = true;
        guardar(); cerrarHoja(); pintar();
        break;
      }
      case "lineaBorrar": {
        var e2 = etaPorK(ek);
        if(e2) e2.lin.splice(ki, 1);
        guardar(); cerrarHoja(); pintar();
        break;
      }

      /* Etapas */
      case "etapa": hojaEtapa(ek); break;
      case "etapaNueva": hojaEtapa(""); break;
      case "etapaGuardar": {
        var nom = val("ke_n").trim();
        if(!nom){ avisar("Ponle un nombre a la etapa"); break; }
        var datos = {
          n:nom, d:val("ke_d").trim(), uni:val("ke_uni").trim() || "unidades",
          rinde:nval("ke_rinde"), horas:nval("ke_horas"),
          perdida:Math.min(99, Math.max(0, nval("ke_perdida")))
        };
        if(ek){
          var ee = etaPorK(ek);
          if(ee) for(var kk in datos) ee[kk] = datos[kk];
        }else{
          var n = 1;
          while(etaPorK(String(n))) n++;
          datos.k = String(n); datos.lin = [];
          DB.eta.push(datos);
          abierta[datos.k] = true;
        }
        guardar(); cerrarHoja(); pintar();
        break;
      }
      case "etapaBorrar": {
        var usada = [];
        DB.eta.forEach(function(x){
          x.lin.forEach(function(l2){ if(l2.t === "e" && l2.ek === ek) usada.push(x.n); });
        });
        if(usada.length){ avisar("La usa " + usada[0] + ": quita esa línea primero"); break; }
        if(!confirm("¿Eliminar la etapa y todas sus líneas?")) break;
        DB.eta = DB.eta.filter(function(x){ return x.k !== ek; });
        guardar(); cerrarHoja(); pintar();
        break;
      }

      /* Insumos */
      case "ins": hojaInsumo(kid); break;
      case "insNuevo": hojaInsumo(""); break;
      case "insGuardar": {
        var nom2 = val("ki_nom").trim();
        if(!nom2){ avisar("Ponle un nombre al insumo"); break; }
        var d2 = {
          nom:nom2, tipo:val("ki_tipo"), fCant:Math.max(0, nval("ki_cant")), fUni:val("ki_uni"),
          precio:Math.max(0, nval("ki_precio")), usos:Math.max(0, nval("ki_usos")), prov:val("ki_prov").trim()
        };
        if(!d2.fCant){ avisar("El formato no puede ser cero"); break; }
        if(kid){
          var it2 = insPorId(kid);
          if(it2) for(var k3 in d2) it2[k3] = d2[k3];
        }else{
          d2.id = nuevoId();
          DB.ins.push(d2);
        }
        guardar(); cerrarHoja(); pintar();
        break;
      }
      case "insBorrar": {
        var en = [];
        DB.eta.forEach(function(x){
          x.lin.forEach(function(l3){ if(l3.t === "i" && l3.id === kid) en.push(x.n); });
        });
        if(en.length){ avisar("Se usa en " + en[0] + ": quítalo de ahí primero"); break; }
        DB.ins = DB.ins.filter(function(x){ return x.id !== kid; });
        guardar(); cerrarHoja(); pintar();
        break;
      }

      /* Gastos fijos */
      case "fijo": hojaFijo(ki); break;
      case "fijoNuevo": hojaFijo(-1); break;
      case "fijoGuardar": {
        var g2 = {n:val("kf_n").trim() || "Gasto", m:Math.max(0, nval("kf_m"))};
        if(ki >= 0) DB.cfg.fijos[ki] = g2; else DB.cfg.fijos.push(g2);
        guardar(); cerrarHoja(); pintar();
        break;
      }
      case "fijoBorrar":
        DB.cfg.fijos.splice(ki, 1);
        guardar(); cerrarHoja(); pintar();
        break;

      /* Datos reales de los lotes */
      case "usarRend": {
        var g3 = Number(el.getAttribute("data-kv")) || 0;
        var e6 = etaPorK("6");
        if(!e6 || !g3){ avisar("No se pudo aplicar"); break; }
        var bolsas = 0;
        e6.lin.forEach(function(l4){ if(l4.t === "e") bolsas += cantTanda(l4, e6); });
        if(!bolsas){ avisar("La etapa 6 no toma bolsas de ninguna etapa"); break; }
        e6.rinde = Math.round(bolsas * g3 / 1000 * 100) / 100;
        guardar(); pintar();
        avisar("Rendimiento actualizado: " + cifra(g3,0) + " g por bolsa");
        break;
      }
      case "usarCont": {
        var p = Number(el.getAttribute("data-kv")) || 0;
        var e5 = etaPorK("5");
        if(!e5){ avisar("No se pudo aplicar"); break; }
        e5.perdida = Math.round(p*10)/10;
        guardar(); pintar();
        avisar("Merma de la inoculación: " + pct(p));
        break;
      }

      /* Datos */
      case "respaldo":
        descargar("respaldo-costos-" + hoyISO() + ".json", JSON.stringify(DB, null, 1), "application/json");
        break;
      case "restaurar": restaurar(); break;
      case "csv": csv(); break;
      case "ayuda": hojaAyuda(); break;
      case "reset":
        if(!confirm("Vuelve todo a los valores iniciales y borra los precios que cargaste.\n\n¿Seguro?")) break;
        DB = semilla();
        guardar(); pintar();
        avisar("Costos reiniciados");
        break;
    }
  });

  // Escribir no repinta: se pierde el foco y el cursor. Se guarda y se refresca
  // sólo la cifra de la cabecera.
  document.addEventListener("input", function(ev){
    if(!DB) return;
    var el = ev.target;
    if(!el.getAttribute) return;

    if(el.id === "kBuscar"){
      filtroIns = el.value;
      var pos = el.selectionStart;
      pintar();
      var n = document.getElementById("kBuscar");
      if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} }
      return;
    }

    var pre = el.getAttribute("data-kpre");
    if(pre){
      var it = insPorId(pre);
      if(it){ it.precio = Math.max(0, aNum(el.value)); guardar(); cabecera(calcular()); }
      return;
    }

    var g = el.getAttribute("data-kg");
    if(g){
      if(g === "modoHora"){ DB.cfg.modoHora = el.value; guardar(); pintar(); return; }
      if(g === "netear"){ DB.cfg.netear = el.value === "1"; guardar(); pintar(); return; }
      if(g === "finFresco" || g === "finSeco" || g === "etapaPlan"){ DB.cfg[g] = el.value; guardar(); pintar(); return; }
      DB.cfg[g] = Math.max(0, aNum(el.value));
      guardar();
      cabecera(calcular());
      return;
    }
  });

  // Al salir de un campo sí se repinta: ahí ya no molesta y todo queda al día.
  document.addEventListener("change", function(ev){
    if(!DB || vista !== "costos") return;
    var el = ev.target;
    if(!el.getAttribute) return;
    if(el.getAttribute("data-kpre") || (el.getAttribute("data-kg") && el.tagName === "INPUT")) pintar();
  });

  /* ---------- Ciclos ----------
     Si la etapa `origen` ya está aguas arriba de `destino`, sumarla como
     insumo armaría un círculo y el costo no convergería nunca. */

  function creaCiclo(origen, destino){
    if(origen === destino) return true;
    var visto = {};
    function baja(k){
      if(k === origen) return true;
      if(visto[k]) return false;
      visto[k] = 1;
      var e = etaPorK(k);
      if(!e) return false;
      for(var i=0;i<e.lin.length;i++){
        if(e.lin[i].t === "e" && baja(e.lin[i].ek)) return true;
      }
      return false;
    }
    return baja(destino);
  }

  /* ---------- Arranque del módulo ---------- */

  DB = cargar();
  guardar();

  return {
    pintar: pintar,
    // Para el resto de la app: cuánto cuesta el kilo, por si algún día lo usa
    // el cotizador o el resumen.
    costoKilo: function(){ return calcular().fresco.total; }
  };
})();

/* ============================================================
   20. Puerta
   ============================================================

   Servida por internet, la app no muestra nada hasta que haya sesión. Abierta
   como archivo local no pide nada: ahí el archivo ya está en las manos de quien
   lo abrió, y exigir señal para usarlo sólo serviría para quedarse afuera.

   Qué protege y qué no, para no confundirse:

   - **Sí protege** los datos. Los del teléfono son de ese teléfono, y los de la
     nube los guarda el servidor con sus permisos: sin cuenta aprobada no
     entrega ni una fila. La puerta agrega que, además, no se pueda ni mirar la
     interfaz ni escribir nada desde la dirección pública.
   - **No protege el archivo.** Cualquiera puede pedir el HTML y leerlo entero:
     así funciona un sitio estático. Por eso, además de la puerta, el archivo no
     lleva adentro ningún dato del negocio — precios, costos y gastos viven en
     el dispositivo, no en el código.
   ============================================================ */

var EXIGE_SESION = location.protocol.indexOf("http") === 0;
var modoPuerta = "entrar", msgPuerta = null, correoPuerta = "", ocupadaPuerta = false;

var SELLO_PUERTA = LOGO_DEF
  ? '<img src="' + LOGO_DEF + '" alt="">'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M3.2 10.5c0-4.2 3.9-7 8.8-7s8.8 2.8 8.8 7c0 1.1-.9 1.7-2.2 1.7H5.4c-1.3 0-2.2-.6-2.2-1.7Z"/>' +
    '<path d="M9.6 12.2v5.4c0 1.6.9 2.6 2.4 2.6s2.4-1 2.4-2.6v-5.4"/></svg>';

function pintarPuerta(){
  var crear = modoPuerta === "crear", espera = modoPuerta === "espera";
  var h = '<div class="puerta__in">';
  h += '<div class="puerta__sello">' + SELLO_PUERTA + "</div>";
  h += '<h1 class="puerta__t">Hongos del Sur</h1>';
  h += '<div class="puerta__s">Producción e inventario</div>';

  if(msgPuerta){
    h += '<div class="puerta__err"' + (msgPuerta.t === "ok" ? ' style="background:var(--ok-bg);color:var(--ok)"' : "") +
         ">" + esc(msgPuerta.txt) + "</div>";
  }

  if(espera){
    var s = NUBE.sesion(), p = NUBE.perfil();
    var bloq = p && p.rol === "bloqueado";
    h += '<p class="puerta__d">' + (bloq
      ? "Este acceso fue dado de baja."
      : "Tu cuenta está creada, pero todavía no tiene acceso. El dueño la aprueba y después entras con el mismo correo.") + "</p>";
    if(s) h += '<div class="field"><label>Cuenta</label><input value="' + esc(s.correo) + '" disabled></div>';
    h += '<div style="margin-top:6px"><button class="btn btn--primary" data-pact="revisar">Comprobar de nuevo</button></div>';
    h += '<div style="margin-top:9px"><button class="btn btn--ghost" data-pact="salir">Salir</button></div>';
    h += "</div>";
    document.getElementById("puerta").innerHTML = h;
    return;
  }

  h += '<p class="puerta__d">' + (crear
    ? "Crea tu cuenta y pídele al dueño que te dé acceso."
    : "Esta app es de uso interno. Entra con tu cuenta para verla.") + "</p>";

  if(crear){
    h += '<div class="field"><label for="p_nom">Tu nombre</label>';
    h += '<input id="p_nom" autocomplete="name" placeholder="Cómo te ven en el equipo"></div>';
  }
  h += '<div class="field"><label for="p_correo">Correo</label>';
  h += '<input id="p_correo" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" value="' +
       esc(correoPuerta) + '" placeholder="tucorreo@ejemplo.cl"></div>';
  h += '<div class="field"><label for="p_clave">Clave</label>';
  h += '<input id="p_clave" type="password" autocomplete="' + (crear ? "new-password" : "current-password") +
       '" placeholder="' + (crear ? "Al menos 6 caracteres" : "Tu clave") + '"></div>';

  h += '<div style="margin-top:6px"><button class="btn btn--primary" data-pact="' + (crear ? "crear" : "entrar") + '"' +
       (ocupadaPuerta ? " disabled" : "") + ">" +
       (ocupadaPuerta ? "Un momento…" : crear ? "Crear mi cuenta" : "Entrar") + "</button></div>";

  h += '<p class="puerta__pie">' + (crear
    ? '¿Ya tienes cuenta? <button data-pact="modo" data-pv="entrar">Entrar</button>'
    : '¿Primera vez? <button data-pact="modo" data-pv="crear">Crear una cuenta</button>') + "</p>";
  h += '<p class="puerta__pie">Los datos de este negocio no salen de aquí.</p>';
  h += "</div>";

  document.getElementById("puerta").innerHTML = h;
}

function abrirPuerta(modo){
  modoPuerta = modo || "entrar";
  ocupadaPuerta = false;
  cerrarHoja();
  pintarPuerta();
  document.getElementById("puerta").classList.add("on");
  document.documentElement.setAttribute("data-puerta", "1");
  window.scrollTo(0,0);
}
function cerrarPuerta(){
  msgPuerta = null;
  var p = document.getElementById("puerta");
  p.classList.remove("on");
  p.innerHTML = "";
  document.documentElement.removeAttribute("data-puerta");
}
function puertaArriba(){ return document.documentElement.hasAttribute("data-puerta"); }

// Con la sesión ya iniciada: si el rol todavía no da acceso, la puerta se queda.
function revisarRol(rol){
  if(rol === "pendiente" || rol === "bloqueado"){ abrirPuerta("espera"); return false; }
  if(puertaArriba()) cerrarPuerta();
  return true;
}

function tocarPuerta(accion){
  var el;
  if(accion === "modo") return;

  if(accion === "salir"){
    NUBE.salir(function(){ SYNC.olvidar(); aplicarRol(); abrirPuerta("entrar"); });
    return;
  }

  if(accion === "revisar"){
    msgPuerta = null; pintarPuerta();
    NUBE.traerPerfil(function(err){
      if(err){ msgPuerta = {t:"err", txt:err}; pintarPuerta(); return; }
      var rol = NUBE.rol();
      if(revisarRol(rol)){
        aplicarRol();
        SYNC.sincronizar(function(){});
        avisar("Listo, ya tienes acceso");
      }else{
        msgPuerta = {t:"err", txt:"Todavía no. Avísale al dueño."};
        pintarPuerta();
      }
    });
    return;
  }

  if(ocupadaPuerta) return;
  var crear = accion === "crear";
  correoPuerta = (val0("p_correo") || "").trim();
  var clave = val0("p_clave");
  var nombre = crear ? (val0("p_nom") || "").trim() : "";

  if(!correoPuerta || !clave){
    msgPuerta = {t:"err", txt:"Escribe tu correo y tu clave."};
    pintarPuerta();
    return;
  }

  ocupadaPuerta = true; msgPuerta = null; pintarPuerta();

  function listo(err, resultado){
    ocupadaPuerta = false;
    if(err){
      msgPuerta = {t:"err", txt:err};
      pintarPuerta();
      return;
    }
    if(resultado === "confirmar"){
      modoPuerta = "entrar";
      msgPuerta = {t:"ok", txt:"Cuenta creada. Te llegó un correo para confirmarla; ábrelo y vuelve acá."};
      pintarPuerta();
      return;
    }
    // Entramos, pero el rol manda: hasta que el dueño apruebe, no se pasa.
    NUBE.traerPerfil(function(){
      if(!revisarRol(NUBE.rol())) return;
      aplicarRol();
      SYNC.sincronizar(function(){});
      avisar("Hola de nuevo");
      if(/^#\/l\//.test(location.hash || "")) aplicarHash();
    });
  }

  if(crear) NUBE.registrar(correoPuerta, clave, nombre, listo);
  else NUBE.entrar(correoPuerta, clave, function(err){ listo(err, "sesion"); });
}

function val0(id){ var e = document.getElementById(id); return e ? e.value : ""; }

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-pact]") : null;
  if(!t) return;
  if(t.getAttribute("data-pact") === "modo"){
    modoPuerta = t.getAttribute("data-pv");
    msgPuerta = null;
    pintarPuerta();
    return;
  }
  tocarPuerta(t.getAttribute("data-pact"));
});

// Enter en la clave entra, que es lo que espera cualquiera.
document.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter" || !puertaArriba()) return;
  var el = ev.target;
  if(!el.id || el.id.slice(0,2) !== "p_") return;
  ev.preventDefault();
  tocarPuerta(modoPuerta === "crear" ? "crear" : "entrar");
});

/* ============================================================
   21. Eventos
   ============================================================ */

var VISTAS = ["conteo","lotes","ficha","resumen","insumos","cotiza","costos"];

function render(){
  if(vista === "conteo")  pintarConteo();
  if(vista === "lotes")   pintarLotes();
  if(vista === "ficha")   pintarFicha();
  if(vista === "resumen") pintarResumen();
  if(vista === "insumos") pintarInsumos();
  if(vista === "cotiza")  COT.pintar();
  if(vista === "costos")  COS.pintar();
  document.getElementById("progWrap").hidden = vista !== "conteo";
  actualizarProgreso();
}

function irA(t){
  vista = t;
  VISTAS.forEach(function(k){
    document.getElementById("tab-" + k).hidden = k !== t;
  });
  // La ficha vive dentro de Lotes: la pestaña sigue encendida mientras se navega.
  var pest = t === "ficha" ? "lotes" : t;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.classList.toggle("on", b.dataset.tab === pest);
  });

  var l = t === "ficha" ? lotePorId(loteAbierto) : null;
  var titulos = {conteo:"Inventario", lotes:"Lotes", resumen:"Resumen", insumos:"Insumos", cotiza:"Cotizador", costos:"Costos"};
  document.getElementById("hTitle").textContent = l ? l.cod : (titulos[t] || "Inventario");
  document.getElementById("hSub").textContent   = l ? nomLote(l) : "Hongos del Sur";
  document.getElementById("hMark").hidden   = t === "ficha";
  document.getElementById("btnAtras").hidden = t !== "ficha";

  if(t !== "ficha" && location.hash) limpiarHash();
  window.scrollTo(0,0);
  render();
}

// Con rol de producción, las pestañas de inventario no se muestran. El cotizador
// y los costos tampoco: son precios, clientes y márgenes, y eso es del dueño.
var SOLO_DUENO = ["conteo","insumos","cotiza","costos"];
function aplicarRol(){
  var soloProd = NUBE.rol() === "produccion";
  SOLO_DUENO.forEach(function(k){
    var b = document.querySelector('.tab[data-tab="' + k + '"]');
    if(b) b.hidden = soloProd;
  });
  document.getElementById("progWrap").hidden = soloProd || vista !== "conteo";
  if(soloProd && SOLO_DUENO.indexOf(vista) >= 0) irA("lotes");
  else render();
}

function limpiarHash(){
  if(history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  else location.hash = "";
}

// El enlace de confirmación del correo vuelve con la sesión (o con un error)
// escrita en el hash: se recoge, se limpia la barra de direcciones y se sigue.
function tomarSesionDelHash(){
  var h = location.hash || "";
  if(h.indexOf("access_token=") < 0 && h.indexOf("error_description=") < 0 && h.indexOf("error=") < 0) return false;

  var p = {};
  h.replace(/^#\/?/, "").split("&").forEach(function(par){
    var i = par.indexOf("=");
    if(i > 0) p[decodeURIComponent(par.slice(0,i))] = decodeURIComponent(par.slice(i+1).replace(/\+/g," "));
  });
  limpiarHash();

  if(!p.access_token){
    avisar(NUBE.traducir(p.error_description || p.error || "El enlace del correo ya no sirve: pide uno nuevo"));
    return true;
  }
  NUBE.desdeHash(p, function(err){
    if(err){ avisar(err); abrirPuerta("entrar"); return; }
    NUBE.traerPerfil(function(){
      if(!revisarRol(NUBE.rol())) return;
      aplicarRol();
      avisar("Correo confirmado · sesión iniciada");
    });
  });
  return true;
}

// Un QR escaneado llega como  …/#/l/CODIGO  y abre esa ficha.
// Si la etiqueta era de una bolsa, llega  …/#/l/CODIGO/b/7  y abre su pesaje.
function aplicarHash(){
  var m = /^#\/l\/([^\/]+)(?:\/b\/(\d+))?\/?$/.exec(location.hash || "");
  if(!m){
    if(vista === "ficha") irA("lotes");
    return;
  }
  var cod = decodeURIComponent(m[1]);
  var l = lotePorCod(cod);
  if(!l){
    limpiarHash();
    irA("lotes");
    avisar("No hay ningún lote « " + cod + " » guardado en esta copia de la app");
    return;
  }
  loteAbierto = l.id;
  irA("ficha");
  if(m[2]) hojaBolsa(l.id, Number(m[2]));
}

function volverDeFicha(){
  if(location.hash) history.back();
  else irA("lotes");
}

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-tab],[data-toggle],[data-same],[data-open],[data-d],[data-edit],[data-save],[data-del],[data-act],[data-close],#btnMenu,#btnCerrar,#btnCopiar,#btnCsvCompra") : null;
  if(!t) return;

  if(t.dataset.tab){ irA(t.dataset.tab); return; }

  if(t.dataset.toggle){
    var k = t.dataset.toggle;
    abiertas[k] = !abiertas[k];
    t.closest(".stage").classList.toggle("open", abiertas[k]);
    t.setAttribute("aria-expanded", String(!!abiertas[k]));
    return;
  }

  if(t.dataset.same){ todoIgual(t.dataset.same); return; }

  if(t.dataset.open){
    var fila = t.closest(".row"), yaAbierta = fila.classList.contains("open");
    Array.prototype.forEach.call(document.querySelectorAll(".row.open"), function(r){ r.classList.remove("open"); });
    if(!yaAbierta){ fila.classList.add("open"); pintarDetalle(t.dataset.open); }
    return;
  }

  if(t.dataset.d){
    var id = t.dataset.id, it = porId(id);
    var inp = document.querySelector('[data-in="' + id + '"]');
    var v = (parseFloat(inp.value) || 0) + Number(t.dataset.d) * paso(it.uni);
    if(v < 0) v = 0;
    v = Math.round(v * 100) / 100;
    inp.value = v;
    marcar(id, v);
    return;
  }

  if(t.dataset.edit){ hojaInsumo(t.dataset.edit); return; }
  if(t.dataset.save !== undefined && t.hasAttribute("data-save")){ guardarInsumo(t.dataset.save); return; }

  if(t.dataset.del){
    var d = porId(t.dataset.del);
    if(confirm("¿Eliminar «" + d.nom + "» y todo su historial?\n\nSi solo dejaste de usarlo, es mejor marcarlo como pausado.")){
      DB.items = DB.items.filter(function(i){ return i.id !== d.id; });
      guardar(); cerrarHoja(); render();
      avisar("Insumo eliminado");
    }
    return;
  }

  // En la pestaña del cotizador el ⋮ abre su menú, no el del inventario.
  if(t.id === "btnMenu"){ if(vista === "cotiza") COT.menu(); else hojaMenu(); return; }
  if(t.id === "btnCerrar"){ cerrarSemana(); return; }

  if(t.id === "btnCopiar"){
    var txt = textoCompra();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ avisar("Lista copiada — pégala en WhatsApp"); },
                                              function(){ avisar("No se pudo copiar"); });
    } else { avisar("Este navegador no permite copiar"); }
    return;
  }
  if(t.id === "btnCsvCompra"){ descargar("lista-compra-" + hoyISO() + ".txt", textoCompra(), "text/plain"); return; }

  if(t.dataset.close){ cerrarHoja(); return; }

  var a = t.dataset.act;
  if(a === "respaldo"){ respaldar(); return; }
  if(a === "restaurar"){ restaurar(); return; }
  if(a === "csv"){ descargar("inventario-" + hoyISO() + ".csv", csvInventario(), "text/csv"); return; }
  if(a === "csvlotes"){
    if(!DB.lotes.length){ avisar("Todavía no hay lotes que exportar"); return; }
    descargar("lotes-" + hoyISO() + ".csv", csvLotes(), "text/csv");
    return;
  }
  if(a === "base"){ hojaBase(); return; }
  if(a === "nube"){ hojaNube(); return; }
  if(a === "tema"){
    var actual = document.documentElement.getAttribute("data-theme");
    var oscuro = actual ? actual === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var nuevo = oscuro ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nuevo);
    try{ localStorage.setItem("hds_tema", nuevo); }catch(e){}
    cerrarHoja();
    return;
  }
  if(a === "ayuda"){ hojaAyuda(); return; }
  if(a === "reset"){
    if(confirm("Esto borra todos los insumos, el historial de conteos y también los lotes con sus fotos.\n\n¿Seguro? Descarga un respaldo antes si tienes dudas.")){
      DB.lotes.forEach(function(l){
        l.ev.forEach(function(e){ (e.fotos || []).forEach(function(f){ FOTOS.borrar(f); }); });
      });
      DB = semilla(); loteAbierto = null;
      guardar(); cerrarHoja(); limpiarHash(); irA("conteo");
      avisar("Todo restablecido");
    }
    return;
  }
});

/* --- Eventos de la parte de lotes --- */

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-flote],[data-lote],[data-led],[data-lsave],[data-lborrar],[data-lact],[data-lev],[data-esave],[data-eborrar],[data-ver],[data-timp],[data-tqr],[data-lbolsa],[data-lgrupo],[data-bfin],[data-bsave],[data-bdesc],[data-bundesc],[data-nact],[data-prol],#btnAtras,#lupaCerrar,#lupaBorrar") : null;
  if(!t) return;

  if(t.dataset.nact){
    if(t.dataset.nact === "modo"){ modoNube = t.dataset.v; hojaNube(); return; }
    tocarNube(t.dataset.nact);
    return;
  }
  if(t.dataset.prol){ cambiarRol(t.dataset.pid, t.dataset.prol); return; }
  if(t.dataset.lbolsa){ hojaBolsa(loteAbierto, t.dataset.lbolsa); return; }
  if(t.dataset.lgrupo){ hojaBolsas(loteAbierto, t.dataset.lgrupo, t.dataset.lol); return; }
  if(t.hasAttribute("data-bfin")){ cerrarHoja(); render(); return; }
  if(t.dataset.bsave){ guardarBolsa(loteAbierto, t.dataset.bsave); return; }
  if(t.dataset.bdesc){ descartarBolsa(loteAbierto, t.dataset.bdesc, false); return; }
  if(t.dataset.bundesc){ descartarBolsa(loteAbierto, t.dataset.bundesc, true); return; }

  if(t.id === "btnAtras"){ volverDeFicha(); return; }
  if(t.id === "lupaCerrar"){ document.getElementById("lupa").classList.remove("open"); return; }
  if(t.id === "lupaBorrar"){ borrarFotoActual(); return; }

  if(t.dataset.flote){ filtroLotes = t.dataset.flote; pintarLotes(); return; }
  if(t.dataset.lote){ abrirLote(t.dataset.lote); return; }
  if(t.dataset.led){ hojaLote(t.dataset.led); return; }
  if(t.hasAttribute("data-lsave")){ guardarLote(t.dataset.lsave); return; }
  if(t.dataset.ver){ verFoto(t.dataset.ver); return; }
  if(t.dataset.lev){ hojaEvento(loteAbierto, null, t.dataset.lev); return; }
  if(t.hasAttribute("data-esave")){ guardarEvento(t.dataset.esave, t.dataset.etipo, t.dataset.eid || null); return; }
  if(t.dataset.eborrar){ borrarEvento(t.dataset.elote, t.dataset.eborrar); return; }

  if(t.dataset.lborrar){
    var l = lotePorId(t.dataset.lborrar);
    if(!l) return;
    if(confirm("¿Eliminar el lote " + l.cod + " con todo su historial y sus fotos?\n\nSi el lote terminó, es mejor marcarlo como Finalizado.")){
      l.ev.forEach(function(e){ (e.fotos || []).forEach(function(f){ FOTOS.borrar(f); }); });
      DB.lotes = DB.lotes.filter(function(x){ return x.id !== l.id; });
      loteAbierto = null;
      guardar(); cerrarHoja(); limpiarHash(); irA("lotes");
      avisar("Lote eliminado");
    }
    return;
  }

  if(t.dataset.timp){
    var cant = Math.max(1, Math.min(500, Math.round(parseFloat(document.getElementById("t_cant").value) || 1)));
    if(etiqNumerar && cant > 120 && !confirm("Vas a generar " + cant + " etiquetas numeradas, cada una con su propio código QR.\n\nPuede demorar unos segundos. ¿Seguir?")) return;
    imprimirEtiquetas(lotePorId(t.dataset.timp), etiqChica, cant, etiqNumerar);
    return;
  }
  if(t.dataset.tqr){
    var lq = lotePorId(t.dataset.tqr);
    descargar("qr-" + lq.cod + ".svg", QR.svg(urlLote(lq)), "image/svg+xml");
    return;
  }

  var a = t.dataset.lact;
  if(a === "addfoto"){
    pedirFotos(function(ds){
      if(!ds.length){ avisar("No se pudo leer la imagen"); return; }
      fotosPend = fotosPend.concat(ds);
      pintarPendientes(fotosGuardadasEnHoja());
      avisar(ds.length + (ds.length === 1 ? " foto lista" : " fotos listas") + " — falta guardar");
    });
    return;
  }
  if(a === "savebase"){
    DB.cfg.base = document.getElementById("b_url").value.trim();
    guardar(); cerrarHoja();
    avisar(DB.cfg.base ? "Dirección guardada" : "Se usará la dirección desde donde se abra la app");
    return;
  }
  if(a === "etiq"){ hojaEtiqueta(loteAbierto); return; }
  if(a === "bolsas"){ hojaBolsas(loteAbierto); return; }
  if(a){ hojaEvento(loteAbierto, a, null); return; }
});

// Las fotos ya guardadas del evento que se está editando, para volver a pintarlas.
function fotosGuardadasEnHoja(){
  var b = document.querySelector("[data-esave]");
  if(!b || !b.dataset.eid) return [];
  var l = lotePorId(b.dataset.esave);
  if(!l) return [];
  var e = l.ev.filter(function(x){ return x.id === b.dataset.eid; })[0];
  return e ? (e.fotos || []) : [];
}

document.addEventListener("change", function(ev){
  var el = ev.target;
  if(!el.id) return;

  // Formulario de lote: la especie muestra u oculta el nombre libre y refresca el código.
  if(el.id === "f_esp" || el.id === "f_finoc" || el.id === "f_otro"){
    var esp = document.getElementById("f_esp"), wrap = document.getElementById("wrapOtro");
    if(esp && wrap) wrap.hidden = esp.value !== "OTR";
    var cod = document.getElementById("f_cod");
    if(cod && cod.dataset.auto === "1"){
      var otro = document.getElementById("f_otro");
      var f = document.getElementById("f_finoc");
      cod.value = nuevoCodigo(esp.value, f ? f.value : hoyISO(), otro ? otro.value : "");
    }
    return;
  }
  if(el.id === "t_tam" || el.id === "t_num"){
    if(el.id === "t_tam") etiqChica = el.value === "1";
    else etiqNumerar = el.value === "1";
    var cantAct = Math.max(1, Math.round(parseFloat(document.getElementById("t_cant").value) || 1));
    hojaEtiqueta(loteAbierto, cantAct);
    return;
  }
  // Pesaje por bolsa: cambiar de oleada o de fecha vuelve a pintar las filas.
  if(el.id === "bb_o" || el.id === "bb_f"){
    var caja = document.getElementById("bbLista");
    if(caja) pintarFilasBolsas(caja.dataset.lote);
    return;
  }
});

document.addEventListener("input", function(ev){
  var el = ev.target;
  if(el.id === "f_cod"){ el.dataset.auto = "0"; return; }
  if(el.dataset && el.dataset.bin){
    var caja = document.getElementById("bbLista");
    if(caja) anotarBolsa(caja.dataset.lote, Number(el.dataset.bin), el.value);
    return;
  }
  if(el.dataset && el.dataset.in){
    var v = parseFloat(el.value);
    if(el.value === "" || isNaN(v)) return;
    marcar(el.dataset.in, Math.max(0, v));
    return;
  }
  if(el.dataset && el.dataset.compra){
    var b = borrador();
    var c = parseFloat(el.value);
    b.c[el.dataset.compra] = isNaN(c) ? 0 : Math.max(0, c);
    guardar();
    refrescarFila(el.dataset.compra);
    return;
  }
  if(el.id === "buscar"){
    filtro = el.value;
    var pos = el.selectionStart;
    pintarInsumos();
    var nuevoInp = document.getElementById("buscar");
    nuevoInp.focus();
    try{ nuevoInp.setSelectionRange(pos, pos); }catch(e){}
    return;
  }
});

document.addEventListener("change", function(ev){
  if(ev.target.dataset && ev.target.dataset.in && ev.target.value === ""){
    ev.target.value = stock(ev.target.dataset.in);
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key !== "Escape") return;
  var lupa = document.getElementById("lupa");
  if(lupa.classList.contains("open")){ lupa.classList.remove("open"); return; }
  cerrarHoja();
});

// Volver atrás en el teléfono sale de la ficha en vez de cerrar la app.
window.addEventListener("hashchange", aplicarHash);

/* ============================================================
   22. Arranque
   ============================================================ */

try{
  var tema = localStorage.getItem("hds_tema");
  if(tema) document.documentElement.setAttribute("data-theme", tema);
}catch(e){}

// El sello real reemplaza al hongo dibujado de la cabecera cuando está incrustado.
if(LOGO_DEF){
  var marca = document.getElementById("hMark");
  marca.classList.add("mark--logo");
  marca.innerHTML = '<img src="' + LOGO_DEF + '" alt="">';
}

DB = cargar();
borrador();
guardar();

// El hash se lee antes que nada, porque puede traer la sesión del enlace del
// correo —y de eso depende si la puerta se abre o no— o el lote de un QR.
var vinoDelCorreo = tomarSesionDelHash();

// Si había sesión, se recupera el rol por detrás: la app no espera al servidor.
SYNC.cargarEstado();
if(NUBE.cargar()){
  NUBE.traerPerfil(function(err){
    // Sin señal no se sabe el rol y se sigue con lo guardado: el galpón no
    // tiene cobertura y quedarse afuera ahí sería peor que cualquier riesgo.
    if(err) return;
    if(!revisarRol(NUBE.rol())) return;
    aplicarRol();
    SYNC.sincronizar(function(){});
  });
}
// Al recuperar la señal, lo que quedó pendiente sube solo.
window.addEventListener("online", function(){ SYNC.pronto(); });

if(!vinoDelCorreo && /^#\/l\//.test(location.hash || "")) aplicarHash();
else irA("conteo");

// La puerta va al final: la app ya está pintada detrás, así que al entrar
// aparece entera, incluida la ficha del lote si se llegó escaneando un QR.
if(EXIGE_SESION && !NUBE.sesion()) abrirPuerta("entrar");

})();
