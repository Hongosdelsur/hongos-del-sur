<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b17" media="(prefers-color-scheme: dark)">
<meta name="description" content="Inventario de insumos y trazabilidad de lotes - Hongos del Sur">
<meta name="robots" content="noindex, nofollow">

<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

<body><title>Inventario — Hongos del Sur</title>

<style>
/* ============================================================
   Inventario — Hongos del Sur
   Paleta y tipografía derivadas de DESIGN.md del sitio.
   Sin dependencias externas: funciona sin internet.
   ============================================================ */

:root{
  /* Superficies */
  --paper:#faf7f0;
  --sand:#f1ead9;
  --cream:#fffdf8;
  --line:rgba(32,33,28,.13);
  --line-soft:rgba(32,33,28,.07);

  /* Texto */
  --ink:#20211c;
  --ink-soft:#5a5e51;
  --ink-faint:#8b8f7f;

  /* Marca */
  --forest:#223a2e;
  --moss:#7b8a58;
  --amber:#c07a34;
  --earth:#8a6a45;

  /* Acción */
  --accent:#223a2e;
  --accent-hi:#2f4f3c;
  --on-accent:#faf7f0;

  /* Estado (semántico, independiente del acento) */
  --ok:#5f7a4a;
  --ok-bg:rgba(95,122,74,.12);
  --warn:#b5722c;
  --warn-bg:rgba(181,114,44,.13);
  --crit:#a33b28;
  --crit-bg:rgba(163,59,40,.12);

  /* Tipografía */
  --f-display:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --r:12px;
  --r-lg:18px;
  --shadow:0 1px 2px rgba(32,33,28,.05),0 6px 18px rgba(32,33,28,.05);
}

@media (prefers-color-scheme:dark){
  :root{
    --paper:#161b17;
    --sand:#1d241f;
    --cream:#1e2620;
    --line:rgba(233,229,217,.15);
    --line-soft:rgba(233,229,217,.07);
    --ink:#e9e5d9;
    --ink-soft:#a2ab96;
    --ink-faint:#78806e;
    --forest:#8fa367;
    --moss:#9bb87a;
    --amber:#d99a52;
    --earth:#b09070;
    --accent:#8fa367;
    --accent-hi:#a3b87b;
    --on-accent:#12180f;
    --ok:#9bb87a;
    --ok-bg:rgba(155,184,122,.15);
    --warn:#d99a52;
    --warn-bg:rgba(217,154,82,.15);
    --crit:#dc7a63;
    --crit-bg:rgba(220,122,99,.15);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#161b17; --sand:#1d241f; --cream:#1e2620;
  --line:rgba(233,229,217,.15); --line-soft:rgba(233,229,217,.07);
  --ink:#e9e5d9; --ink-soft:#a2ab96; --ink-faint:#78806e;
  --forest:#8fa367; --moss:#9bb87a; --amber:#d99a52; --earth:#b09070;
  --accent:#8fa367; --accent-hi:#a3b87b; --on-accent:#12180f;
  --ok:#9bb87a; --ok-bg:rgba(155,184,122,.15);
  --warn:#d99a52; --warn-bg:rgba(217,154,82,.15);
  --crit:#dc7a63; --crit-bg:rgba(220,122,99,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  --paper:#faf7f0; --sand:#f1ead9; --cream:#fffdf8;
  --line:rgba(32,33,28,.13); --line-soft:rgba(32,33,28,.07);
  --ink:#20211c; --ink-soft:#5a5e51; --ink-faint:#8b8f7f;
  --forest:#223a2e; --moss:#7b8a58; --amber:#c07a34; --earth:#8a6a45;
  --accent:#223a2e; --accent-hi:#2f4f3c; --on-accent:#faf7f0;
  --ok:#5f7a4a; --ok-bg:rgba(95,122,74,.12);
  --warn:#b5722c; --warn-bg:rgba(181,114,44,.13);
  --crit:#a33b28; --crit-bg:rgba(163,59,40,.12);
  --shadow:0 1px 2px rgba(32,33,28,.05),0 6px 18px rgba(32,33,28,.05);
}

*,*::before,*::after{box-sizing:border-box}

.hds{
  font-family:var(--f-body);
  color:var(--ink);
  background:var(--paper);
  /* Trama de papel milimetrado, muy tenue — guiño al cuaderno de laboratorio */
  background-image:
    linear-gradient(var(--line-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:26px 26px;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));
  line-height:1.5;
  font-size:16px;
}
.hds :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hds button{font:inherit;color:inherit;cursor:pointer}
.hds input,.hds select,.hds textarea{font:inherit;color:inherit}

.wrap{max-width:680px;margin:0 auto;padding:0 14px}

/* ---------- Cabecera ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.top__in{display:flex;align-items:center;gap:11px;padding:11px 14px;max-width:680px;margin:0 auto}
.mark{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
.mark svg{width:19px;height:19px;display:block}
/* Con el sello real incrustado sobra el círculo dibujado: el logo ya es uno.
   En tema oscuro se invierte, porque el sello es tinta negra sobre nada. */
.mark--logo{border:0}
.mark--logo img{width:34px;height:34px;object-fit:contain;display:block}
@media (prefers-color-scheme:dark){ .mark--logo img{filter:invert(1)} }
:root[data-theme="dark"] .mark--logo img{filter:invert(1)}
:root[data-theme="light"] .mark--logo img{filter:none}
.top__txt{min-width:0;flex:1}
.top__t{font-family:var(--f-display);font-size:1.12rem;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.top__s{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px}
.iconbtn{
  width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:var(--cream);display:grid;place-items:center;color:var(--ink-soft);
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:18px;height:18px}
/* display:grid gana sobre el [hidden] del navegador; hay que desactivarlo a mano. */
.iconbtn[hidden],.mark[hidden]{display:none}

/* Barra de avance del conteo */
.prog{padding:0 14px 9px;max-width:680px;margin:0 auto}
.prog__lbl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:5px}
.prog__lbl b{color:var(--ink);font-weight:600}
.prog__bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.prog__fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ---------- Grupos de etapa ---------- */
.stage{
  background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-top:12px;overflow:hidden;box-shadow:var(--shadow);
}
.stage__head{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:14px;background:none;border:0;border-bottom:1px solid transparent;
}
.stage.open .stage__head{border-bottom-color:var(--line-soft)}
.stage__n{
  font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.04em;
  width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  background:var(--sand);color:var(--earth);margin-top:1px;
}
.stage__txt{flex:1;min-width:0}
.stage__t{display:block;font-family:var(--f-display);font-size:1.04rem;font-weight:600;line-height:1.25;text-wrap:balance}
.stage__d{display:block;font-size:.76rem;color:var(--ink-faint);margin-top:3px;line-height:1.4}
.stage__c{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-soft);flex:none;display:flex;align-items:center;gap:7px;margin-top:3px;font-variant-numeric:tabular-nums}
.chev{width:15px;height:15px;transition:transform .25s;color:var(--ink-faint)}
.stage.open .chev{transform:rotate(180deg)}
.stage__body{display:none}
.stage.open .stage__body{display:block}

.samebar{display:flex;justify-content:flex-end;padding:9px 14px 4px}
.btn-same{
  border:1px dashed var(--line);background:none;color:var(--ink-soft);
  border-radius:99px;padding:6px 13px;font-size:.76rem;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-same:hover{border-color:var(--accent);border-style:solid;color:var(--accent)}
.btn-same svg{width:13px;height:13px}

/* ---------- Fila de insumo ---------- */
.row{border-top:1px solid var(--line-soft)}
.row:first-child{border-top:0}
.row__top{display:flex;align-items:flex-start;gap:10px;padding:11px 14px}
.row__tap{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.row__nom{font-size:.94rem;font-weight:500;line-height:1.3;display:block}
.row__meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-top:4px;
  font-family:var(--f-mono);font-size:.67rem;color:var(--ink-faint);letter-spacing:.02em;
}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-weight:600;letter-spacing:.03em}
.pill--ok{background:var(--ok-bg);color:var(--ok)}
.pill--warn{background:var(--warn-bg);color:var(--warn)}
.pill--crit{background:var(--crit-bg);color:var(--crit)}
.pill--vivo{background:var(--sand);color:var(--earth)}
.stage__c{white-space:nowrap}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}

.stepper{display:flex;align-items:center;gap:0;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.stepper button{
  width:34px;height:40px;border:0;background:none;color:var(--ink-soft);
  font-size:1.15rem;line-height:1;display:grid;place-items:center;
}
.stepper button:hover{background:var(--sand);color:var(--accent)}
.stepper input{
  width:60px;height:40px;border:0;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  background:none;text-align:center;font-family:var(--f-mono);font-size:.95rem;font-weight:600;
  font-variant-numeric:tabular-nums;padding:0 2px;-moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row.done .stepper{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.row.pend .row__nom::after{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--amber);margin-left:7px;vertical-align:middle;
}

/* Cajón de detalle */
.det{display:none;padding:0 14px 14px;margin-left:0}
.row.open .det{display:block}
.det__box{background:var(--sand);border-radius:var(--r);padding:12px}
.det__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:11px}
.det__k{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.det__v{font-family:var(--f-mono);font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.det__row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.det__row label{font-size:.8rem;color:var(--ink-soft);flex:1;min-width:120px}
.mini{width:88px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--cream);text-align:center;font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.mini::-webkit-outer-spin-button,.mini::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.spark{margin-top:11px;height:34px;width:100%;display:block;overflow:visible}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:.78rem;text-decoration:underline;text-underline-offset:3px;margin-top:10px}

/* ---------- Botones ---------- */
.btn{
  border:0;border-radius:12px;padding:13px 18px;font-size:.92rem;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--primary:hover{background:var(--accent-hi)}
.btn--ghost{background:var(--cream);color:var(--ink);border:1px solid var(--line)}
.btn--ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn--danger{background:var(--cream);color:var(--crit);border:1px solid var(--crit-bg)}
.btn svg{width:16px;height:16px;flex:none}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ---------- Resumen ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.tile__k{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);line-height:1.3}
.tile__v{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:7px;line-height:1}
.tile__s{font-size:.72rem;color:var(--ink-faint);margin-top:5px;line-height:1.35}
.tile--crit .tile__v{color:var(--crit)}
.tile--warn .tile__v{color:var(--warn)}

.card{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.card__head{padding:14px 14px 11px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card__t{font-family:var(--f-display);font-size:1.02rem;font-weight:600}
.card__n{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-faint)}
.card__body{padding:0 14px 14px}

.buy{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid var(--line-soft)}
.buy__t{flex:1;min-width:0}
.buy__n{font-size:.9rem;font-weight:500;line-height:1.3}
.buy__m{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-faint);margin-top:3px}
.buy__q{font-family:var(--f-mono);font-size:1rem;font-weight:700;text-align:right;flex:none;max-width:104px;font-variant-numeric:tabular-nums}
.buy__q small{display:block;font-size:.62rem;font-weight:400;color:var(--ink-faint);letter-spacing:.03em}
button.buy{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft)}
button.buy:hover{background:var(--sand)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar__l{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px}
.bar__l span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.bar__t{height:6px;background:var(--sand);border-radius:99px;overflow:hidden}
.bar__f{height:100%;border-radius:99px;background:var(--moss)}

.hist{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums}
.hist th{text-align:left;font-weight:600;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:0 0 7px}
.hist td{padding:7px 0;border-top:1px solid var(--line-soft)}
.hist td:nth-child(n+2),.hist th:nth-child(n+2){text-align:right}
.tablescroll{overflow-x:auto}

/* ---------- Insumos ---------- */
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:0 14px;font-size:.92rem;margin-top:12px}
.ilist{margin-top:12px}
.igroup__t{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);padding:16px 4px 7px}
.irow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--cream);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:7px}
.irow:hover{border-color:var(--accent)}
.irow__t{flex:1;min-width:0}
.irow__n{font-size:.9rem;font-weight:500;line-height:1.3}
.irow__m{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-faint);margin-top:3px}
.irow.off{opacity:.5}
.irow__go{color:var(--ink-faint);flex:none;width:15px;height:15px}

/* ---------- Hoja inferior (modal) ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet__bg{position:absolute;inset:0;background:rgba(20,22,18,.45);backdrop-filter:blur(2px)}
.sheet__panel{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;
  background:var(--paper);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  max-width:680px;margin:0 auto;animation:up .28s cubic-bezier(.32,.72,0,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sheet__t{font-family:var(--f-display);font-size:1.14rem;font-weight:600;margin-bottom:3px}
.sheet__d{font-size:.8rem;color:var(--ink-faint);margin-bottom:16px;line-height:1.5}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--cream);padding:0 13px;font-size:.92rem}
.field textarea{width:100%;min-height:82px;border:1px solid var(--line);border-radius:11px;background:var(--cream);padding:11px 13px;font-size:.92rem;line-height:1.5;resize:vertical;font-family:inherit}
.field input[type="date"]{-webkit-appearance:none;appearance:none}
.field .hint{display:block;font-family:var(--f-body);font-size:.72rem;letter-spacing:0;text-transform:none;color:var(--ink-faint);margin-top:6px;line-height:1.5}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu__item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:13px 4px;border-bottom:1px solid var(--line-soft);font-size:.92rem}
.menu__item:last-child{border-bottom:0}
.menu__item svg{width:17px;height:17px;color:var(--ink-faint);flex:none}
.menu__item small{display:block;font-size:.72rem;color:var(--ink-faint);margin-top:2px;font-weight:400}
.menu__item span{flex:1}

/* ---------- Navegación inferior ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs__in{display:flex;max-width:680px;margin:0 auto}
.tab{flex:1;background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);position:relative}
.tab svg{width:20px;height:20px}
.tab span{font-size:.66rem;font-weight:500;letter-spacing:.01em}
.tab.on{color:var(--accent)}
.tab[hidden]{display:none}
.tab .badge{
  position:absolute;top:5px;left:50%;margin-left:6px;min-width:16px;height:16px;
  border-radius:99px;background:var(--crit);color:#fff;font-family:var(--f-mono);
  font-size:.58rem;font-weight:700;display:grid;place-items:center;padding:0 4px;
  font-style:normal;
}
/* display:grid de arriba gana sobre el [hidden] del navegador; hay que desactivarlo aquí. */
.tab .badge[hidden]{display:none}

/* ---------- Lotes: lista ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 3px;margin:0 -2px}
.chip{
  flex:none;border:1px solid var(--line);background:var(--cream);color:var(--ink-soft);
  border-radius:99px;padding:6px 13px;font-size:.78rem;white-space:nowrap;
}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lote{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow);
}
.lote:hover{border-color:var(--accent)}
.lote__t{flex:1;min-width:0}
.lote__cod{font-family:var(--f-mono);font-size:.8rem;font-weight:700;letter-spacing:.04em}
.lote__nom{font-size:.94rem;font-weight:500;margin-top:2px;line-height:1.3}
.lote__m{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-top:6px;font-family:var(--f-mono);font-size:.66rem;color:var(--ink-faint)}
.lote__r{flex:none;text-align:right;padding-top:2px}
.lote__kg{font-family:var(--f-mono);font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.lote__kg small{display:block;font-size:.6rem;font-weight:400;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}
/* Las filas se arman con <span> dentro de botones: hay que volverlos bloque. */
.lote__cod,.lote__nom,.lote__kg,.ev__b,.ev__t,.ev__d,.ev__x,.buy__n,.buy__m{display:block}
.est{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;
  font-family:var(--f-mono);font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
.est--prep{background:var(--line-soft);color:var(--ink-soft)}
.est--inoc{background:var(--sand);color:var(--earth)}
.est--incu{background:var(--warn-bg);color:var(--warn)}
.est--fruc{background:var(--ok-bg);color:var(--ok)}
.est--cose{background:var(--warn-bg);color:var(--amber)}
.est--fin{background:var(--line-soft);color:var(--ink-faint)}
.est--desc{background:var(--crit-bg);color:var(--crit)}
.tarde{color:var(--crit)}

/* ---------- Lotes: ficha ---------- */
.ficha{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;margin-top:12px;box-shadow:var(--shadow)}
.ficha__cod{font-family:var(--f-mono);font-size:1.3rem;font-weight:700;letter-spacing:.02em;line-height:1.1}
.ficha__nom{font-family:var(--f-display);font-size:1.12rem;font-weight:600;margin-top:7px;line-height:1.25}
.ficha__sci{font-family:var(--f-mono);font-size:.69rem;color:var(--moss);margin-top:3px;letter-spacing:.02em}
.ficha__meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px 11px;margin-top:11px;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-faint)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.acts .btn{padding:12px 9px;font-size:.85rem}
.acts .full{grid-column:1 / -1}

/* Tablero de bolsas */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;margin-top:11px}
.bchip{
  border:1px solid var(--line);background:var(--paper);border-radius:10px;
  padding:6px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.bchip__n{font-family:var(--f-mono);font-size:.58rem;color:var(--ink-faint);letter-spacing:.06em}
.bchip__v{font-family:var(--f-mono);font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bchip--ok{background:var(--ok-bg);border-color:transparent}
.bchip--ok .bchip__v{color:var(--ok)}
.bchip--desc{background:var(--crit-bg);border-color:transparent}
.bchip--desc .bchip__v,.bchip--desc .bchip__n{color:var(--crit)}
.bchip:hover{border-color:var(--accent)}

/* Fila de pesaje bolsa por bolsa */
.brow{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line-soft)}
.brow:first-child{border-top:0}
.brow__n{
  font-family:var(--f-mono);font-size:.72rem;font-weight:600;color:var(--ink-soft);
  width:34px;height:34px;flex:none;border-radius:9px;background:var(--sand);display:grid;place-items:center;
}
.brow.tiene .brow__n{background:var(--ok-bg);color:var(--ok)}
.brow.fuera .brow__n{background:var(--crit-bg);color:var(--crit)}
.brow__c{flex:1;display:flex;align-items:center;gap:8px}
.brow input{
  flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--cream);
  padding:0 11px;text-align:right;font-family:var(--f-mono);font-size:.92rem;font-variant-numeric:tabular-nums;
}
.brow__u{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-faint);width:18px;flex:none}
.btot{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  margin-top:6px;padding:11px 0 3px;display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--f-mono);font-size:.78rem;color:var(--ink-soft);
}
.btot b{font-size:1.02rem;color:var(--ink)}

/* Línea de tiempo del lote */
.ev{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 0;border-top:1px solid var(--line-soft)}
.ev:first-child{border-top:0}
.ev__i{flex:none;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:var(--sand);color:var(--earth);margin-top:1px}
.ev__i svg{width:14px;height:14px}
.ev--cos .ev__i{background:var(--ok-bg);color:var(--ok)}
.ev--cont .ev__i{background:var(--crit-bg);color:var(--crit)}
.ev--est .ev__i{background:var(--warn-bg);color:var(--warn)}
.ev__b{flex:1;min-width:0}
.ev__t{font-size:.89rem;font-weight:500;line-height:1.35}
.ev__d{font-family:var(--f-mono);font-size:.64rem;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}
.ev__x{font-size:.82rem;color:var(--ink-soft);margin-top:5px;line-height:1.5;white-space:pre-wrap}

/* Fotos */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.gal button{padding:0;border:0;background:none;display:block;border-radius:10px;overflow:hidden}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--sand);border:1px solid var(--line-soft);border-radius:10px}
.evgal{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.evgal button{padding:0;border:0;background:none}
.evgal img{width:62px;height:62px;object-fit:cover;border-radius:9px;display:block;background:var(--sand);border:1px solid var(--line-soft)}
.lupa{position:fixed;inset:0;z-index:80;background:rgba(14,17,13,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
.lupa.open{display:flex}
.lupa img{max-width:100%;max-height:76vh;border-radius:12px;display:block}
.lupa .btn{max-width:320px}

/* ---------- QR y etiqueta ---------- */
.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:var(--r);border:1px solid var(--line)}
.qrbox svg{width:200px;height:200px;display:block}
.qrurl{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-faint);word-break:break-all;text-align:center;margin-top:9px;line-height:1.5}

/* La etiqueta: mismo componente en la vista previa y en el papel.
   Tinta negra sobre blanco a propósito, para que salga igual en cualquier impresora. */
.et{
  width:64mm;height:46mm;padding:4mm 4.5mm;background:#fff;color:#111;
  border:.25mm dashed #b9b9b9;display:flex;gap:3mm;align-items:stretch;
  font-family:var(--f-body);overflow:hidden;
}
.et--s{width:48mm;height:34mm;padding:2.8mm 3mm;gap:2mm}
.et__t{flex:1;min-width:0;display:flex;flex-direction:column}
.et__marca{display:flex;align-items:center;gap:1.6mm;font-family:var(--f-mono);font-size:6.2pt;letter-spacing:.14em;text-transform:uppercase;color:#333}
.et__marca svg{width:4.2mm;height:4.2mm;flex:none}
/* El sello real va algo más grande que el dibujo: es un disco con texto dentro
   y por debajo de 5 mm se convierte en una mancha. */
.et__marca img{width:5.6mm;height:5.6mm;flex:none;object-fit:contain;display:block}
.et--s .et__marca{font-size:5pt;gap:1.2mm}
.et--s .et__marca svg{width:3.4mm;height:3.4mm}
.et--s .et__marca img{width:4.4mm;height:4.4mm}
.et__nom{font-family:var(--f-display);font-size:12pt;font-weight:700;line-height:1.1;margin-top:2mm;letter-spacing:-.01em}
.et--s .et__nom{font-size:9pt;margin-top:1.4mm}
.et__sci{font-family:var(--f-mono);font-size:5.8pt;color:#555;margin-top:.8mm;letter-spacing:.02em}
.et--s .et__sci{font-size:4.8pt}
.et__sep{border-top:.3mm solid #111;margin:auto 0 1.8mm;padding-top:1.6mm}
.et--s .et__sep{margin-bottom:1.2mm;padding-top:1.1mm}
.et__k{font-family:var(--f-mono);font-size:5.4pt;letter-spacing:.14em;text-transform:uppercase;color:#666}
.et--s .et__k{font-size:4.6pt}
.et__cod{font-family:var(--f-mono);font-size:11pt;font-weight:700;letter-spacing:.04em;line-height:1.15}
.et--s .et__cod{font-size:8.4pt}
.et__f{font-family:var(--f-mono);font-size:6.2pt;color:#333;margin-top:1.2mm;white-space:nowrap}
.et--s .et__f{font-size:5pt;margin-top:.8mm}
.et__b{font-family:var(--f-mono);font-size:6.6pt;font-weight:700;color:#111;margin-top:.9mm;letter-spacing:.04em}
.et--s .et__b{font-size:5.4pt;margin-top:.6mm}
.et__qr{flex:none;width:21mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.et--s .et__qr{width:17mm}
.et__qr svg{width:21mm;height:21mm;display:block}
.et--s .et__qr svg{width:17mm;height:17mm}
.et__qr span{font-family:var(--f-mono);font-size:5pt;color:#666;margin-top:1mm;text-align:center;letter-spacing:.06em}
.et--s .et__qr span{display:none}
.etprev{display:flex;justify-content:center;padding:12px 0 4px}

/* La hoja de impresión vive fuera de la app: en pantalla no se ve, en papel es lo único que sale. */
#hojaEtiq{display:none}
.hojaGrid{display:flex;flex-wrap:wrap;align-content:flex-start}
.et{break-inside:avoid;page-break-inside:avoid}

/* Desde la misma app se imprimen dos cosas distintas: la hoja de etiquetas y la
   cotización. El atributo `data-print` del <html> dice cuál, y cada modo esconde
   al otro. Sin el atributo no se imprime nada de la app: es a propósito, así un
   Ctrl+P suelto no saca una hoja a medias.
   El margen de página es único (8 mm, calibrado para que entren tres etiquetas
   por fila en A4); la cotización recupera sus 12 mm con padding propio. */
@page{size:A4;margin:8mm}
@media print{
  .hds,.puerta{display:none !important}
  html[data-print="etiq"] #hojaEtiq{display:block;background:#fff}
}

/* ============================================================
   Cotizador
   Todo lo propio del cotizador. Las clases compartidas (.card, .btn, .field,
   .chip, .tile, .sheet…) son las de arriba: el cotizador nació con el mismo
   sistema de diseño, así que al traerlo sólo hicieron falta las suyas.
   ============================================================ */

/* Sub-navegación de la pestaña Cotizar */
.cotnav{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 3px;margin:0 -2px}

/* El cotizador usa .in en vez de .field input: mismo aspecto. */
.in{
  width:100%;height:44px;border:1px solid var(--line);border-radius:11px;
  background:var(--cream);padding:0 13px;font-size:.92rem;
}
textarea.in{height:auto;min-height:88px;padding:11px 13px;line-height:1.55;resize:vertical;font-family:inherit}
select.in{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;
}
.in:focus{border-color:var(--accent);outline:none}
.in[type="date"]{-webkit-appearance:none;appearance:none}
.lbl{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.hint{font-size:.73rem;color:var(--ink-faint);margin-top:6px;line-height:1.5}
.hint b{color:var(--warn);font-weight:600}

/* align-items:end mantiene los campos alineados aunque una etiqueta ocupe dos
   líneas; el margen del btnrow separa los botones de la última tarjeta. */
#tab-cotiza .f2,#sheetPanel .f2{align-items:end}
#tab-cotiza .btnrow,#sheetPanel .btnrow{margin-top:12px}
.btn--sm{padding:10px 13px;font-size:.84rem;border-radius:10px}
.btn--wa{background:#1d9e50;color:#fff}
.btnrow--3{grid-template-columns:1fr 1fr 1fr}
.chip--warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip--crit{background:var(--crit-bg);border-color:transparent;color:var(--crit)}
.chip--ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}

/* Líneas del detalle */
.li{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:9px;background:var(--paper)}
.li__top{display:flex;gap:8px;align-items:flex-start}
.li__top .in{height:40px}
.li__x{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--cream);color:var(--ink-faint);display:grid;place-items:center}
.li__x:hover{color:var(--crit);border-color:var(--crit-bg)}
.li__x svg{width:16px;height:16px}
.li__grid{display:grid;grid-template-columns:78px 1fr 1fr;gap:7px;margin-top:8px}
.li__grid .in{height:40px;padding:0 9px;font-size:.86rem;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.li__grid select.in{text-align:left;font-family:var(--f-body);padding-right:26px;background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%}
.li__foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.li__tot{margin-left:auto;font-family:var(--f-mono);font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}

/* Totales */
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:.88rem;border-bottom:1px solid var(--line-soft)}
.tot span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tot--big{border-bottom:0;padding-top:12px;font-size:1.05rem;font-weight:700}
.tot--big span:last-child{font-size:1.3rem;letter-spacing:-.02em}
.tot--faint{color:var(--ink-faint)}

/* Historial de cotizaciones */
.hrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--cream);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:8px}
.hrow:hover{border-color:var(--accent)}
.hrow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hrow__t{flex:1;min-width:0}
.hrow__n{font-size:.9rem;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow__m{font-family:var(--f-mono);font-size:.65rem;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}
.hrow__v{font-family:var(--f-mono);font-size:.9rem;font-weight:700;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.hrow__v small{display:block;font-size:.58rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-top:3px;padding:2px 6px;border-radius:99px}

/* Elegir producto del catálogo */
.pick{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--cream);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:7px}
.pick:hover{border-color:var(--accent)}
.pick__t{flex:1;min-width:0}
.pick__n{font-size:.9rem;font-weight:500}
.pick__m{font-family:var(--f-mono);font-size:.65rem;color:var(--ink-faint);margin-top:3px}
.pick__p{font-family:var(--f-mono);font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------
   El documento (lo que se convierte en PDF)
   Colores fijos: es una hoja de papel, no cambia con el tema.
   Nada depende de un fondo de color para leerse — si el navegador
   imprime sin "gráficos de fondo", el documento sigue completo.
   ------------------------------------------------------------ */
.doc{
  --d-ink:#1b1c18;
  --d-soft:#55594d;
  --d-faint:#8a8e7e;
  --d-line:rgba(27,28,24,.18);
  --d-hair:rgba(27,28,24,.09);
  --d-forest:#223a2e;
  --d-amber:#a9642a;
  --d-sand:#f2ecdd;
  background:#fffdf8;color:var(--d-ink);
  max-width:790px;margin:12px auto 0;padding:26px 24px 22px;
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  font-size:.85rem;line-height:1.5;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.doc *{border-color:var(--d-line)}

.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.dbrand{display:flex;gap:13px;align-items:flex-start;min-width:0}
.dlogo{width:62px;height:62px;flex:none;object-fit:contain;display:block}
.dlogo--svg{border:1.5px solid var(--d-forest);border-radius:50%;display:grid;place-items:center;color:var(--d-forest)}
.dlogo--svg svg{width:34px;height:34px}
.dname{font-family:var(--f-display);font-size:1.28rem;font-weight:600;letter-spacing:-.015em;line-height:1.1;color:var(--d-forest)}
.dgiro{font-size:.72rem;color:var(--d-soft);margin-top:4px;line-height:1.45}
.dmeta{font-family:var(--f-mono);font-size:.66rem;color:var(--d-faint);margin-top:5px;line-height:1.6;letter-spacing:.01em}
.dtit{text-align:right;flex:none}
.dtit__k{font-family:var(--f-display);font-size:1.5rem;font-weight:600;letter-spacing:.02em;line-height:1;color:var(--d-ink)}
.dtit__n{font-family:var(--f-mono);font-size:.95rem;font-weight:700;color:var(--d-amber);margin-top:6px;letter-spacing:.04em}
.dtit__f{font-family:var(--f-mono);font-size:.66rem;color:var(--d-faint);margin-top:6px;line-height:1.6}

/* Borde y no fondo: los bordes se imprimen aunque el navegador tenga
   desactivados los "gráficos de fondo". */
.drule{height:0;border-top:2px solid var(--d-forest);margin:16px 0 0}
.drule--thin{height:1px;background:var(--d-line);margin:14px 0}

.dcols{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;margin-top:18px}
.dblk__k{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--d-amber);margin-bottom:7px}
.dcli__n{font-size:.98rem;font-weight:600;line-height:1.3}
.dcli__l{font-size:.78rem;color:var(--d-soft);margin-top:3px;line-height:1.55}
.dcond{width:100%;font-size:.76rem}
.dcond td{padding:2px 0;vertical-align:top}
.dcond td:first-child{color:var(--d-faint);white-space:nowrap;padding-right:12px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding-top:4px}
.dcond td:last-child{font-weight:500}

.dt{width:100%;border-collapse:collapse;margin-top:20px;font-size:.8rem}
.dt th{
  font-family:var(--f-mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--d-soft);font-weight:600;text-align:left;padding:0 8px 7px;
  border-bottom:1.5px solid var(--d-forest);
}
.dt td{padding:9px 8px;border-bottom:1px solid var(--d-hair);vertical-align:top}
.dt th:first-child,.dt td:first-child{padding-left:0;width:26px;color:var(--d-faint);font-family:var(--f-mono);font-size:.7rem}
.dt th:last-child,.dt td:last-child{padding-right:0}
.dt .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt .c{text-align:center;font-family:var(--f-mono);font-size:.72rem;color:var(--d-soft)}
.dt__n{font-weight:600;line-height:1.35}
.dt__d{font-size:.72rem;color:var(--d-soft);margin-top:2px;line-height:1.45}
.dt__cod{font-family:var(--f-mono);font-size:.63rem;color:var(--d-faint);letter-spacing:.05em;margin-top:3px}
.dt__tot{font-weight:600}

.dtnota{font-size:.66rem;color:var(--d-faint);margin-top:7px;letter-spacing:.01em}
.dbot{display:grid;grid-template-columns:1fr 300px;gap:26px;margin-top:20px;align-items:start}
.dsum{width:100%;font-size:.82rem}
.dsum td{padding:5px 0;border-bottom:1px solid var(--d-hair)}
.dsum td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dsum tr:last-child td{border-bottom:0}
.dsum .k{color:var(--d-soft)}
.dsum .big td{
  background:var(--d-sand);font-weight:700;font-size:1rem;
  border-top:1.5px solid var(--d-forest);border-bottom:0;padding:10px 11px;
}
.dsum .big td:first-child{border-radius:8px 0 0 8px;letter-spacing:.06em;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase}
.dsum .big td:last-child{border-radius:0 8px 8px 0;font-size:1.12rem;letter-spacing:-.02em}
.dwords{font-size:.68rem;color:var(--d-faint);margin-top:8px;text-align:right;line-height:1.5;font-style:italic}

.dbank{border:1px solid var(--d-line);border-radius:10px;padding:12px 14px;background:var(--d-sand)}
.dbank__k{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--d-forest);margin-bottom:7px;font-weight:600}
.dbank table{width:100%;font-size:.73rem}
.dbank td{padding:1.5px 0;vertical-align:top}
.dbank td:first-child{color:var(--d-soft);padding-right:10px;white-space:nowrap}
.dbank td:last-child{font-family:var(--f-mono);font-weight:600}

.dobs{margin-top:18px}
.dobs ol{margin:0;padding-left:16px;font-size:.72rem;color:var(--d-soft);line-height:1.65}
.dobs li{margin-bottom:3px}
.dnota{font-size:.72rem;color:var(--d-soft);line-height:1.6;margin-top:10px;white-space:pre-wrap}

.dfoot{
  margin-top:22px;padding-top:12px;border-top:1px solid var(--d-line);
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  font-family:var(--f-mono);font-size:.64rem;color:var(--d-faint);letter-spacing:.04em;flex-wrap:wrap;
}
.dfoot__l{font-style:italic;font-family:var(--f-display);font-size:.75rem;letter-spacing:0;color:var(--d-forest)}
.dfalta{color:#a33b28;font-weight:600}

@media (max-width:640px){
  .doc{padding:20px 15px;font-size:.8rem;margin-left:-4px;margin-right:-4px}
  .dcols,.dbot{grid-template-columns:1fr;gap:16px}
  .dhead{flex-direction:column;gap:14px}
  .dtit{text-align:left}
  .dt th,.dt td{padding-left:5px;padding-right:5px}
  .dt .um{display:none}
  .dlogo{width:52px;height:52px}
  /* En pantalla angosta la tabla se desliza sola; en el PDF va completa. */
  .dtwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dt{min-width:330px}
  .li__grid{grid-template-columns:70px 1fr 1fr;gap:6px}
}

/* ---------- Impresión de la cotización: sólo el documento ---------- */
@media print{
  html[data-print="cot"] .hds{display:block !important;background:#fff;background-image:none;padding:0;min-height:0}
  html[data-print="cot"] .top,
  html[data-print="cot"] .tabs,
  html[data-print="cot"] .sheet,
  html[data-print="cot"] .toast,
  html[data-print="cot"] .lupa,
  html[data-print="cot"] .noprint{display:none !important}
  html[data-print="cot"] .wrap{max-width:none;padding:0}
  html[data-print="cot"] main > section{display:none !important}
  html[data-print="cot"] main > section#tab-cotiza{display:block !important}
  /* Sólo la hoja. Las otras sub-vistas no llevan [hidden] si se llegó por Ctrl+P
     estando en Editar, así que se esconden a mano. */
  html[data-print="cot"] #cot-editar,
  html[data-print="cot"] #cot-hist,
  html[data-print="cot"] #cot-ajustes{display:none !important}
  html[data-print="cot"] #cot-doc{display:block !important}
  html[data-print="cot"] .doc{
    /* El @page global lleva 8 mm porque las etiquetas lo necesitan; estos 4 mm
       completan los 12 mm con los que está calibrada la cotización. */
    max-width:none;width:auto;margin:0;padding:4mm;border:0;border-radius:0;
    box-shadow:none;background:#fff;font-size:9.4pt;line-height:1.4;
  }
  html[data-print="cot"] .dname{font-size:15pt}
  html[data-print="cot"] .dtit__k{font-size:17pt}
  html[data-print="cot"] .dtit__n{font-size:11pt}
  html[data-print="cot"] .dt{font-size:8.8pt}
  html[data-print="cot"] .dsum .big td:last-child{font-size:13pt}
  /* Un poco más apretado que en pantalla: así una cotización de 6 líneas
     con datos bancarios y observaciones cabe en una sola hoja. */
  html[data-print="cot"] .dlogo{width:54px;height:54px}
  html[data-print="cot"] .drule{margin-top:12px}
  html[data-print="cot"] .dcols{margin-top:13px;gap:20px}
  html[data-print="cot"] .dt{margin-top:14px}
  html[data-print="cot"] .dt td{padding:5px 8px}
  html[data-print="cot"] .dbot{margin-top:12px;gap:20px}
  html[data-print="cot"] .dobs{margin-top:11px}
  html[data-print="cot"] .dobs ol{line-height:1.45}
  html[data-print="cot"] .dfoot{margin-top:12px;padding-top:8px}
  html[data-print="cot"] .dnota{margin-top:7px}
  html[data-print="cot"] .dt tr,
  html[data-print="cot"] .dbank,
  html[data-print="cot"] .dobs,
  html[data-print="cot"] .dbot,
  html[data-print="cot"] .dfoot{break-inside:avoid;page-break-inside:avoid}
  html[data-print="cot"] .dt thead{display:table-header-group}
  html[data-print="cot"] .dtwrap{overflow:visible}
}

/* ============================================================
   Costos y precios
   Reutiliza .stage, .card, .tile, .field, .chip y .btn. Sólo agrega lo suyo:
   la fila de línea de receta, la cifra grande y las tablas de precios.
   ============================================================ */

.knav{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 3px;margin:0 -2px}

/* Cifra grande: el costo por kilo es lo primero que hay que ver */
.khero{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.khero__k{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.khero__v{font-family:var(--f-mono);font-size:2.05rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;margin-top:8px}
.khero__s{font-size:.79rem;color:var(--ink-faint);margin-top:8px;line-height:1.5}
.khero--ok .khero__v{color:var(--ok)}
.khero--crit .khero__v{color:var(--crit)}

/* Línea de receta dentro de una etapa */
.krow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);padding:10px 14px}
.krow:hover{background:var(--sand)}
.krow__t{flex:1;min-width:0}
.krow__n{display:block;font-size:.89rem;font-weight:500;line-height:1.3}
.krow__m{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--ink-faint);margin-top:3px;line-height:1.4}
.krow__c{flex:none;text-align:right;font-family:var(--f-mono);font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums}
.krow__c small{display:block;font-size:.6rem;font-weight:400;color:var(--ink-faint);letter-spacing:.03em}
.krow--eta .krow__n{color:var(--earth)}
.krow--falta .krow__c{color:var(--crit)}

.ktot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:.74rem;color:var(--ink-soft)}
.ktot b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.kadd{display:flex;flex-wrap:wrap;gap:7px;padding:11px 14px 13px;border-top:1px solid var(--line-soft)}
.kadd button{border:1px dashed var(--line);background:none;color:var(--ink-soft);border-radius:99px;padding:6px 12px;font-size:.75rem}
.kadd button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.stage.apagada{opacity:.55}

/* Avisos: lo que falta para que el número sea de verdad */
.kaviso{border:1px solid var(--warn-bg);background:var(--warn-bg);border-radius:var(--r);padding:11px 13px;margin-top:12px;font-size:.81rem;color:var(--warn);line-height:1.5}
.kaviso b{font-weight:700}
.kaviso button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:.81rem}

/* Precio de un insumo, editable en la misma lista */
.kpre{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.kpre:first-child{border-top:0}
.kpre__t{flex:1;min-width:0}
.kpre__n{font-size:.88rem;font-weight:500;line-height:1.3}
.kpre__m{font-family:var(--f-mono);font-size:.65rem;color:var(--ink-faint);margin-top:3px}
.kpre input{width:104px;height:38px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--cream);padding:0 11px;text-align:right;font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}

/* Tablas de la vista Costo y Precios */
.kt{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.74rem;font-variant-numeric:tabular-nums}
.kt th{text-align:left;font-weight:600;font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:0 0 7px}
.kt td{padding:7px 0;border-top:1px solid var(--line-soft);vertical-align:top}
.kt td:nth-child(n+2),.kt th:nth-child(n+2){text-align:right;white-space:nowrap;padding-left:8px}
.kt tr.fuerte td{font-weight:700;border-top:1px solid var(--line);color:var(--ink)}
.kt small{display:block;font-family:var(--f-body);font-size:.68rem;color:var(--ink-faint);letter-spacing:0}

/* ============================================================
   Puerta: lo primero que ve quien abre la dirección sin sesión
   ============================================================ */
.puerta{
  position:fixed;inset:0;z-index:95;display:none;
  background:var(--paper);
  background-image:
    linear-gradient(var(--line-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:26px 26px;
  overflow-y:auto;
  font-family:var(--f-body);color:var(--ink);
}
.puerta.on{display:block}
html[data-puerta]{overflow:hidden}
.puerta__in{
  max-width:400px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;justify-content:center;
  padding:32px 22px calc(32px + env(safe-area-inset-bottom,0px));
}
.puerta__sello{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center;color:var(--accent)}
.puerta__sello svg{width:38px;height:38px}
.puerta__sello img{width:56px;height:56px;object-fit:contain;display:block}
@media (prefers-color-scheme:dark){ .puerta__sello img{filter:invert(1)} }
:root[data-theme="dark"] .puerta__sello img{filter:invert(1)}
:root[data-theme="light"] .puerta__sello img{filter:none}
.puerta__t{font-family:var(--f-display);font-size:1.5rem;font-weight:600;text-align:center;letter-spacing:-.01em;line-height:1.2}
.puerta__s{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-top:7px}
.puerta__d{font-size:.86rem;color:var(--ink-soft);text-align:center;margin:20px 0 22px;line-height:1.6}
.puerta__err{
  background:var(--crit-bg);color:var(--crit);border-radius:var(--r);
  padding:10px 13px;font-size:.82rem;line-height:1.5;margin-bottom:13px;
}
.puerta__pie{font-size:.75rem;color:var(--ink-faint);text-align:center;margin-top:18px;line-height:1.6}
.puerta__pie button{background:none;border:0;padding:0;color:var(--accent);font-size:.75rem;text-decoration:underline;text-underline-offset:3px}

/* ---------- Varios ---------- */
.empty{text-align:center;padding:34px 20px;color:var(--ink-faint);font-size:.86rem;line-height:1.6}
.empty svg{width:32px;height:32px;margin-bottom:11px;opacity:.5}
.note{font-size:.76rem;color:var(--ink-faint);line-height:1.55;margin-top:12px;padding:0 4px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:99px;
  font-size:.84rem;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p,table{margin:0}

@media (min-width:560px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .row__nom{font-size:.97rem}
}
/* Con seis pestañas abajo, en pantallas angostas el rótulo se achica antes de cortarse. */
@media (max-width:389px){
  .tab span{font-size:.58rem}
  .tab svg{width:19px;height:19px}
  .tab{padding:9px 2px 11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

<script>
(function(){
"use strict";

/* ============================================================
   1. Datos base — catálogo inicial de insumos por etapa

// Los respaldos viejos no traen lotes ni configuración: se completan al cargar.
function normalizar(d){
  if(!Array.isArray(d.lotes)) d.lotes = [];
  if(!d.cfg) d.cfg = {};
  if(typeof d.cfg.base !== "string") d.cfg.base = "";
  d.lotes.forEach(function(l){ if(!Array.isArray(l.ev)) l.ev = []; });

}

  }catch(e){ /* almacenamiento no disponible o dato corrupto: partimos de cero */ }
  return semilla();
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function hoyISO(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fechaCorta(iso){
  var p = String(iso).split("-");
  return Number(p[2]) + " " + MESES[Number(p[1])-1];
}
function fechaLarga(iso){
  var p = String(iso).split("-");
  return Number(p[2]) + " de " + ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][Number(p[1])-1];
}
function fechaAnio(iso){
  var p = String(iso).split("-");
  return Number(p[2]) + " " + MESES[Number(p[1])-1] + " " + p[0];
}
// Fechas como texto plano: nada de husos horarios, se opera a mediodía UTC.
function aDia(iso){
  var p = String(iso).split("-");
  return Date.UTC(Number(p[0]), Number(p[1])-1, Number(p[2]), 12);
}
function sumarDias(iso, n){
  var d = new Date(aDia(iso) + n*86400000);
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
}
function diasEntre(a, b){ return Math.round((aDia(b) - aDia(a)) / 86400000); }

function num(n){
  if(!isFinite(n)) return "0";
  var r = Math.round(n*10)/10;
  return r.toLocaleString("es-CL", {maximumFractionDigits:1});
}
function kg(n){
  return (Math.round((n||0)*100)/100).toLocaleString("es-CL", {maximumFractionDigits:2});
}
// Los kilos se escriben con coma («6,2»): se aceptan las dos formas.
function leerNum(v){
  var n = parseFloat(String(v == null ? "" : v).replace(",", ".").replace(/[^\d.]/g, ""));
  return isFinite(n) ? n : 0;
}
function clp(n){
  return "$" + Math.round(n||0).toLocaleString("es-CL", {maximumFractionDigits:0});
}
function redondear(n, uni){
  if(ENTERAS[uni]) return Math.ceil(n);
  return Math.round(n*10)/10;
}
function paso(uni){ return PASOS[uni] || 1; }

var toastT;
function avisar(msg){

  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);

}

/* ============================================================
   4. Semanas: borrador abierto + historial cerrado
   ============================================================ */

function cerradas(){ return DB.semanas.filter(function(s){ return s.cerrada; }); }

function borrador(crear){
  var u = DB.semanas[DB.semanas.length-1];
  if(u && !u.cerrada) return u;
  if(crear === false) return null;
  var nueva = {f:hoyISO(), v:{}, c:{}, r:{}, cerrada:false};
  DB.semanas.push(nueva);
  return nueva;
}

// Último valor conocido de un insumo: primero el borrador, si no la última cerrada.
function ultimoCerrado(id){
  var c = cerradas();
  for(var i=c.length-1; i>=0; i--){
    if(c[i].v[id] != null) return c[i].v[id];
  }
  return 0;
}
function stock(id){
  var b = borrador(false);
  if(b && b.v[id] != null) return b.v[id];
  return ultimoCerrado(id);
}

// Serie de consumo semanal: consumo = stock anterior + compras − stock actual.
function serie(id){
  var c = cerradas(), out = [], prev = null;
  for(var i=0; i<c.length; i++){
    var s = c[i], val = s.v[id] != null ? s.v[id] : prev;
    if(val == null) continue;
    var comp = s.c[id] || 0, cons = null;
    if(prev != null){
      // Si subió el stock sin registrar compra, asumimos compra no anotada (consumo 0).
      cons = Math.max(0, prev + comp - val);
    }
    out.push({f:s.f, stock:val, compras:comp, consumo:cons});
    prev = val;
  }
  return out;
}

function consumoProm(id){
  var s = serie(id).filter(function(x){ return x.consumo != null; });
  if(!s.length) return null;
  var ult = s.slice(-6), suma = 0;
  for(var i=0;i<ult.length;i++) suma += ult[i].consumo;
  return suma / ult.length;
}

function cobertura(id){
  var cp = consumoProm(id);
  if(cp == null || cp <= 0) return null;
  return stock(id) / cp;
}

// Un insumo que nunca se contó no tiene estado: no es que falte, es que no se sabe.
function sinDatos(id){
  var b = borrador(false);
  if(b && b.r[id]) return false;
  var c = cerradas();
  for(var i=0; i<c.length; i++){ if(c[i].v[id] != null) return false; }
  return true;
}

// nuevo · vivo · ok · atención · crítico
function estado(it){
  if(sinDatos(it.id)) return "nuevo";
  if(it.tipo === "v") return "vivo";
  var s = stock(it.id), cob = cobertura(it.id);
  if(it.min > 0 && s <= it.min) return "crit";
  if(cob != null && cob < 1) return "crit";
  if(it.min > 0 && s <= it.min * 1.6) return "warn";
  if(cob != null && cob < 2.5) return "warn";
  return "ok";
}

function sugerencia(it){
  var s = stock(it.id), cp = consumoProm(it.id) || 0;
  var objetivo = Math.max(it.min * 2, cp * 4);
  var falta = objetivo - s;
  return falta > 0 ? redondear(falta, it.uni) : 0;
}

function porComprar(){
  return activos()
    .filter(function(i){ return i.tipo !== "v"; })
    .map(function(i){ return {it:i, est:estado(i), sug:sugerencia(i)}; })
    .filter(function(x){ return (x.est === "crit" || x.est === "warn") && x.sug > 0; })
    .sort(function(a,b){
      if(a.est !== b.est) return a.est === "crit" ? -1 : 1;
      return a.it.et.localeCompare(b.it.et);
    });
}

function valorInventario(){
  var total = 0, sinCosto = 0;
  activos().forEach(function(i){
    if(i.tipo === "v") return;
    if(!i.costo) sinCosto++;
    total += stock(i.id) * (i.costo || 0);
  });
  return {total:total, sinCosto:sinCosto};
}

// Mini gráfico de la evolución del stock (últimas 10 semanas cerradas)
function chispa(s){
  var d = s.slice(-10).map(function(x){ return x.stock; });
  if(d.length < 2) return "";
  var max = Math.max.apply(null, d), min = Math.min.apply(null, d);
  var rango = (max - min) || 1, W = 260, H = 30;
  var pts = d.map(function(v,i){
    var x = (i/(d.length-1))*W;
    var y = H - ((v-min)/rango)*H;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  var area = "0," + H + " " + pts.join(" ") + " " + W + "," + H;
  var ux = W, uy = H - ((d[d.length-1]-min)/rango)*H;
  return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polygon points="' + area + '" fill="var(--moss)" opacity=".14"/>' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--moss)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '<circle cx="' + ux.toFixed(1) + '" cy="' + uy.toFixed(1) + '" r="2.6" fill="var(--moss)" vector-effect="non-scaling-stroke"/></svg>';
}

function actualizarContadorEtapa(etk){

  var items = activos().filter(function(i){ return i.et === etk; });
  var listos = items.filter(function(i){ return b.r[i.id]; }).length;

// Bloque de producción del resumen: el pulso de los lotes, antes del inventario.
function bloqueProduccion(){
  var act = lotesActivos(), prox = proximos(7), hoy = hoyISO();
  var bolsas = 0;
  act.forEach(function(l){ bolsas += bolsasVivas(l); });
  var incu = lotesEn("incu"), fruc = lotesEn("fruc");
  function bolsasDe(ls){ var t = 0; ls.forEach(function(l){ t += bolsasVivas(l); }); return t; }

  var h = '<div class="igroup__t">Producción</div>';
  h += '<div class="tiles" style="margin-top:0">';
  h += '<div class="tile"><div class="tile__k">Lotes activos</div><div class="tile__v">' + act.length + '</div>';
  h += '<div class="tile__s">' + (act.length ? bolsas + " bolsas en producción" : "ningún lote en curso") + "</div></div>";
  h += '<div class="tile"><div class="tile__k">En incubación</div><div class="tile__v">' + incu.length + '</div>';
  h += '<div class="tile__s">' + bolsasDe(incu) + " bolsas colonizando</div></div>";
  h += '<div class="tile"><div class="tile__k">En fructificación</div><div class="tile__v">' + fruc.length + '</div>';
  h += '<div class="tile__s">' + bolsasDe(fruc) + " bolsas en cámara</div></div>";
  h += '<div class="tile"><div class="tile__k">Cosechado</div><div class="tile__v">' + kg(producido(30)) + '</div>';
  h += '<div class="tile__s">kg en 30 días · ' + kg(producido(0)) + " kg histórico</div></div>";
  h += "</div>";

  if(prox.length){
    var vencidos = prox.filter(function(x){ return x.e.f <= hoy; }).length;
    h += '<div class="card"><div class="card__head"><h2 class="card__t">Próximos a cosecha</h2>';
    h += '<span class="card__n">' + (vencidos ? vencidos + " ya en punto" : prox.length + " en 7 días") + "</span></div>";
    prox.slice(0,6).forEach(function(x){
      var d = diasEntre(hoy, x.e.f);
      h += '<button class="buy" data-lote="' + esc(x.l.id) + '">';
      h += '<span class="est est--' + x.l.est + '">' + esc(estDe(x.l.est).n) + "</span>";
      h += '<span class="buy__t"><span class="buy__n">' + esc(nomLote(x.l)) + "</span>";
      h += '<span class="buy__m">' + esc(x.l.cod) + " · " + bolsasVivas(x.l) + " bolsas</span></span>";
      h += '<span class="buy__q' + (d <= 0 ? " tarde" : "") + '" style="font-size:.82rem">' + (d < 0 ? "hace " + (-d) + "d" : d === 0 ? "hoy" : "en " + d + "d");
      h += "<small>" + esc(x.e.txt) + "</small></span></button>";
    });
    h += "</div>";
  }

  // Cuánto esperar de una bolsa, que es lo que permite planificar una tanda.
  var pc = promedioPorCepa();
  if(pc.length){
    var medidas = pc.filter(function(f){ return f.medido; }).length;
    h += '<div class="card"><div class="card__head"><h2 class="card__t">Cuánto da cada bolsa</h2>';
    h += '<span class="card__n">por hongo y cepa</span></div>';
    pc.forEach(function(f){
      h += '<div class="buy">';
      h += '<div class="buy__t"><div class="buy__n">' + esc(f.n) + "</div>";
      h += '<div class="buy__m">' + (f.medido
        ? f.bolsas + " bolsas pesadas una a una · " + Math.round(f.min) + "–" + Math.round(f.max) + " g"
        : "estimado del total de " + f.lotes + (f.lotes === 1 ? " lote" : " lotes")) + "</div></div>";
      h += '<div class="buy__q">' + Math.round(f.prom) + "<small>g/bolsa</small></div></div>";
    });
    h += '<div class="card__body" style="padding-top:12px"><p class="note" style="padding:0;margin:0">' +
      (medidas ? "Las cepas con bolsas pesadas una a una muestran además el rango entre la peor y la mejor. "
               : "Por ahora todo es estimación: divide lo cosechado por las bolsas del lote. ") +
      "Para medir de verdad, crea el lote con registro <em>bolsa por bolsa</em>.</p></div>";
    h += "</div>";
  }

  var pe = porEspecie(90);
  if(pe.filas.length){
    h += '<div class="card"><div class="card__head"><h2 class="card__t">Producción por hongo</h2>';
    h += '<span class="card__n">últimos 90 días</span></div><div class="card__body"><div class="bars">';
    pe.filas.forEach(function(f){
      h += '<div><div class="bar__l"><span>' + esc(f.n) + "</span><span>" + kg(f.v) + " kg</span></div>";
      h += '<div class="bar__t"><div class="bar__f" style="width:' + ((f.v/pe.max)*100).toFixed(1) + '%"></div></div></div>';
    });
    h += "</div></div></div>";
  }
  return h;
}

  } else {
    lista.forEach(function(x){

      h += '<div class="buy__t"><div class="buy__n">' + esc(x.it.nom) + "</div>";
      h += '<div class="buy__m">' + esc(et.n) + " · quedan " + num(stock(x.it.id)) + " " + esc(x.it.uni) + "</div></div>";
      h += '<div class="buy__q">' + num(x.sug);
      h += "<small>" + esc(x.it.uni) + (x.it.costo ? " · " + clp(x.sug * x.it.costo) : "") + "</small></div></div>";
    });
    h += '<div class="card__body" style="padding-top:13px"><div class="btnrow">';
    h += '<button class="btn btn--ghost" id="btnCopiar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copiar lista</button>';
    h += '<button class="btn btn--ghost" id="btnCsvCompra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Descargar</button>';
    h += "</div></div>";

  var gasto = gastoPorEtapa();

function gastoPorEtapa(){
  var acum = {}, max = 0, total = 0;
  activos().forEach(function(i){
    if(i.tipo === "v" || !i.costo) return;
    var s = serie(i.id).filter(function(x){ return x.consumo != null; }).slice(-4);
    var suma = 0;
    for(var k=0;k<s.length;k++) suma += s[k].consumo;
    var v = suma * i.costo;
    if(v <= 0) return;
    acum[i.et] = (acum[i.et] || 0) + v;
  });
  var filas = ETAPAS.filter(function(e){ return acum[e.k]; })
    .map(function(e){ return {n:e.n, v:acum[e.k]}; })
    .sort(function(a,b){ return b.v - a.v; });
  filas.forEach(function(f){ total += f.v; if(f.v > max) max = f.v; });
  return {filas:filas, max:max || 1, total:total};
}

/* ============================================================
   8. Lotes: datos y cálculos
   ============================================================ */

function espDe(k){ return ESPECIES.filter(function(e){ return e.k === k; })[0] || ESPECIES[ESPECIES.length-1]; }
function estDe(k){ return ESTADOS.filter(function(e){ return e.k === k; })[0] || ESTADOS[0]; }
function lotePorId(id){ return DB.lotes.filter(function(l){ return l.id === id; })[0]; }
function lotePorCod(c){
  c = String(c || "").toUpperCase();
  return DB.lotes.filter(function(l){ return String(l.cod).toUpperCase() === c; })[0];
}
function nomLote(l){ return l.esp === "OTR" ? (l.otro || "Sin especificar") : espDe(l.esp).n; }
function sciLote(l){ return l.esp === "OTR" ? "" : espDe(l.esp).c; }

// El código se arma con la sigla de la especie, el año y mes de inoculación y un
// correlativo. Se puede editar a mano; lo único obligatorio es que no se repita.
function limpiarCod(c){
  return String(c || "").toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9\-_.]/g,"").slice(0,24);
}
function siglaDe(esp, otro){
  if(esp !== "OTR") return esp;
  var s = limpiarCod(otro).replace(/[^A-Z0-9]/g,"").slice(0,3);
  return s.length >= 2 ? s : "OTR";
}
function nuevoCodigo(esp, fecha, otro, ignorar){
  var p = String(fecha || hoyISO()).split("-");
  var raiz = siglaDe(esp, otro) + "-" + p[0].slice(2) + p[1] + "-";
  var max = 0;
  DB.lotes.forEach(function(l){
    if(l.id === ignorar) return;
    var m = String(l.cod).toUpperCase().indexOf(raiz) === 0 ? String(l.cod).slice(raiz.length) : null;
    if(m != null && /^\d+$/.test(m)) max = Math.max(max, Number(m));
  });
  return raiz + String(max+1).padStart(2,"0");
}
function codLibre(cod, ignorar){
  var otro = lotePorCod(cod);
  return !otro || otro.id === ignorar;
}

// Eventos en orden cronológico; el índice desempata cuando comparten fecha.
function evsOrden(l){
  return l.ev.map(function(e,i){ return {e:e, i:i}; })
    .sort(function(a,b){ return a.e.f === b.e.f ? a.i - b.i : (a.e.f < b.e.f ? -1 : 1); })
    .map(function(x){ return x.e; });
}
// Una cosecha con número de bolsa (`b`) es de esa bolsa; sin él, del lote entero.
// Las dos formas conviven y suman al mismo total.
function cosechas(l){ return evsOrden(l).filter(function(e){ return e.t === "cos"; }); }
function cosechasLote(l){ return cosechas(l).filter(function(e){ return !e.b; }); }
function cosechasBolsa(l){ return cosechas(l).filter(function(e){ return !!e.b; }); }
function kgLote(l){
  var t = 0;
  l.ev.forEach(function(e){ if(e.t === "cos") t += Number(e.kg) || 0; });
  return t;
}

/* --- Seguimiento bolsa por bolsa --- */

function cosechaDe(l, bolsa, oleada){
  return l.ev.filter(function(e){
    return e.t === "cos" && Number(e.b) === Number(bolsa) && Number(e.o) === Number(oleada);
  })[0];
}
function bolsaDescartada(l, n){
  return l.ev.some(function(e){ return e.t === "cont" && Number(e.b) === Number(n); });
}
// Hasta dónde llega la numeración: las bolsas declaradas, o más si quedaron registros.
function totalBolsas(l){
  var max = Number(l.bolsas) || 0;
  l.ev.forEach(function(e){ if(e.b && Number(e.b) > max) max = Number(e.b); });
  return max;
}
function oleadasBolsa(l){
  var os = {};
  cosechasBolsa(l).forEach(function(e){ os[Number(e.o) || 1] = true; });
  var ks = Object.keys(os).map(Number).sort(function(a,b){ return a-b; });
  return ks;
}
function siguienteOleada(l){
  var os = oleadasBolsa(l);
  return os.length ? os[os.length-1] : 1;
}
// Oleadas de verdad: las del lote entero más las que se pesaron bolsa por bolsa.
// Veinte bolsas de la misma tanda son una oleada, no veinte.
function numOleadas(l){ return cosechasLote(l).length + oleadasBolsa(l).length; }

// Kilos acumulados de cada bolsa con registro propio, y su estadística.
function statsBolsas(l){
  var mapa = {};
  l.ev.forEach(function(e){
    if(e.t !== "cos" || !e.b) return;
    var n = Number(e.b);
    mapa[n] = (mapa[n] || 0) + (Number(e.kg) || 0);
  });
  var nums = Object.keys(mapa).map(Number).sort(function(a,b){ return a - b; });
  var pesos = nums.map(function(n){ return mapa[n]; });
  var total = 0, min = null, max = null;
  pesos.forEach(function(p){
    total += p;
    if(min == null || p < min) min = p;
    if(max == null || p > max) max = p;
  });
  return {
    mapa: mapa, nums: nums, pesos: pesos, n: pesos.length, total: total,
    prom: pesos.length ? total / pesos.length : null, min: min, max: max
  };
}

// Promedio por bolsa agrupado por hongo y cepa: lo que sirve para saber qué esperar.
// Si una cepa tiene bolsas medidas una a una, manda esa medición; si no, se estima
// dividiendo lo del lote por sus bolsas, y queda marcado como estimación.
function promedioPorCepa(){
  var m = {};
  DB.lotes.forEach(function(l){
    var clave = nomLote(l) + (l.cepa ? " · " + l.cepa : "");
    var g = m[clave];
    if(!g) g = m[clave] = {n:clave, pesos:[], kg:0, bolsas:0, lotes:0};
    g.lotes++;
    var s = statsBolsas(l);
    if(s.n){
      s.pesos.forEach(function(p){ g.pesos.push(p); });
    } else {
      var k = kgLote(l), b = bolsasVivas(l);
      if(k > 0 && b > 0){ g.kg += k; g.bolsas += b; }
    }
  });
  var filas = [];
  for(var k in m){
    var g = m[k], fila = null;
    if(g.pesos.length){
      var t = 0, mn = null, mx = null;
      g.pesos.forEach(function(p){
        t += p;
        if(mn == null || p < mn) mn = p;
        if(mx == null || p > mx) mx = p;
      });
      fila = {n:g.n, prom:(t/g.pesos.length)*1000, bolsas:g.pesos.length, min:mn*1000, max:mx*1000, medido:true, lotes:g.lotes};
    } else if(g.bolsas){
      fila = {n:g.n, prom:(g.kg/g.bolsas)*1000, bolsas:g.bolsas, medido:false, lotes:g.lotes};
    }
    if(fila) filas.push(fila);
  }
  return filas.sort(function(a,b){ return b.prom - a.prom; });
}
function descartadas(l){
  var t = 0;
  l.ev.forEach(function(e){ if(e.t === "cont") t += Number(e.n) || 0; });
  return t;
}
function bolsasVivas(l){ return Math.max(0, (Number(l.bolsas)||0) - descartadas(l)); }

// Rendimiento por bolsa en gramos: lo que importa al comparar lotes entre sí.
function rendBolsa(l){
  var b = bolsasVivas(l), k = kgLote(l);
  if(!b || !k) return null;
  return (k / b) * 1000;
}
// Rendimiento sobre el sustrato (fresco/húmedo), solo si se cargó el peso por bolsa.
function rendPct(l){
  var b = bolsasVivas(l), p = Number(l.peso) || 0, k = kgLote(l);
  if(!b || !p || !k) return null;
  return (k / (b*p)) * 100;
}
function fechaDeEstado(l, k){
  var e = evsOrden(l).filter(function(x){ return x.t === "est" && x.a === k; })[0];
  return e ? e.f : null;
}
function fotosDe(l){
  var out = [];
  evsOrden(l).forEach(function(e){
    (e.fotos || []).forEach(function(f){ out.push({id:f, ev:e}); });
  });
  return out.reverse();
}

// Estimación de cuándo toca cosechar. Son días típicos por especie, no una promesa.
function estimado(l){
  if(CERRADOS[l.est] || l.est === "prep") return null;
  var e = espDe(l.esp), cs = cosechas(l);
  if(l.est === "cose"){
    if(!cs.length) return null;
    return {f:sumarDias(cs[cs.length-1].f, 14), txt:"próxima oleada"};
  }
  var ff = fechaDeEstado(l, "fruc");
  if(ff) return {f:sumarDias(ff, e.fru), txt:"primera cosecha"};
  if(!l.finoc) return null;
  return {f:sumarDias(l.finoc, e.inc + e.fru), txt:"primera cosecha"};
}

function lotesActivos(){ return DB.lotes.filter(function(l){ return !CERRADOS[l.est]; }); }
function lotesEn(k){ return DB.lotes.filter(function(l){ return l.est === k; }); }

function proximos(dias){
  var lim = sumarDias(hoyISO(), dias == null ? 7 : dias);
  return lotesActivos().map(function(l){ return {l:l, e:estimado(l)}; })
    .filter(function(x){ return x.e && x.e.f <= lim; })
    .sort(function(a,b){ return a.e.f < b.e.f ? -1 : 1; });
}

// Producción cosechada en una ventana de días (todas las cosechas de todos los lotes).
function producido(dias){
  var desde = dias ? sumarDias(hoyISO(), -dias) : null, t = 0;
  DB.lotes.forEach(function(l){
    l.ev.forEach(function(e){
      if(e.t !== "cos") return;
      if(desde && e.f < desde) return;
      t += Number(e.kg) || 0;
    });
  });
  return t;
}
function porEspecie(dias){
  var desde = sumarDias(hoyISO(), -dias), acum = {}, max = 0, filas = [];
  DB.lotes.forEach(function(l){
    l.ev.forEach(function(e){
      if(e.t !== "cos" || e.f < desde) return;
      var n = nomLote(l);
      acum[n] = (acum[n] || 0) + (Number(e.kg) || 0);
    });
  });
  for(var n in acum) filas.push({n:n, v:acum[n]});
  filas.sort(function(a,b){ return b.v - a.v; });
  filas.forEach(function(f){ if(f.v > max) max = f.v; });
  return {filas:filas, max:max || 1};
}

function ordenarLotes(f){
  var l = DB.lotes.slice();
  if(f === "act") l = l.filter(function(x){ return !CERRADOS[x.est]; });
  else if(f !== "todos") l = l.filter(function(x){ return x.est === f; });
  return l.sort(function(a,b){
    var ca = CERRADOS[a.est] ? 1 : 0, cb = CERRADOS[b.est] ? 1 : 0;
    if(ca !== cb) return ca - cb;
    if(ca === 1) return (b.finoc || "") < (a.finoc || "") ? -1 : 1;
    var ea = estimado(a), eb = estimado(b);
    if(ea && eb && ea.f !== eb.f) return ea.f < eb.f ? -1 : 1;
    if(ea && !eb) return -1;
    if(!ea && eb) return 1;
    return (a.finoc || "") < (b.finoc || "") ? 1 : -1;
  });
}

function agregarEvento(l, ev){
  ev.id = nuevoId();
  if(!ev.f) ev.f = hoyISO();
  if(!ev.fotos) ev.fotos = [];
  l.ev.push(ev);
  return ev;
}

// Cambiar de estado deja siempre rastro en el historial. Devuelve el evento
// creado, o null si el lote ya estaba en ese estado.
function ponerEstado(l, k, fecha, txt){
  if(l.est === k && fechaDeEstado(l, k)) return null;
  l.est = k;
  return agregarEvento(l, {t:"est", a:k, f:fecha || hoyISO(), txt:txt || ""});
}

function tituloEvento(l, e){
  if(e.t === "est")  return "Pasó a " + estDe(e.a).n;
  if(e.t === "cos"){
    if(e.b) return "Bolsa " + e.b + " · " + (e.o || 1) + "ª oleada · " + kg(e.kg) + " kg";
    var cs = cosechasLote(l), i = 0;
    for(var k=0; k<cs.length; k++) if(cs[k].id === e.id) i = k+1;
    return "Cosecha " + (i ? i + "ª oleada · " : "") + kg(e.kg) + " kg";
  }
  if(e.t === "cont"){
    if(e.b) return "Bolsa " + e.b + " descartada";
    return "Descarte de " + (Number(e.n)||0) + " bolsas";
  }
  if(e.t === "nota") return "Observación";
  return "Fotografía";
}

/* ============================================================
   10. Fotografías (IndexedDB, con respaldo en localStorage)
   ============================================================ */

var FOTOS = (function(){
  var db = null, listo = false, cola = [];

  function conectar(cb){
    if(listo){ cb(db); return; }
    cola.push(cb);
    if(cola.length > 1) return;
    var req;
    try{ req = indexedDB.open("hds_fotos", 1); }
    catch(err){ terminar(null); return; }
    req.onupgradeneeded = function(){ try{ req.result.createObjectStore("f"); }catch(err){} };
    req.onsuccess = function(){ terminar(req.result); };
    req.onerror   = function(){ terminar(null); };
    // Si el navegador bloquea IndexedDB (modo privado, archivo local), seguimos igual.
    setTimeout(function(){ if(!listo) terminar(null); }, 2500);
  }
  function terminar(d){
    db = d; listo = true;
    var c = cola; cola = [];
    c.forEach(function(f){ f(db); });
  }
  function almacen(modo){ return db.transaction("f", modo).objectStore("f"); }

  function guardarF(id, dato, cb){
    conectar(function(d){
      if(!d){
        try{ localStorage.setItem("hds_foto_" + id, dato); cb && cb(true); }
        catch(err){ cb && cb(false); }
        return;
      }
      try{
        var r = almacen("readwrite").put(dato, id);
        r.onsuccess = function(){ cb && cb(true); };
        r.onerror   = function(){ cb && cb(false); };
      }catch(err){ cb && cb(false); }
    });
  }
  function leerF(id, cb){
    conectar(function(d){
      if(!d){ cb(localStorage.getItem("hds_foto_" + id)); return; }
      try{
        var r = almacen("readonly").get(id);
        r.onsuccess = function(){ cb(r.result || null); };
        r.onerror   = function(){ cb(null); };
      }catch(err){ cb(null); }
    });
  }
  function borrarF(id){
    conectar(function(d){
      if(!d){ try{ localStorage.removeItem("hds_foto_" + id); }catch(err){} return; }
      try{ almacen("readwrite").delete(id); }catch(err){}
    });
  }
  // Para el respaldo: devuelve {id: dataURL} leyendo de a una.
  function varias(ids, cb){
    var out = {}, i = 0;
    (function paso(){
      if(i >= ids.length){ cb(out); return; }
      var id = ids[i++];
      leerF(id, function(d){ if(d) out[id] = d; paso(); });
    })();
  }
  function poner(obj, cb){
    var ids = Object.keys(obj || {}), i = 0;
    (function paso(){
      if(i >= ids.length){ cb && cb(); return; }
      var id = ids[i++];
